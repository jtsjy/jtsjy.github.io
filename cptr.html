20px, 1.8vw, 26px);\n    }\n\n    .arrows {\n      position: absolute;\n      inset: 0;\n      width: 100%;\n      height: 100%;\n      overflow: visible;\n      color: var(--line);\n      pointer-events: none;\n    }\n\n    .arrows[hidden] {\n      display: none;\n    }\n\n    .status {\n      min-height: 3em;\n      margin: 16px 0 0;\n      color: var(--purple);\n      font: 700 clamp(15px, 1.48vw, 20px) / 1.5 var(--serif);\n    }\n\n    .terminal {\n      margin-top: 11px;\n      overflow: hidden;\n      border: 2px solid var(--line);\n      border-radius: 10px;\n      background: var(--tint);\n      color: var(--purple);\n    }\n\n    .terminal label {\n      display: block;\n      padding: 8px 14px;\n      border-bottom: 1px solid #d8c5e8;\n      font-size: clamp(15px, 1.45vw, 19px);\n      font-weight: 700;\n    }\n\n    .command {\n      display: flex;\n      flex-wrap: wrap;\n      align-items: center;\n      gap: 0.65em;\n      min-height: 54px;\n      padding: 4px 14px;\n      font: 400 clamp(20px, 2vw, 27px) / 1.35 var(--mono);\n    }\n\n    #history {\n      max-width: 100%;\n      overflow-wrap: anywhere;\n      white-space: pre-wrap;\n    }\n\n    #input {\n      flex: 1 0 100px;\n      min-width: 0;\n      padding: 4px;\n      border: 0;\n      border-radius: 4px;\n      background: transparent;\n      color: inherit;\n      font: inherit;\n    }\n\n    #input:focus-visible {\n      outline: 1px solid var(--line);\n    }\n\n    #input:disabled {\n      display: none;\n    }\n\n    button {\n      padding: 0.38em 1.05em;\n      border: 1px solid var(--line);\n      border-radius: 5px;\n      background: #fff;\n      color: var(--purple);\n      font: 700 clamp(16px, 1.55vw, 21px) / 1.35 var(--serif);\n      cursor: pointer;\n    }\n\n    button:hover:not(:disabled) {\n      background: var(--tint);\n    }\n\n    button:disabled {\n      opacity: 0.5;\n      cursor: default;\n    }\n\n    button:focus-visible {\n      outline: 2px solid var(--purple);\n      outline-offset: 3px;\n    }\n\n    @media (max-width: 740px) {\n      main {\n        grid-template-columns: minmax(0, 1fr);\n        row-gap: 30px;\n      }\n\n      .panel {\n        grid-row: auto;\n        grid-template-rows: auto auto;\n        gap: 14px;\n      }\n    }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain aria-label=\"用指针遍历数组并读入整数\">\n    \u003csection class=\"panel\" aria-labelledby=\"file\">\n      \u003cfigure>\n        \u003cfigcaption id=\"file\">6.c\u003c/figcaption>\n        \u003cpre>\u003ccode>#include &lt;stdio.h&gt;\nint main()\n{\n\tint a[3];\n\tint *p;\n\tfor(\u003cspan id=\"initialize\">p=a\u003c/span>;\u003cspan id=\"test\">p!=a+3\u003c/span>;\u003cspan id=\"advance\">p++\u003c/span>)\n\t\t\u003cspan id=\"scan\">scanf(\u003cspan class=\"format\">\"%d\"\u003c/span>,p);\u003c/span>\n\treturn 0;\n}\u003c/code>\u003c/pre>\n      \u003c/figure>\n      \u003cbutton type=\"button\" id=\"run\">单步运行\u003c/button>\n    \u003c/section>\n\n    \u003csection class=\"panel\" aria-label=\"数组与命令行\">\n      \u003cdiv class=\"demo\">\n        \u003cdiv class=\"diagram\">\n          \u003cdl class=\"array\" aria-label=\"数组 a\">\n            \u003cdiv>\u003cdt>a[0]\u003c/dt>\u003cdd>—\u003c/dd>\u003c/div>\n            \u003cdiv>\u003cdt>a[1]\u003c/dt>\u003cdd>—\u003c/dd>\u003c/div>\n            \u003cdiv>\u003cdt>a[2]\u003c/dt>\u003cdd>—\u003c/dd>\u003c/div>\n          \u003c/dl>\n          \u003cspan class=\"end\">a + 3\u003c/span>\n          \u003cdl class=\"pointer\">\u003cdt>p\u003c/dt>\u003cdd>—\u003c/dd>\u003c/dl>\n          \u003csvg class=\"arrows\" aria-hidden=\"true\" hidden>\n            \u003cdefs>\n              \u003cmarker id=\"arrowhead\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\">\n                \u003cpath d=\"M 0 0 L 10 5 L 0 10 Z\" fill=\"currentColor\" />\n              \u003c/marker>\n            \u003c/defs>\n            \u003cpath id=\"pointer-arrow\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.25\" marker-end=\"url(#arrowhead)\" />\n          \u003c/svg>\n        \u003c/div>\n        \u003cp class=\"status\" id=\"status\" role=\"status\">点击「单步运行」开始。\u003c/p>\n        \u003cform class=\"terminal\" id=\"terminal\">\n          \u003clabel for=\"input\">命令行输入\u003c/label>\n          \u003cdiv class=\"command\">\n            \u003ccode id=\"history\">\u003c/code>\n            \u003cinput id=\"input\" type=\"text\" autocomplete=\"off\" spellcheck=\"false\" aria-describedby=\"status\" disabled>\n          \u003c/div>\n        \u003c/form>\n      \u003c/div>\n      \u003cbutton type=\"button\" id=\"reset\">复位\u003c/button>\n    \u003c/section>\n  \u003c/main>\n  \u003cscript>\n    const diagram = document.querySelector(\".diagram\");\n    const cells = Array.from(diagram.querySelectorAll(\".array dd\"));\n    const pointer = diagram.querySelector(\".pointer dd\");\n    const end = diagram.querySelector(\".end\");\n    const arrows = diagram.querySelector(\".arrows\");\n    const arrow = diagram.querySelector(\"#pointer-arrow\");\n    const status = document.querySelector(\"#status\");\n    const run = document.querySelector(\"#run\");\n    const input = document.querySelector(\"#input\");\n    const historyLine = document.querySelector(\"#history\");\n    let index = -1;\n    let phase = \"initialize\";\n\n    function highlight(id, message, writtenIndex = -1) {\n      document.querySelector(\".current\")?.classList.remove(\"current\");\n      if (id) document.getElementById(id).classList.add(\"current\");\n      cells.forEach((cell, i) => cell.parentElement.classList.toggle(\"written\", i === writtenIndex));\n      status.textContent = message;\n    }\n\n    function positionArrow() {\n      if (index \u003c 0) return;\n      const bounds = diagram.getBoundingClientRect();\n      const source = pointer.getBoundingClientRect();\n      const target = (cells[index] ?? end).getBoundingClientRect();\n      const x1 = source.left + source.width / 2 - bounds.left;\n      const y1 = source.top - bounds.top;\n      const x2 = target.left + (cells[index] ? target.width / 2 : 4) - bounds.left;\n      const y2 = cells[0].getBoundingClientRect().bottom - bounds.top + 4;\n      const mid = (y1 + y2) / 2;\n      arrow.setAttribute(\"d\", `M ${x1} ${y1} C ${x1} ${mid}, ${x2} ${mid}, ${x2} ${y2}`);\n    }\n\n    function showPointer() {\n      pointer.textContent = index \u003c 0 ? \"—\" : index === cells.length ? \"a + 3\" : `&a[${index}]`;\n      end.classList.toggle(\"active\", index === cells.length);\n      arrows.toggleAttribute(\"hidden\", index \u003c 0);\n      positionArrow();\n    }\n\n    function storeInput() {\n      const text = input.value.trim();\n      if (!/^[+-]?\\d+$/.test(text) || Number(text) \u003c -2147483648 || Number(text) > 2147483647) {\n        status.textContent = \"请输入一个 32 位有符号整数，再按回车。\";\n        input.focus();\n        return;\n      }\n\n      const value = String(Number(text));\n      cells[index].textContent = value;\n      cells[index].classList.toggle(\"long-value\", value.length > 7);\n      historyLine.textContent += (historyLine.textContent ? \" \" : \"\") + value;\n      input.value = \"\";\n      input.disabled = true;\n      phase = \"advance\";\n      highlight(\"scan\", `scanf 把 ${value} 写进 a[${index}]。`, index);\n      run.focus();\n    }\n\n    run.addEventListener(\"click\", () => {\n      switch (phase) {\n        case \"initialize\":\n          index = 0;\n          showPointer();\n          highlight(\"initialize\", \"p 指向首元素 a[0]。\");\n          phase = \"test\";\n          break;\n        case \"test\":\n          if (index === cells.length) {\n            highlight(\"test\", \"p 等于 a + 3，循环结束。这里已经没有元素。\");\n            run.disabled = true;\n            phase = \"done\";\n          } else {\n            highlight(\"test\", \"p 还没到 a + 3，继续执行循环。\");\n            phase = \"scan\";\n          }\n          break;\n        case \"scan\":\n          input.disabled = false;\n          highlight(\"scan\", `输入一个整数，按回车写进 a[${index}]。`);\n          phase = \"waiting\";\n          input.focus();\n          break;\n        case \"waiting\":\n          storeInput();\n          break;\n        case \"advance\":\n          index++;\n          showPointer();\n          highlight(\"advance\", index === cells.length ? \"p 前进到最后一个元素之后。\" : `p 前进一格，指向 a[${index}]。`);\n          phase = \"test\";\n          break;\n      }\n    });\n\n    document.querySelector(\"#terminal\").addEventListener(\"submit\", event => {\n      event.preventDefault();\n      if (phase === \"waiting\") storeInput();\n    });\n\n    document.querySelector(\"#reset\").addEventListener(\"click\", () => {\n      index = -1;\n      phase = \"initialize\";\n      cells.forEach(cell => {\n        cell.textContent = \"—\";\n        cell.classList.remove(\"long-value\");\n      });\n      input.value = \"\";\n      input.disabled = true;\n      historyLine.textContent = \"\";\n      run.disabled = false;\n      highlight(null, \"点击「单步运行」开始。\");\n      showPointer();\n    });\n\n    window.addEventListener(\"resize\", positionArrow);\n  \u003c/script>\n\u003c/body>\n\u003c/html>\n"},
    {"name":"P12","title":"数组作为函数参数","html":"\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003ctitle>数组作为函数参数\u003c/title>\n  \u003cstyle>\n    :root {\n      --purple: #56268a;\n      --line: #8a5cb1;\n      --tint: #f7f1fc;\n      --gray: #77747c;\n      --serif: \"Noto Serif SC\", \"Source Han Serif SC\", \"Songti SC\", SimSun, \"宋体\", serif;\n      --mono: Consolas, \"Courier New\", monospace;\n    }\n\n    body {\n      margin: 0;\n      background: #fff;\n      font-family: var(--serif);\n    }\n\n    main {\n      box-sizing: border-box;\n      display: grid;\n      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);\n      align-items: center;\n      align-content: center;\n      gap: clamp(30px, 6vw, 90px);\n      width: min(100%, 1330px);\n      min-height: 100svh;\n      margin-inline: auto;\n      padding: 32px clamp(20px, 6vw, 88px);\n    }\n\n    figure {\n      width: max-content;\n      max-width: 100%;\n      margin: 0 auto;\n    }\n\n    figcaption {\n      margin-bottom: 0.7em;\n      color: var(--purple);\n      font-size: clamp(16px, 1.65vw, 24px);\n      font-weight: 700;\n    }\n\n    pre {\n      margin: 0;\n      color: var(--gray);\n      font: 400 clamp(15px, min(2.05vw, 3.8vh), 28px) / 1.44 var(--mono);\n      tab-size: 4;\n    }\n\n    code {\n      font-family: var(--mono);\n    }\n\n    pre code {\n      font: inherit;\n    }\n\n    .focus {\n      outline: 1.5px solid var(--line);\n      outline-offset: 0.13em;\n      border-radius: 2px;\n      background: var(--tint);\n      color: #000;\n    }\n\n    .controls {\n      display: flex;\n      justify-content: center;\n      gap: 14px;\n      margin-top: 27px;\n    }\n\n    button {\n      padding: 0.38em 1.05em;\n      border: 1px solid var(--line);\n      border-radius: 5px;\n      background: #fff;\n      color: var(--purple);\n      font: 700 clamp(16px, 1.55vw, 21px) / 1.35 var(--serif);\n      cursor: pointer;\n    }\n\n    button:hover,\n    button[aria-pressed=\"true\"] {\n      background: var(--tint);\n    }\n\n    button:focus-visible {\n      outline: 2px solid var(--purple);\n      outline-offset: 3px;\n    }\n\n    .result {\n      width: min(100%, 475px);\n      justify-self: center;\n    }\n\n    .array {\n      display: grid;\n      grid-template-columns: repeat(3, minmax(0, 1fr));\n      margin: 0;\n      font-family: var(--mono);\n      text-align: center;\n    }\n\n    dt {\n      margin-bottom: 8px;\n      color: var(--gray);\n      font-size: clamp(16px, 1.65vw, 23px);\n    }\n\n    dd {\n      box-sizing: border-box;\n      display: grid;\n      height: clamp(72px, 8vw, 104px);\n      margin: 0;\n      place-items: center;\n      border: 2px solid #b3afb7;\n      background: #fff;\n      color: #29252d;\n      font-size: clamp(24px, 2.9vw, 42px);\n    }\n\n    .array > div + div dd {\n      border-left: 0;\n    }\n\n    .array > div:first-child dd {\n      border-radius: 5px 0 0 5px;\n    }\n\n    .array > div:last-child dd {\n      border-radius: 0 5px 5px 0;\n    }\n\n    .array.updated dd {\n      border-color: var(--line);\n      background: var(--tint);\n      color: var(--purple);\n    }\n\n    .status {\n      margin: 17px 0 0;\n      color: var(--purple);\n      font-weight: 700;\n      font-size: clamp(16px, 1.55vw, 21px);\n      text-align: center;\n    }\n\n    @media (max-width: 730px) {\n      main {\n        grid-template-columns: minmax(0, 1fr);\n      }\n    }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain aria-label=\"数组作为函数参数\">\n    \u003csection aria-labelledby=\"filename\">\n      \u003cfigure>\n        \u003cfigcaption id=\"filename\">7-1.c\u003c/figcaption>\n        \u003cpre id=\"example\">\u003ccode>#include &lt;stdio.h&gt;\nvoid add_one(\u003cspan class=\"focus\">\u003cb>int\u003c/b> \u003cspan id=\"parameter\">a[]\u003c/span>\u003c/span>,int n)\n{\n\tint i;\n\tfor(i=0;i&lt;n;i++)\n\t\t\u003cspan class=\"focus\">a[i]++;\u003c/span>\n}\nint main()\n{\n\tint nums[]={10,20,30};\n\tadd_one(\u003cspan class=\"focus\" id=\"argument\">nums\u003c/span>,3);\n\treturn 0;\n}\u003c/code>\u003c/pre>\n      \u003c/figure>\n      \u003cdiv class=\"controls\">\n        \u003cbutton type=\"button\" id=\"run\" aria-controls=\"array\">运行\u003c/button>\n        \u003cbutton type=\"button\" id=\"equivalent\" aria-controls=\"example\" aria-pressed=\"false\">等价\u003c/button>\n      \u003c/div>\n    \u003c/section>\n    \u003csection class=\"result\" aria-label=\"数组运行结果\">\n      \u003cdl class=\"array\" id=\"array\">\n        \u003cdiv>\u003cdt>nums[0]\u003c/dt>\u003cdd>10\u003c/dd>\u003c/div>\n        \u003cdiv>\u003cdt>nums[1]\u003c/dt>\u003cdd>20\u003c/dd>\u003c/div>\n        \u003cdiv>\u003cdt>nums[2]\u003c/dt>\u003cdd>30\u003c/dd>\u003c/div>\n      \u003c/dl>\n      \u003cp class=\"status\" id=\"status\" role=\"status\">运行前\u003c/p>\n    \u003c/section>\n  \u003c/main>\n  \u003cscript>\n    const parameter = document.querySelector(\"#parameter\");\n    const argument = document.querySelector(\"#argument\");\n    const equivalentButton = document.querySelector(\"#equivalent\");\n    const array = document.querySelector(\"#array\");\n    const cells = array.querySelectorAll(\"dd\");\n    const initialValues = Array.from(cells, cell => Number(cell.textContent));\n    const status = document.querySelector(\"#status\");\n\n    equivalentButton.addEventListener(\"click\", () => {\n      const equivalent = equivalentButton.getAttribute(\"aria-pressed\") === \"false\";\n      parameter.textContent = equivalent ? \"*a\" : \"a[]\";\n      argument.textContent = equivalent ? \"&nums[0]\" : \"nums\";\n      equivalentButton.setAttribute(\"aria-pressed\", String(equivalent));\n    });\n\n    document.querySelector(\"#run\").addEventListener(\"click\", () => {\n      cells.forEach((cell, i) => { cell.textContent = initialValues[i] + 1; });\n      array.classList.add(\"updated\");\n      status.textContent = \"运行结束\";\n    });\n  \u003c/script>\n\u003c/body>\n\u003c/html>\n"},
    {"name":"P13","title":"指针自增与解引用","html":"\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003ctitle>指针自增与解引用\u003c/title>\n  \u003cstyle>\n    :root {\n      --purple: #56268a;\n      --line: #8a5cb1;\n      --tint: #f7f1fc;\n      --gray: #77747c;\n      --serif: \"Noto Serif SC\", \"Source Han Serif SC\", \"Songti SC\", SimSun, \"宋体\", serif;\n      --mono: Consolas, \"Courier New\", monospace;\n    }\n\n    body {\n      margin: 0;\n      background: #fff;\n      font-family: var(--serif);\n    }\n\n    main {\n      box-sizing: border-box;\n      display: grid;\n      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);\n      align-content: center;\n      gap: 24px clamp(26px, 5vw, 78px);\n      width: min(100%, 1360px);\n      min-height: 100svh;\n      margin-inline: auto;\n      padding: 28px clamp(20px, 4vw, 60px);\n    }\n\n    .panel {\n      display: grid;\n      grid-row: span 2;\n      grid-template-rows: subgrid;\n      justify-items: center;\n      align-items: center;\n      min-width: 0;\n    }\n\n    .code-panel,\n    .demo {\n      width: 100%;\n    }\n\n    .chooser {\n      display: flex;\n      gap: 10px;\n      margin-bottom: 24px;\n    }\n\n    button {\n      padding: 0.38em 1.05em;\n      border: 1px solid var(--line);\n      border-radius: 5px;\n      background: #fff;\n      color: var(--purple);\n      font: 700 clamp(16px, 1.55vw, 21px) / 1.35 var(--serif);\n      cursor: pointer;\n    }\n\n    button:hover:not(:disabled),\n    button[aria-pressed=\"true\"] {\n      background: var(--tint);\n    }\n\n    button[aria-pressed=\"true\"] {\n      border-color: var(--purple);\n    }\n\n    button:focus-visible {\n      outline: 2px solid var(--purple);\n      outline-offset: 3px;\n    }\n\n    button:disabled {\n      opacity: 0.5;\n      cursor: default;\n    }\n\n    pre {\n      margin: 0;\n      color: var(--gray);\n      font: 400 clamp(14px, min(1.84vw, 3.65vh), 26px) / 1.56 var(--mono);\n      tab-size: 4;\n    }\n\n    code {\n      font-family: var(--mono);\n    }\n\n    pre code {\n      font: inherit;\n    }\n\n    .current-code {\n      outline: 1.5px solid var(--line);\n      outline-offset: 0.13em;\n      border-radius: 2px;\n      background: var(--tint);\n      color: #000;\n    }\n\n    .diagram {\n      position: relative;\n      font-family: var(--mono);\n    }\n\n    .array,\n    .variables {\n      display: grid;\n      margin: 0;\n      text-align: center;\n    }\n\n    .array {\n      grid-template-columns: repeat(4, minmax(0, 1fr));\n    }\n\n    .variables {\n      grid-template-columns: repeat(2, minmax(0, 1fr));\n      margin-top: 68px;\n    }\n\n    dt {\n      color: var(--gray);\n      font-size: clamp(16px, 1.6vw, 21px);\n    }\n\n    dd {\n      box-sizing: border-box;\n      display: grid;\n      height: 62px;\n      margin: 0;\n      place-items: center;\n      border: 2px solid #b3afb7;\n      background: #fff;\n      color: #29252d;\n      font-size: clamp(20px, 2.15vw, 30px);\n    }\n\n    .array dt {\n      margin-bottom: 6px;\n    }\n\n    .array > div + div dd {\n      border-left: 0;\n    }\n\n    .array > div:first-child dd {\n      border-radius: 5px 0 0 5px;\n    }\n\n    .array > div:last-child dd {\n      border-radius: 0 5px 5px 0;\n    }\n\n    .variable {\n      display: grid;\n      justify-items: center;\n      gap: 5px;\n    }\n\n    .variable dt {\n      grid-row: 2;\n    }\n\n    .variable dd {\n      grid-row: 1;\n      width: clamp(102px, 11vw, 142px);\n      height: 53px;\n      border-radius: 5px;\n    }\n\n    #pointer dd {\n      color: var(--purple);\n    }\n\n    .focus dd {\n      outline: 2px solid var(--line);\n      outline-offset: -2px;\n      background: var(--tint);\n      color: var(--purple);\n    }\n\n    .focus dt {\n      color: var(--purple);\n      font-weight: 700;\n    }\n\n    .arrows {\n      position: absolute;\n      inset: 0;\n      width: 100%;\n      height: 100%;\n      overflow: visible;\n      color: var(--line);\n      pointer-events: none;\n    }\n\n    .analysis {\n      margin-top: 20px;\n      border-top: 1px solid #dfd4e8;\n      color: var(--purple);\n    }\n\n    .expression {\n      margin: 12px 0 7px;\n      font-size: clamp(18px, 1.7vw, 24px);\n      font-weight: 700;\n    }\n\n    .parts {\n      display: grid;\n      gap: 4px;\n      margin: 0;\n    }\n\n    .part {\n      display: grid;\n      grid-template-columns: 6.35em minmax(0, 1fr);\n      align-items: baseline;\n      gap: 9px;\n      padding: 4px 8px;\n      border-radius: 4px;\n      color: var(--gray);\n      font-size: clamp(15px, 1.4vw, 19px);\n      line-height: 1.35;\n    }\n\n    .part.current {\n      background: var(--tint);\n      color: var(--purple);\n      font-weight: 700;\n    }\n\n    .part dd {\n      display: block;\n      height: auto;\n      border: 0;\n      background: transparent;\n      color: inherit;\n      font-size: inherit;\n    }\n\n    .part dt {\n      color: inherit;\n      font-size: inherit;\n    }\n\n    .status {\n      min-height: 1.5em;\n      margin: 9px 0 0;\n      font-size: clamp(15px, 1.4vw, 19px);\n      font-weight: 700;\n      line-height: 1.5;\n    }\n\n    @media (max-width: 780px) {\n      main {\n        grid-template-columns: minmax(0, 1fr);\n        max-width: 590px;\n      }\n\n      .panel {\n        grid-row: auto;\n        grid-template-rows: auto auto;\n        gap: 16px;\n      }\n    }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain aria-label=\"指针自增与解引用\">\n    \u003csection class=\"panel\" aria-label=\"代码\">\n      \u003cdiv class=\"code-panel\">\n        \u003cdiv class=\"chooser\" role=\"group\" aria-label=\"切换代码\">\n          \u003cbutton type=\"button\" data-mode=\"post\" aria-pressed=\"true\">8-1\u003c/button>\n          \u003cbutton type=\"button\" data-mode=\"pre\" aria-pressed=\"false\">8-2\u003c/button>\n          \u003cbutton type=\"button\" data-mode=\"value\" aria-pressed=\"false\">8-3\u003c/button>\n        \u003c/div>\n      \u003cpre data-code=\"post\">\u003ccode>#include &lt;bits/stdc++.h&gt;\nusing namespace std;\nint main()\n{\n\tint a[]={10,20,30,40},sum=0;\n\tint *p=&amp;a[0];\n\t\u003cspan data-condition>while(p&lt;&amp;a[2])\u003c/span>\n\t\t\u003cspan data-part=\"2\">sum+=\u003cspan data-part=\"1\">*\u003cspan data-part=\"0\">p++\u003c/span>\u003c/span>;\u003c/span>\n\treturn 0;\n}\u003c/code>\u003c/pre>\n      \u003cpre data-code=\"pre\" hidden>\u003ccode>#include &lt;bits/stdc++.h&gt;\nusing namespace std;\nint main()\n{\n\tint a[]={10,20,30,40},sum=0;\n\tint *p=&amp;a[0];\n\t\u003cspan data-condition>while(p&lt;&amp;a[2])\u003c/span>\n\t\t\u003cspan data-part=\"2\">sum+=\u003cspan data-part=\"1\">*\u003cspan data-part=\"0\">++p\u003c/span>\u003c/span>;\u003c/span>\n\treturn 0;\n}\u003c/code>\u003c/pre>\n      \u003cpre data-code=\"value\" hidden>\u003ccode>#include &lt;bits/stdc++.h&gt;\nusing namespace std;\nint main()\n{\n\tint a[]={10,20,30,40},sum=0;\n\tint *p=&amp;a[0];\n\t\u003cspan data-condition>while(p&lt;&amp;a[2])\u003c/span>\n\t\t\u003cspan data-part=\"2\">sum+=\u003cspan data-part=\"1\">++\u003cspan data-part=\"0\">*p\u003c/span>\u003c/span>;\u003c/span>\n\treturn 0;\n}\u003c/code>\u003c/pre>\n      \u003c/div>\n      \u003cbutton type=\"button\" id=\"run\">单步执行\u003c/button>\n    \u003c/section>\n\n    \u003csection class=\"panel\" aria-label=\"变量与表达式分析\">\n      \u003cdiv class=\"demo\">\n        \u003cdiv class=\"diagram\">\n          \u003cdl class=\"array\" aria-label=\"数组 a\">\n            \u003cdiv>\u003cdt>a[0]\u003c/dt>\u003cdd>10\u003c/dd>\u003c/div>\n            \u003cdiv>\u003cdt>a[1]\u003c/dt>\u003cdd>20\u003c/dd>\u003c/div>\n            \u003cdiv>\u003cdt>a[2]\u003c/dt>\u003cdd>30\u003c/dd>\u003c/div>\n            \u003cdiv>\u003cdt>a[3]\u003c/dt>\u003cdd>40\u003c/dd>\u003c/div>\n          \u003c/dl>\n          \u003cdl class=\"variables\">\n            \u003cdiv class=\"variable\" id=\"pointer\">\u003cdt>p\u003c/dt>\u003cdd>&amp;a[0]\u003c/dd>\u003c/div>\n            \u003cdiv class=\"variable\" id=\"sum\">\u003cdt>sum\u003c/dt>\u003cdd>0\u003c/dd>\u003c/div>\n          \u003c/dl>\n          \u003csvg class=\"arrows\" aria-hidden=\"true\">\n            \u003cdefs>\n              \u003cmarker id=\"arrowhead\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\">\n                \u003cpath d=\"M 0 0 L 10 5 L 0 10 Z\" fill=\"currentColor\" />\n              \u003c/marker>\n            \u003c/defs>\n            \u003cpath id=\"arrow\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.25\" marker-end=\"url(#arrowhead)\" />\n          \u003c/svg>\n        \u003c/div>\n        \u003cdiv class=\"analysis\">\n          \u003cp class=\"expression\">\u003ccode id=\"expanded\">\u003c/code>\u003c/p>\n          \u003cdl class=\"parts\">\n            \u003cdiv class=\"part\">\u003cdt>\u003ccode>\u003c/code>\u003c/dt>\u003cdd>—\u003c/dd>\u003c/div>\n            \u003cdiv class=\"part\">\u003cdt>\u003ccode>\u003c/code>\u003c/dt>\u003cdd>—\u003c/dd>\u003c/div>\n            \u003cdiv class=\"part\">\u003cdt>\u003ccode>\u003c/code>\u003c/dt>\u003cdd>—\u003c/dd>\u003c/div>\n          \u003c/dl>\n          \u003cp class=\"status\" id=\"status\" role=\"status\">\u003c/p>\n        \u003c/div>\n      \u003c/div>\n      \u003cbutton type=\"button\" id=\"reset\">复位\u003c/button>\n    \u003c/section>\n  \u003c/main>\n  \u003cscript>\n    const examples = {\n      post: {\n        expression: \"sum += *(p++)\",\n        parts: [\"p++\", \"*(p++)\", \"sum += …\"],\n        operations: [() => advancePointer(true), readElement]\n      },\n      pre: {\n        expression: \"sum += *(++p)\",\n        parts: [\"++p\", \"*(++p)\", \"sum += …\"],\n        operations: [() => advancePointer(false), readElement]\n      },\n      value: {\n        expression: \"sum += ++(*p)\",\n        parts: [\"*p\", \"++(*p)\", \"sum += …\"],\n        operations: [locateElement, incrementElement]\n      }\n    };\n\n    const diagram = document.querySelector(\".diagram\");\n    const cells = Array.from(diagram.querySelectorAll(\".array dd\"));\n    const pointer = document.querySelector(\"#pointer dd\");\n    const sumBox = document.querySelector(\"#sum dd\");\n    const arrow = document.querySelector(\"#arrow\");\n    const codePanels = document.querySelectorAll(\"[data-code]\");\n    const choices = document.querySelectorAll(\"[data-mode]\");\n    const rows = Array.from(document.querySelectorAll(\".part\"));\n    const expanded = document.querySelector(\"#expanded\");\n    const status = document.querySelector(\"#status\");\n    const run = document.querySelector(\"#run\");\n    let mode = \"post\";\n    let memory;\n    let phase;\n    let round;\n    let operandIndex;\n    let operandValue;\n\n    function advancePointer(useOldAddress) {\n      operandIndex = useOldAddress ? memory.index : memory.index + 1;\n      memory.index++;\n      showFocus(pointer);\n      const address = `&a[${operandIndex}]`;\n      return useOldAddress ? `取旧地址 ${address}，p 前进一格` : `p 前进一格，取新地址 ${address}`;\n    }\n\n    function readElement() {\n      operandValue = memory.values[operandIndex];\n      showFocus(cells[operandIndex]);\n      return `读取 a[${operandIndex}]，得到 ${operandValue}`;\n    }\n\n    function locateElement() {\n      operandIndex = memory.index;\n      showFocus(cells[operandIndex]);\n      return `找到 a[${operandIndex}]`;\n    }\n\n    function incrementElement() {\n      const old = memory.values[operandIndex];\n      operandValue = ++memory.values[operandIndex];\n      showFocus(cells[operandIndex]);\n      return `a[${operandIndex}] 从 ${old} 增为 ${operandValue}`;\n    }\n\n    function accumulate() {\n      const old = memory.sum;\n      memory.sum += operandValue;\n      showFocus(sumBox);\n      return `${old} + ${operandValue} = ${memory.sum}`;\n    }\n\n    function showFocus(box) {\n      box.parentElement.classList.add(\"focus\");\n    }\n\n    function updateMemory() {\n      cells.forEach((cell, i) => { cell.textContent = memory.values[i]; });\n      pointer.textContent = `&a[${memory.index}]`;\n      sumBox.textContent = memory.sum;\n      positionArrow();\n    }\n\n    function positionArrow() {\n      const bounds = diagram.getBoundingClientRect();\n      const from = pointer.getBoundingClientRect();\n      const to = cells[memory.index].getBoundingClientRect();\n      const x1 = from.left + from.width / 2 - bounds.left;\n      const x2 = to.left + to.width / 2 - bounds.left;\n      const y1 = from.top - bounds.top;\n      const y2 = to.bottom - bounds.top + 4;\n      const mid = (y1 + y2) / 2;\n      arrow.setAttribute(\"d\", `M ${x1} ${y1} C ${x1} ${mid}, ${x2} ${mid}, ${x2} ${y2}`);\n    }\n\n    function clearHighlights() {\n      for (const item of document.querySelectorAll(\".current-code, .part.current, .diagram .focus\")) {\n        item.classList.remove(\"current-code\", \"current\", \"focus\");\n      }\n    }\n\n    function clearResults() {\n      rows.forEach(row => { row.querySelector(\"dd\").textContent = \"—\"; });\n    }\n\n    function reset() {\n      memory = {values: [10, 20, 30, 40], index: 0, sum: 0};\n      phase = -1;\n      round = 0;\n      clearHighlights();\n      clearResults();\n      run.disabled = false;\n      status.textContent = \"点击「单步执行」开始。\";\n      updateMemory();\n    }\n\n    function select(nextMode) {\n      mode = nextMode;\n      for (const button of choices) button.setAttribute(\"aria-pressed\", String(button.dataset.mode === mode));\n      for (const panel of codePanels) panel.hidden = panel.dataset.code !== mode;\n      const example = examples[mode];\n      expanded.textContent = example.expression;\n      rows.forEach((row, i) => { row.querySelector(\"code\").textContent = example.parts[i]; });\n      reset();\n    }\n\n    run.addEventListener(\"click\", () => {\n      const code = document.querySelector(\"[data-code]:not([hidden])\");\n      clearHighlights();\n\n      if (phase === -1) {\n        code.querySelector(\"[data-condition]\").classList.add(\"current-code\");\n        if (memory.index >= 2) {\n          status.textContent = \"p 到达 &a[2]，循环结束。\";\n          run.disabled = true;\n        } else {\n          round++;\n          clearResults();\n          status.textContent = `第 ${round} 轮 · 条件成立`;\n          phase = 0;\n        }\n        return;\n      }\n\n      code.querySelector(`[data-part=\"${phase}\"]`).classList.add(\"current-code\");\n      const row = rows[phase];\n      row.classList.add(\"current\");\n      const operation = examples[mode].operations[phase] ?? accumulate;\n      row.querySelector(\"dd\").textContent = operation();\n      updateMemory();\n      if (phase === 2 && mode === \"value\") status.textContent = `第 ${round} 轮 · p 留在 a[0]，条件仍成立`;\n      phase = phase === 2 ? -1 : phase + 1;\n    });\n\n    for (const button of choices) {\n      button.addEventListener(\"click\", () => {\n        if (button.dataset.mode !== mode) select(button.dataset.mode);\n      });\n    }\n\n    document.querySelector(\"#reset\").addEventListener(\"click\", reset);\n    window.addEventListener(\"resize\", positionArrow);\n    select(mode);\n  \u003c/script>\n\u003c/body>\n\u003c/html>\n"},
    {"name":"P14","title":"函数指针","html":"\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003ctitle>函数指针\u003c/title>\n  \u003cstyle>\n    :root {\n      --purple: #56268a;\n      --line: #8a5cb1;\n      --tint: #f7f1fc;\n      --gray: #77747c;\n      --serif: \"Noto Serif SC\", \"Source Han Serif SC\", \"Songti SC\", SimSun, \"宋体\", serif;\n      --mono: Consolas, \"Courier New\", monospace;\n    }\n\n    body {\n      margin: 0;\n      background: #fff;\n      font-family: var(--serif);\n    }\n\n    main {\n      box-sizing: border-box;\n      display: grid;\n      grid-template-columns: minmax(0, 1.12fr) minmax(0, 1fr);\n      align-content: center;\n      gap: 25px clamp(28px, 5vw, 75px);\n      width: min(100%, 1360px);\n      min-height: 100svh;\n      margin-inline: auto;\n      padding: 30px clamp(20px, 5vw, 72px);\n    }\n\n    .panel {\n      display: grid;\n      grid-row: span 2;\n      grid-template-rows: subgrid;\n      justify-items: center;\n      align-items: center;\n      min-width: 0;\n    }\n\n    figure {\n      margin: 0;\n      max-width: 100%;\n    }\n\n    figcaption {\n      margin-bottom: 0.7em;\n      color: var(--purple);\n      font-size: clamp(16px, 1.6vw, 23px);\n      font-weight: 700;\n    }\n\n    pre {\n      margin: 0;\n      color: var(--gray);\n      font: 400 clamp(13px, min(1.84vw, 3.6vh), 26px) / 1.5 var(--mono);\n    }\n\n    code {\n      font-family: var(--mono);\n    }\n\n    pre code {\n      font: inherit;\n    }\n\n    .current {\n      outline: 1.5px solid var(--line);\n      outline-offset: 0.13em;\n      border-radius: 2px;\n      background: var(--tint);\n      color: #000;\n    }\n\n    .demo {\n      width: min(100%, 460px);\n    }\n\n    .diagram {\n      position: relative;\n      display: grid;\n      grid-template-columns: repeat(2, minmax(0, 1fr));\n      justify-items: center;\n      column-gap: 24px;\n      font-family: var(--mono);\n      text-align: center;\n    }\n\n    .type {\n      grid-column: 1 / -1;\n      margin: 0 0 10px;\n      color: var(--purple);\n      font-size: clamp(17px, 1.75vw, 24px);\n    }\n\n    .pointer {\n      display: grid;\n      grid-column: 1 / -1;\n      gap: 5px;\n      justify-items: center;\n      margin: 0 0 69px;\n    }\n\n    .pointer dt {\n      grid-row: 2;\n      color: var(--gray);\n      font-size: clamp(16px, 1.6vw, 21px);\n    }\n\n    .pointer dd {\n      box-sizing: border-box;\n      display: grid;\n      grid-row: 1;\n      width: 126px;\n      height: 56px;\n      margin: 0;\n      place-items: center;\n      border: 2px solid var(--line);\n      border-radius: 5px;\n      background: var(--tint);\n      color: var(--purple);\n      font-size: clamp(21px, 2.2vw, 30px);\n    }\n\n    .function {\n      box-sizing: border-box;\n      display: grid;\n      justify-items: center;\n      gap: 3px;\n      width: min(100%, 165px);\n      margin: 0;\n      padding: 9px 12px;\n      border: 2px solid #b3afb7;\n      border-radius: 6px;\n      color: #29252d;\n    }\n\n    .function dt {\n      font-size: clamp(22px, 2.1vw, 30px);\n    }\n\n    .function dd {\n      margin: 0;\n      color: var(--gray);\n      font-size: clamp(15px, 1.45vw, 20px);\n    }\n\n    .function.target {\n      border-color: var(--line);\n      background: var(--tint);\n      color: var(--purple);\n    }\n\n    .function.called {\n      border-color: var(--purple);\n      box-shadow: inset 0 0 0 1px var(--purple);\n    }\n\n    .arrows {\n      position: absolute;\n      inset: 0;\n      width: 100%;\n      height: 100%;\n      overflow: visible;\n      color: var(--line);\n      pointer-events: none;\n    }\n\n    .arrows[hidden] {\n      display: none;\n    }\n\n    .status {\n      margin: 14px 0 10px;\n      min-height: 1.5em;\n      color: var(--purple);\n      font: 700 clamp(16px, 1.5vw, 20px) / 1.5 var(--serif);\n      text-align: center;\n    }\n\n    .terminal {\n      display: grid;\n      grid-template-columns: auto 1fr;\n      align-items: start;\n      gap: 16px;\n      padding: 10px 13px;\n      border: 1.5px solid var(--line);\n      border-radius: 7px;\n      background: var(--tint);\n      color: var(--purple);\n      font-size: clamp(16px, 1.45vw, 20px);\n    }\n\n    output {\n      min-height: 2.75em;\n      white-space: pre-line;\n      font: 400 clamp(17px, 1.6vw, 22px) / 1.35 var(--mono);\n    }\n\n    button {\n      padding: 0.38em 1.05em;\n      border: 1px solid var(--line);\n      border-radius: 5px;\n      background: #fff;\n      color: var(--purple);\n      font: 700 clamp(16px, 1.55vw, 21px) / 1.35 var(--serif);\n      cursor: pointer;\n    }\n\n    button:hover:not(:disabled) {\n      background: var(--tint);\n    }\n\n    button:focus-visible {\n      outline: 2px solid var(--purple);\n      outline-offset: 3px;\n    }\n\n    button:disabled {\n      opacity: 0.5;\n      cursor: default;\n    }\n\n    @media (max-width: 740px) {\n      main {\n        grid-template-columns: minmax(0, 1fr);\n      }\n\n      .panel {\n        grid-row: auto;\n        grid-template-rows: auto auto;\n        gap: 16px;\n      }\n    }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain aria-label=\"函数指针\">\n    \u003csection class=\"panel\" aria-labelledby=\"filename\">\n      \u003cfigure>\n        \u003cfigcaption id=\"filename\">9.c\u003c/figcaption>\n        \u003cpre>\u003ccode>#include &lt;stdio.h&gt;\nint add(int x,int y){return x+y;}\nint sub(int x,int y){return x-y;}\nint main()\n{\n    \u003cspan data-step=\"1\">int (*op)(int,int)=add;\u003c/span>\n    \u003cspan data-step=\"2\">printf(\"%d\\n\",op(10,3));\u003c/span>\n    \u003cspan data-step=\"3\">op=sub;\u003c/span>\n    \u003cspan data-step=\"4\">printf(\"%d\\n\",op(10,3));\u003c/span>\n    return 0;\n}\u003c/code>\u003c/pre>\n      \u003c/figure>\n      \u003cbutton type=\"button\" id=\"run\">单步执行\u003c/button>\n    \u003c/section>\n    \u003csection class=\"panel\" aria-label=\"函数指向与输出\">\n      \u003cdiv class=\"demo\">\n        \u003cdiv class=\"diagram\">\n          \u003cp class=\"type\">\u003ccode>int (*)(int, int)\u003c/code>\u003c/p>\n          \u003cdl class=\"pointer\">\u003cdt>op\u003c/dt>\u003cdd>—\u003c/dd>\u003c/dl>\n          \u003cdl class=\"function\" id=\"add\">\u003cdt>add\u003c/dt>\u003cdd>x + y\u003c/dd>\u003c/dl>\n          \u003cdl class=\"function\" id=\"sub\">\u003cdt>sub\u003c/dt>\u003cdd>x - y\u003c/dd>\u003c/dl>\n          \u003csvg class=\"arrows\" aria-hidden=\"true\" hidden>\n            \u003cdefs>\n              \u003cmarker id=\"arrowhead\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\">\n                \u003cpath d=\"M 0 0 L 10 5 L 0 10 Z\" fill=\"currentColor\" />\n              \u003c/marker>\n            \u003c/defs>\n            \u003cpath id=\"arrow\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.25\" marker-end=\"url(#arrowhead)\" />\n          \u003c/svg>\n        \u003c/div>\n        \u003cp class=\"status\" id=\"status\" role=\"status\">点击「单步执行」开始。\u003c/p>\n        \u003cdiv class=\"terminal\">\u003cspan>输出\u003c/span>\u003coutput id=\"output\">\u003c/output>\u003c/div>\n      \u003c/div>\n      \u003cbutton type=\"button\" id=\"reset\">复位\u003c/button>\n    \u003c/section>\n  \u003c/main>\n  \u003cscript>\n    const stages = [\n      {message: \"点击「单步执行」开始。\"},\n      {target: \"add\", message: \"op 指向 add。\"},\n      {target: \"add\", called: true, output: \"13\", message: \"调用 add(10, 3)，输出 13。\"},\n      {target: \"sub\", output: \"13\", message: \"op 改为指向 sub。\"},\n      {target: \"sub\", called: true, output: \"13\\n7\", message: \"调用 sub(10, 3)，输出 7。\"}\n    ];\n\n    const run = document.querySelector(\"#run\");\n    const diagram = document.querySelector(\".diagram\");\n    const pointer = diagram.querySelector(\".pointer dd\");\n    const arrow = diagram.querySelector(\"#arrow\");\n    const arrows = diagram.querySelector(\".arrows\");\n    const functions = diagram.querySelectorAll(\".function\");\n    const status = document.querySelector(\"#status\");\n    const output = document.querySelector(\"#output\");\n    let step = 0;\n\n    function positionArrow() {\n      const target = diagram.querySelector(\".function.target\");\n      if (!target) return;\n      const bounds = diagram.getBoundingClientRect();\n      const from = pointer.getBoundingClientRect();\n      const to = target.getBoundingClientRect();\n      const x1 = (to.left \u003c from.left ? from.left : from.right) - bounds.left;\n      const y1 = from.top + from.height / 2 - bounds.top;\n      const x2 = to.left + to.width / 2 - bounds.left;\n      const y2 = to.top - bounds.top - 4;\n      arrow.setAttribute(\"d\", `M ${x1} ${y1} C ${x2} ${y1}, ${x2} ${y2 - 30}, ${x2} ${y2}`);\n    }\n\n    function render() {\n      const stage = stages[step];\n      document.querySelector(\".current\")?.classList.remove(\"current\");\n      document.querySelector('[data-step=\"' + step + '\"]')?.classList.add(\"current\");\n      for (const box of functions) {\n        box.classList.toggle(\"target\", box.id === stage.target);\n        box.classList.toggle(\"called\", box.id === stage.target && Boolean(stage.called));\n      }\n      pointer.textContent = stage.target ? \"&\" + stage.target : \"—\";\n      output.textContent = stage.output ?? \"\";\n      status.textContent = stage.message;\n      run.disabled = step === stages.length - 1;\n      arrows.toggleAttribute(\"hidden\", !stage.target);\n      positionArrow();\n    }\n\n    run.addEventListener(\"click\", () => {\n      step++;\n      render();\n    });\n\n    document.querySelector(\"#reset\").addEventListener(\"click\", () => {\n      step = 0;\n      render();\n    });\n\n    window.addEventListener(\"resize\", positionArrow);\n  \u003c/script>\n\u003c/body>\n\u003c/html>\n"},
    {"name":"P14-1","title":"函数指针声明的组成","html":"\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003ctitle>函数指针声明的组成\u003c/title>\n  \u003cstyle>\n    :root {\n      --purple: #56268a;\n      --line: #8a5cb1;\n      --tint: #f7f1fc;\n      --serif: \"Noto Serif SC\", \"Source Han Serif SC\", \"Songti SC\", SimSun, \"宋体\", serif;\n      --mono: Consolas, \"Courier New\", monospace;\n    }\n\n    body {\n      margin: 0;\n      background: #fff;\n    }\n\n    main {\n      display: grid;\n      min-height: max(100svh, 360px);\n      place-items: center;\n    }\n\n    .declaration {\n      --upper-leader: clamp(27px, 7vh, 65px);\n      --lower-leader: clamp(54px, 8vw, 102px);\n      margin: 0;\n      color: #29252d;\n      font: 400 clamp(25px, min(6.6vw, 11vh), 84px) / 1.2 var(--mono);\n      white-space: pre;\n    }\n\n    code {\n      font: inherit;\n    }\n\n    .part {\n      position: relative;\n      display: inline-block;\n    }\n\n    .group {\n      border-radius: 5px;\n      outline: 2px solid var(--line);\n      outline-offset: 0.055em;\n      background: var(--tint);\n    }\n\n    .star {\n      color: var(--purple);\n    }\n\n    .label {\n      position: absolute;\n      left: 50%;\n      transform: translateX(-50%);\n      color: var(--purple);\n      font: 700 clamp(14px, 2.15vw, 30px) / 1.4 var(--serif);\n      white-space: nowrap;\n      user-select: none;\n    }\n\n    .label code {\n      font-family: var(--mono);\n    }\n\n    .upper {\n      bottom: calc(100% + var(--upper-leader) + 15px);\n    }\n\n    .upper::after {\n      position: absolute;\n      top: calc(100% + 7px);\n      left: 50%;\n      width: 2px;\n      height: var(--upper-leader);\n      transform: translateX(-50%);\n      background: var(--line);\n      content: \"\";\n    }\n\n    .lower-anchor::after {\n      position: absolute;\n      top: calc(100% + 7px);\n      left: calc(50% - 1px);\n      width: 2px;\n      height: var(--lower-leader);\n      transform: rotate(var(--angle));\n      transform-origin: top center;\n      background: var(--line);\n      content: \"\";\n    }\n\n    .lower {\n      top: calc(100% + 15px + var(--lower-leader) * 0.682);\n      left: calc(50% + var(--shift));\n    }\n\n    .star {\n      --angle: 47deg;\n      --shift: calc(var(--lower-leader) * -0.731);\n    }\n\n    .name {\n      --angle: -47deg;\n      --shift: calc(var(--lower-leader) * 0.731);\n    }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain aria-label=\"函数指针声明的组成\">\n    \u003cpre class=\"declaration\" aria-label=\"int (*op)(int,int)\" aria-describedby=\"meaning\">\u003ccode>\u003cspan class=\"part\">\u003cb>int\u003c/b>\u003cspan class=\"label upper\" aria-hidden=\"true\">返回值类型\u003c/span>\u003c/span> \u003cspan class=\"part group\">(\u003cspan class=\"part lower-anchor star\">*\u003cspan class=\"label lower\" aria-hidden=\"true\">声明 \u003ccode>op\u003c/code> 为指针\u003c/span>\u003c/span>\u003cspan class=\"part lower-anchor name\">op\u003cspan class=\"label lower\" aria-hidden=\"true\">指针变量名\u003c/span>\u003c/span>)\u003c/span>\u003cspan class=\"part\">(\u003cb>int\u003c/b>,\u003cb>int\u003c/b>)\u003cspan class=\"label upper\" aria-hidden=\"true\">所指函数的参数类型\u003c/span>\u003c/span>\u003c/code>\u003c/pre>\n    \u003cdiv id=\"meaning\" hidden>最左边的 int 是返回值类型。星号声明 op 为指针，op 是指针变量名。右侧括号里的两个 int 是所指函数的参数类型。\u003c/div>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n"},
    {"name":"P15-1","title":"读程序写结果","html":"\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003ctitle>读程序写结果\u003c/title>\n  \u003cstyle>\n    :root {\n      --purple: #56268a;\n      --gray: #77747c;\n      --serif: \"Noto Serif SC\", \"Source Han Serif SC\", \"Songti SC\", SimSun, \"宋体\", serif;\n      --mono: Consolas, \"Courier New\", monospace;\n    }\n\n    body {\n      margin: 0;\n      background: #fff;\n      color: #29252d;\n      font-family: var(--serif);\n    }\n\n    main {\n      box-sizing: border-box;\n      display: grid;\n      grid-template-rows: auto 1fr;\n      gap: clamp(24px, 5vh, 48px);\n      width: min(100%, 1250px);\n      min-height: 100svh;\n      margin-inline: auto;\n      padding: clamp(32px, 7vh, 68px) clamp(20px, 6vw, 76px);\n    }\n\n    h1 {\n      margin: 0;\n      color: var(--purple);\n      font-size: clamp(31px, min(4.4vw, 8vh), 62px);\n      line-height: 1.3;\n      text-align: center;\n    }\n\n    .exercise {\n      display: grid;\n      grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr);\n      align-items: center;\n      justify-items: center;\n      gap: clamp(30px, 8vw, 120px);\n    }\n\n    figure {\n      max-width: 100%;\n      margin: 0;\n    }\n\n    figcaption {\n      margin-bottom: 0.65em;\n      color: var(--purple);\n      font-size: clamp(16px, 1.6vw, 23px);\n      font-weight: 700;\n    }\n\n    pre {\n      margin: 0;\n      overflow-x: auto;\n      color: #29252d;\n      font: 400 clamp(14px, min(1.86vw, 3.45vh), 26px) / 1.43 var(--mono);\n      tab-size: 4;\n    }\n\n    code {\n      font-family: var(--mono);\n    }\n\n    pre code {\n      font: inherit;\n    }\n\n    .header {\n      color: var(--gray);\n    }\n\n    .literal {\n      color: #a92626;\n    }\n\n    .options {\n      display: grid;\n      gap: clamp(14px, 3.5vh, 29px);\n      margin: 0;\n      padding-left: 1.65em;\n      font-size: clamp(23px, 3.1vw, 43px);\n      line-height: 1.3;\n      list-style-type: upper-alpha;\n    }\n\n    .options li {\n      padding-left: 0.24em;\n    }\n\n    .options li::marker {\n      color: var(--purple);\n      font-weight: 700;\n    }\n\n    @media (max-width: 690px) {\n      .exercise {\n        grid-template-columns: minmax(0, 1fr);\n        align-content: center;\n        gap: 27px;\n      }\n    }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain>\n    \u003ch1>读程序写结果\u003c/h1>\n    \u003cdiv class=\"exercise\">\n      \u003cfigure>\n        \u003cfigcaption>13-1.c\u003c/figcaption>\n        \u003cpre>\u003ccode>\u003cspan class=\"header\">#include &lt;stdio.h&gt;\u003c/span>\n\u003cb>void\u003c/b> skip_spaces(\u003cb>char\u003c/b> *p)\n{\n\t\u003cb>while\u003c/b>(*p==\u003cspan class=\"literal\">'_'\u003c/span>)\n\t\tp++;\n}\n\u003cb>int\u003c/b> main()\n{\n\t\u003cb>char\u003c/b> str[]=\u003cspan class=\"literal\">\"___hello\"\u003c/span>;\n\t\u003cb>char\u003c/b> *p=str;\n\tskip_spaces(p);\n\tprintf(\u003cspan class=\"literal\">\"%s\\n\"\u003c/span>,p);\n\t\u003cb>return\u003c/b> 0;\n}\u003c/code>\u003c/pre>\n      \u003c/figure>\n      \u003col class=\"options\" aria-label=\"选项\">\n        \u003cli>\u003ccode>___hello\u003c/code>\u003c/li>\n        \u003cli>\u003ccode>hello\u003c/code>\u003c/li>\n        \u003cli>\u003ccode>_hello\u003c/code>\u003c/li>\n        \u003cli>\u003ccode>ello\u003c/code>\u003c/li>\n      \u003c/ol>\n    \u003c/div>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n"},
    {"name":"P15-2","title":"用二级指针跳过前导下划线","html":"\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003ctitle>用二级指针跳过前导下划线\u003c/title>\n  \u003cstyle>\n    :root {\n      --purple: #56268a;\n      --line: #8a5cb1;\n      --tint: #f7f1fc;\n      --gray: #77747c;\n      --serif: \"Noto Serif SC\", \"Source Han Serif SC\", \"Songti SC\", SimSun, \"宋体\", serif;\n      --mono: Consolas, \"Courier New\", monospace;\n    }\n\n    body {\n      margin: 0;\n      background: #fff;\n      font-family: var(--serif);\n    }\n\n    main {\n      box-sizing: border-box;\n      display: grid;\n      grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr);\n      align-content: center;\n      gap: 24px clamp(25px, 5vw, 75px);\n      width: min(100%, 1360px);\n      min-height: 100svh;\n      margin-inline: auto;\n      padding: 28px clamp(19px, 5vw, 65px);\n    }\n\n    .panel {\n      display: grid;\n      grid-row: span 2;\n      grid-template-rows: subgrid;\n      justify-items: center;\n      align-items: center;\n      min-width: 0;\n    }\n\n    figure {\n      max-width: 100%;\n      margin: 0;\n    }\n\n    figcaption {\n      margin-bottom: 0.7em;\n      color: var(--purple);\n      font-size: clamp(16px, 1.55vw, 22px);\n      font-weight: 700;\n    }\n\n    pre {\n      margin: 0;\n      padding: 3px 4px;\n      overflow-x: auto;\n      color: var(--gray);\n      font: 400 clamp(14px, min(1.86vw, 3.25vh), 25px) / 1.45 var(--mono);\n      tab-size: 4;\n    }\n\n    code {\n      font-family: var(--mono);\n    }\n\n    pre code {\n      font: inherit;\n    }\n\n    .current {\n      border-radius: 2px;\n      outline: 1.5px solid var(--line);\n      outline-offset: 0.115em;\n      background: var(--tint);\n      color: #000;\n    }\n\n    .current .literal {\n      color: #a92626;\n    }\n\n    .demo {\n      width: min(100%, 525px);\n    }\n\n    .memory {\n      position: relative;\n      font-family: var(--mono);\n      text-align: center;\n    }\n\n    .array-name {\n      margin: 0 0 12px;\n      color: var(--purple);\n      font-size: clamp(16px, 1.7vw, 23px);\n      font-weight: 700;\n    }\n\n    .type {\n      color: var(--gray);\n      font-size: 0.84em;\n      font-weight: 400;\n    }\n\n    .array,\n    .pointers {\n      display: grid;\n      margin: 0;\n    }\n\n    .array {\n      grid-template-columns: repeat(9, minmax(0, 1fr));\n    }\n\n    dt {\n      color: var(--gray);\n      font-size: clamp(13px, 1.33vw, 18px);\n    }\n\n    .array dt {\n      margin-bottom: 5px;\n    }\n\n    dd {\n      box-sizing: border-box;\n      display: grid;\n      height: clamp(50px, 5.3vw, 67px);\n      margin: 0;\n      place-items: center;\n      border: 1.5px solid #b3afb7;\n      background: #fff;\n      color: #29252d;\n      font-size: clamp(18px, 2.1vw, 29px);\n    }\n\n    .array > div + div dd {\n      border-left: 0;\n    }\n\n    .array > div:first-child dd {\n      border-radius: 5px 0 0 5px;\n    }\n\n    .array > div:last-child dd {\n      border-radius: 0 5px 5px 0;\n    }\n\n    .pointers {\n      grid-template-columns: repeat(2, minmax(0, 153px));\n      justify-content: center;\n      gap: clamp(25px, 5vw, 70px);\n      margin-top: 100px;\n    }\n\n    .pointer {\n      display: grid;\n      gap: 6px;\n    }\n\n    .pointer dt {\n      grid-row: 2;\n      color: var(--purple);\n      font-size: clamp(15px, 1.6vw, 22px);\n      white-space: nowrap;\n    }\n\n    .pointer dd {\n      grid-row: 1;\n      height: 54px;\n      border-radius: 5px;\n    }\n\n    .pointer.alive dd {\n      color: var(--purple);\n    }\n\n    .focus dd {\n      outline: 2px solid var(--line);\n      outline-offset: -2px;\n      background: var(--tint);\n      color: var(--purple);\n    }\n\n    .arrows {\n      position: absolute;\n      inset: 0;\n      width: 100%;\n      height: 100%;\n      overflow: visible;\n      color: var(--line);\n      pointer-events: none;\n    }\n\n    .arrows path[hidden] {\n      display: none;\n    }\n\n    .status {\n      min-height: 1.5em;\n      margin: 17px 0 12px;\n      color: var(--purple);\n      font-size: clamp(16px, 1.55vw, 21px);\n      font-weight: 700;\n      line-height: 1.5;\n      text-align: center;\n    }\n\n    #detail {\n      font-family: var(--mono);\n    }\n\n    .terminal {\n      display: grid;\n      grid-template-columns: auto 1fr;\n      align-items: center;\n      gap: 14px;\n      min-height: 23px;\n      padding: 10px 13px;\n      border: 1.5px solid var(--line);\n      border-radius: 7px;\n      background: var(--tint);\n      color: var(--purple);\n      font-size: clamp(16px, 1.45vw, 20px);\n    }\n\n    output {\n      font: 400 clamp(17px, 1.6vw, 23px) / 1.35 var(--mono);\n    }\n\n    button {\n      padding: 0.38em 1.05em;\n      border: 1px solid var(--line);\n      border-radius: 5px;\n      background: #fff;\n      color: var(--purple);\n      font: 700 clamp(16px, 1.55vw, 21px) / 1.35 var(--serif);\n      cursor: pointer;\n    }\n\n    button:hover:not(:disabled) {\n      background: var(--tint);\n    }\n\n    button:focus-visible {\n      outline: 2px solid var(--purple);\n      outline-offset: 3px;\n    }\n\n    button:disabled {\n      opacity: 0.5;\n      cursor: default;\n    }\n\n    @media (max-width: 780px) {\n      main {\n        grid-template-columns: minmax(0, 1fr);\n      }\n\n      .panel {\n        grid-row: auto;\n        grid-template-rows: auto auto;\n        gap: 16px;\n      }\n    }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain aria-label=\"用二级指针跳过前导下划线\">\n    \u003csection class=\"panel\" aria-labelledby=\"filename\">\n      \u003cfigure>\n        \u003cfigcaption id=\"filename\">13-2.c\u003c/figcaption>\n        \u003cpre>\u003ccode>#include &lt;stdio.h&gt;\ntypedef char* ptr1;\ntypedef char** ptr2;\nvoid skip_spaces(ptr2 q)\n{\n\t\u003cspan id=\"test\">while(**q==\u003cspan class=\"literal\">'_'\u003c/span>)\u003c/span>\n\t\t\u003cspan id=\"advance\">(*q)++;\u003c/span>\n\u003cspan id=\"leave\">}\u003c/span>\nint main()\n{\n\tchar str[]=\u003cspan class=\"literal\">\"___hello\"\u003c/span>;\n\t\u003cspan id=\"initialize\">ptr1 p=str;\u003c/span>\n\t\u003cspan id=\"call\">skip_spaces(&amp;p);\u003c/span>\n\t\u003cspan id=\"print\">printf(\u003cspan class=\"literal\">\"%s\\n\"\u003c/span>,p);\u003c/span>\n\treturn 0;\n}\u003c/code>\u003c/pre>\n      \u003c/figure>\n      \u003cbutton type=\"button\" id=\"run\">单步运行\u003c/button>\n    \u003c/section>\n\n    \u003csection class=\"panel\" aria-label=\"变量类型、值和输出\">\n      \u003cdiv class=\"demo\">\n        \u003cdiv class=\"memory\">\n          \u003cp class=\"array-name\">\u003ccode>str\u003c/code> \u003ccode class=\"type\">char[9]\u003c/code>\u003c/p>\n          \u003cdl class=\"array\" aria-label=\"str 字符数组\">\n            \u003cdiv>\u003cdt>[0]\u003c/dt>\u003cdd>_\u003c/dd>\u003c/div>\n            \u003cdiv>\u003cdt>[1]\u003c/dt>\u003cdd>_\u003c/dd>\u003c/div>\n            \u003cdiv>\u003cdt>[2]\u003c/dt>\u003cdd>_\u003c/dd>\u003c/div>\n            \u003cdiv>\u003cdt>[3]\u003c/dt>\u003cdd>h\u003c/dd>\u003c/div>\n            \u003cdiv>\u003cdt>[4]\u003c/dt>\u003cdd>e\u003c/dd>\u003c/div>\n            \u003cdiv>\u003cdt>[5]\u003c/dt>\u003cdd>l\u003c/dd>\u003c/div>\n            \u003cdiv>\u003cdt>[6]\u003c/dt>\u003cdd>l\u003c/dd>\u003c/div>\n            \u003cdiv>\u003cdt>[7]\u003c/dt>\u003cdd>o\u003c/dd>\u003c/div>\n            \u003cdiv>\u003cdt>[8]\u003c/dt>\u003cdd>\\0\u003c/dd>\u003c/div>\n          \u003c/dl>\n\n          \u003cdl class=\"pointers\">\n            \u003cdiv class=\"pointer\" id=\"var-q\">\u003cdt>q \u003cspan class=\"type\">char **\u003c/span>\u003c/dt>\u003cdd>—\u003c/dd>\u003c/div>\n            \u003cdiv class=\"pointer\" id=\"var-p\">\u003cdt>p \u003cspan class=\"type\">char *\u003c/span>\u003c/dt>\u003cdd>—\u003c/dd>\u003c/div>\n          \u003c/dl>\n\n          \u003csvg class=\"arrows\" aria-hidden=\"true\">\n            \u003cdefs>\n              \u003cmarker id=\"arrowhead\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\">\n                \u003cpath d=\"M 0 0 L 10 5 L 0 10 Z\" fill=\"currentColor\" />\n              \u003c/marker>\n            \u003c/defs>\n            \u003cg fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.25\" marker-end=\"url(#arrowhead)\">\n              \u003cpath id=\"arrow-p\" hidden />\n              \u003cpath id=\"arrow-q\" hidden />\n            \u003c/g>\n          \u003c/svg>\n        \u003c/div>\n        \u003cp class=\"status\" role=\"status\">\u003cspan id=\"detail\">\u003c/span>\u003c/p>\n        \u003cdiv class=\"terminal\">\u003cspan>输出\u003c/span>\u003coutput id=\"output\">\u003c/output>\u003c/div>\n      \u003c/div>\n      \u003cbutton type=\"button\" id=\"reset\">复位\u003c/button>\n    \u003c/section>\n  \u003c/main>\n  \u003cscript>\n    const memory = document.querySelector(\".memory\");\n    const cells = Array.from(memory.querySelectorAll(\".array dd\"));\n    const p = memory.querySelector(\"#var-p dd\");\n    const q = memory.querySelector(\"#var-q dd\");\n    const arrowP = memory.querySelector(\"#arrow-p\");\n    const arrowQ = memory.querySelector(\"#arrow-q\");\n    const detail = document.querySelector(\"#detail\");\n    const output = document.querySelector(\"#output\");\n    const run = document.querySelector(\"#run\");\n\n    const stages = [\n      {},\n      {line: \"initialize\", index: 0, focus: \"p\", detail: \"p = &str[0]\"},\n      {line: \"call\", index: 0, inScope: true, focus: \"q\", detail: \"q = &p\"},\n      ...[0, 1, 2].flatMap(index => [\n        {line: \"test\", index, inScope: true, focus: \"cell\", detail: \"**q == '_' → 真\"},\n        {line: \"advance\", index: index + 1, inScope: true, focus: \"p\", detail: `(*q)++ → p = &str[${index + 1}]`}\n      ]),\n      {line: \"test\", index: 3, inScope: true, focus: \"cell\", detail: \"**q == '_' → 假\"},\n      {line: \"leave\", index: 3, detail: \"返回 main\"},\n      {line: \"print\", index: 3, focus: \"cell\", output: \"hello\"}\n    ];\n    let step = 0;\n\n    function positionArrows() {\n      const stage = stages[step];\n      if (stage.index === undefined) return;\n      const bounds = memory.getBoundingClientRect();\n      const pBounds = p.getBoundingClientRect();\n      const charBounds = cells[stage.index].getBoundingClientRect();\n      const x1 = pBounds.left + pBounds.width / 2 - bounds.left;\n      const x2 = charBounds.left + charBounds.width / 2 - bounds.left;\n      const y1 = pBounds.top - bounds.top;\n      const y2 = charBounds.bottom - bounds.top + 4;\n      const mid = (y1 + y2) / 2;\n      arrowP.setAttribute(\"d\", `M ${x1} ${y1} C ${x1} ${mid}, ${x2} ${mid}, ${x2} ${y2}`);\n      if (stage.inScope) {\n        const qBounds = q.getBoundingClientRect();\n        const y = qBounds.top + qBounds.height / 2 - bounds.top;\n        arrowQ.setAttribute(\"d\", `M ${qBounds.right - bounds.left} ${y} H ${pBounds.left - bounds.left - 4}`);\n      }\n    }\n\n    function render() {\n      const stage = stages[step];\n      const initialized = stage.index !== undefined;\n\n      p.textContent = initialized ? `&str[${stage.index}]` : \"—\";\n      q.textContent = stage.inScope ? \"&p\" : \"—\";\n      p.parentElement.classList.toggle(\"alive\", initialized);\n      q.parentElement.classList.toggle(\"alive\", Boolean(stage.inScope));\n      arrowP.toggleAttribute(\"hidden\", !initialized);\n      arrowQ.toggleAttribute(\"hidden\", !stage.inScope);\n\n      document.querySelector(\".current\")?.classList.remove(\"current\");\n      document.querySelector(\".focus\")?.classList.remove(\"focus\");\n      if (stage.line) document.getElementById(stage.line).classList.add(\"current\");\n      const focused = {p, q, cell: cells[stage.index]}[stage.focus];\n      focused?.parentElement.classList.add(\"focus\");\n\n      detail.textContent = stage.detail ?? \"\";\n      output.textContent = stage.output ?? \"\";\n      run.disabled = step === stages.length - 1;\n      positionArrows();\n    }\n\n    run.addEventListener(\"click\", () => {\n      step++;\n      render();\n    });\n    document.querySelector(\"#reset\").addEventListener(\"click\", () => {\n      step = 0;\n      render();\n    });\n    window.addEventListener(\"resize\", positionArrows);\n  \u003c/script>\n\u003c/body>\n\u003c/html>\n"},
    {"name":"P15","title":"main 的命令行参数","html":"\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003ctitle>main 的命令行参数\u003c/title>\n  \u003cstyle>\n    :root {\n      --purple: #56268a;\n      --line: #8a5cb1;\n      --tint: #f7f1fc;\n      --gray: #77747c;\n      --serif: \"Noto Serif SC\", \"Source Han Serif SC\", \"Songti SC\", SimSun, \"宋体\", serif;\n      --mono: Consolas, \"Courier New\", monospace;\n    }\n\n    body {\n      margin: 0;\n      background: #fff;\n      font-family: var(--serif);\n    }\n\n    main {\n      box-sizing: border-box;\n      display: grid;\n      min-height: 100svh;\n      justify-items: center;\n      align-content: center;\n      gap: clamp(38px, 8vh, 82px);\n      padding: 37px 17px;\n    }\n\n    .signature {\n      margin: 0;\n      padding-bottom: clamp(42px, 9vh, 68px);\n      color: var(--gray);\n      font: 400 clamp(14px, min(4.45vw, 7vh), 58px) / 1.2 var(--mono);\n      white-space: pre;\n    }\n\n    code {\n      font-family: var(--mono);\n    }\n\n    .signature code {\n      font: inherit;\n    }\n\n    .parameter {\n      position: relative;\n      display: inline-block;\n      border-radius: 4px;\n      outline: 1.5px solid var(--line);\n      outline-offset: 0.055em;\n      background: var(--tint);\n      color: #000;\n    }\n\n    .annotation {\n      position: absolute;\n      top: calc(100% + var(--leader) + 11px);\n      left: 50%;\n      transform: translateX(-50%);\n      color: var(--purple);\n      font: 700 clamp(13px, 2vw, 26px) / 1.35 var(--serif);\n      user-select: none;\n      --leader: clamp(16px, 4.4vh, 40px);\n    }\n\n    .annotation::before {\n      position: absolute;\n      bottom: calc(100% + 5px);\n      left: calc(50% - 1px);\n      width: 2px;\n      height: var(--leader);\n      background: var(--line);\n      content: \"\";\n    }\n\n    .example {\n      width: min(100%, 700px);\n    }\n\n    .terminal {\n      overflow: hidden;\n      border: 2px solid var(--line);\n      border-radius: 9px;\n      background: var(--tint);\n      color: var(--purple);\n    }\n\n    .terminal h2 {\n      margin: 0;\n      padding: 9px 14px;\n      border-bottom: 1px solid #d8c5e8;\n      font-size: clamp(16px, 1.55vw, 21px);\n    }\n\n    .command,\n    .arguments {\n      display: grid;\n      grid-template-columns: 1.65fr 1fr 1fr;\n      align-items: center;\n      justify-items: center;\n      margin: 0;\n      text-align: center;\n    }\n\n    .command {\n      padding: 16px 0;\n      font-size: clamp(18px, 2.65vw, 35px);\n    }\n\n    .arguments {\n      padding: 0 2px;\n    }\n\n    .mapping {\n      position: relative;\n      display: grid;\n      width: min(calc(100% - 12px), 178px);\n      box-sizing: border-box;\n      margin-top: 35px;\n      padding: 7px 4px 9px;\n      gap: 4px;\n      border: 1px solid var(--line);\n      border-radius: 5px;\n      color: var(--purple);\n      white-space: nowrap;\n    }\n\n    .mapping::before,\n    .mapping::after {\n      position: absolute;\n      left: 50%;\n      transform: translateX(-50%);\n      content: \"\";\n    }\n\n    .mapping::before {\n      bottom: calc(100% + 7px);\n      width: 1.5px;\n      height: 26px;\n      background: var(--line);\n    }\n\n    .mapping::after {\n      bottom: calc(100% + 1px);\n      border: solid transparent;\n      border-width: 7px 4px 0;\n      border-top-color: var(--line);\n    }\n\n    .mapping dt {\n      font-size: clamp(14px, 1.55vw, 21px);\n      font-weight: 700;\n    }\n\n    .mapping dd {\n      margin: 0;\n      color: #29252d;\n      font-size: clamp(14px, 1.73vw, 23px);\n    }\n\n    .count {\n      margin: 17px 0 0;\n      color: var(--purple);\n      font-size: clamp(17px, 2vw, 27px);\n      font-weight: 700;\n      text-align: center;\n    }\n\n    .controls {\n      margin-top: 14px;\n      text-align: center;\n    }\n\n    button {\n      padding: 0.35em 0.95em;\n      border: 1px solid var(--line);\n      border-radius: 5px;\n      background: #fff;\n      color: var(--purple);\n      font: 700 clamp(15px, 1.55vw, 20px) / 1.35 var(--serif);\n      cursor: pointer;\n    }\n\n    button:hover,\n    button[aria-pressed=\"true\"] {\n      background: var(--tint);\n    }\n\n    button:focus-visible {\n      outline: 2px solid var(--purple);\n      outline-offset: 3px;\n    }\n\n    @media (max-width: 480px) {\n      .command {\n        font-size: clamp(14px, 3.7vw, 18px);\n      }\n\n      .mapping dd {\n        font-size: clamp(10px, 2.9vw, 14px);\n      }\n    }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain aria-label=\"main 的命令行参数\">\n    \u003cpre class=\"signature\" id=\"signature\" aria-label=\"int main(int argc, char **argv)\">\u003ccode>int main(\u003cspan class=\"parameter\">\u003cb>int\u003c/b> argc\u003cspan class=\"annotation\" aria-hidden=\"true\">参数个数\u003c/span>\u003c/span>, \u003cspan class=\"parameter\">\u003cb>char\u003c/b> \u003cspan id=\"argv\">**argv\u003c/span>\u003cspan class=\"annotation\" aria-hidden=\"true\">参数字符串列表\u003c/span>\u003c/span>)\u003c/code>\u003c/pre>\n\n    \u003csection class=\"example\" aria-label=\"命令与参数对应关系\">\n      \u003cdiv class=\"terminal\">\n        \u003ch2>命令行示例\u003c/h2>\n        \u003cp class=\"command\" aria-label=\".\\demo.exe username password\">\u003ccode>.\\demo.exe\u003c/code> \u003ccode>username\u003c/code> \u003ccode>password\u003c/code>\u003c/p>\n      \u003c/div>\n      \u003cdl class=\"arguments\">\n        \u003cdiv class=\"mapping\">\u003cdt>\u003ccode>argv[0]\u003c/code>\u003c/dt>\u003cdd>\u003ccode>\".\\demo.exe\"\u003c/code>\u003c/dd>\u003c/div>\n        \u003cdiv class=\"mapping\">\u003cdt>\u003ccode>argv[1]\u003c/code>\u003c/dt>\u003cdd>\u003ccode>\"username\"\u003c/code>\u003c/dd>\u003c/div>\n        \u003cdiv class=\"mapping\">\u003cdt>\u003ccode>argv[2]\u003c/code>\u003c/dt>\u003cdd>\u003ccode>\"password\"\u003c/code>\u003c/dd>\u003c/div>\n      \u003c/dl>\n      \u003cp class=\"count\">\u003ccode>argc = 3\u003c/code>\u003c/p>\n      \u003cdiv class=\"controls\">\n        \u003cbutton type=\"button\" id=\"equivalent\" aria-controls=\"signature\" aria-pressed=\"false\">等价\u003c/button>\n      \u003c/div>\n    \u003c/section>\n  \u003c/main>\n  \u003cscript>\n    const equivalent = document.querySelector(\"#equivalent\");\n    const signature = document.querySelector(\"#signature\");\n    const argv = document.querySelector(\"#argv\");\n\n    equivalent.addEventListener(\"click\", () => {\n      const showArrayForm = equivalent.getAttribute(\"aria-pressed\") === \"false\";\n      const declaration = showArrayForm ? \"*argv[]\" : \"**argv\";\n      argv.textContent = declaration;\n      signature.setAttribute(\"aria-label\", `int main(int argc, char ${declaration})`);\n      equivalent.setAttribute(\"aria-pressed\", String(showArrayForm));\n    });\n  \u003c/script>\n\u003c/body>\n\u003c/html>\n"},
    {"name":"P16","title":"二级指针与地址","html":"\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003ctitle>二级指针与地址\u003c/title>\n  \u003cstyle>\n    :root {\n      --purple: #56268a;\n      --line: #8a5cb1;\n      --tint: #f7f1fc;\n      --gray: #77747c;\n      --serif: \"Noto Serif SC\", \"Source Han Serif SC\", \"Songti SC\", SimSun, \"宋体\", serif;\n      --mono: Consolas, \"Courier New\", monospace;\n    }\n\n    body {\n      margin: 0;\n      background: #fff;\n      font-family: var(--serif);\n    }\n\n    main {\n      box-sizing: border-box;\n      display: grid;\n      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);\n      align-content: center;\n      gap: 26px clamp(24px, 5vw, 78px);\n      width: min(100%, 1350px);\n      min-height: 100svh;\n      margin-inline: auto;\n      padding: 30px clamp(20px, 5vw, 72px);\n    }\n\n    .panel {\n      display: grid;\n      grid-row: span 2;\n      grid-template-rows: subgrid;\n      align-items: center;\n      justify-items: center;\n      min-width: 0;\n    }\n\n    figure {\n      margin: 0;\n      width: min(100%, 455px);\n    }\n\n    figcaption {\n      margin-bottom: 0.7em;\n      color: var(--purple);\n      font-size: clamp(16px, 1.6vw, 23px);\n      font-weight: 700;\n    }\n\n    pre {\n      margin: 0;\n      color: var(--gray);\n      font: 400 clamp(14px, min(1.8vw, 3.7vh), 26px) / 1.5 var(--mono);\n      tab-size: 4;\n    }\n\n    code {\n      font-family: var(--mono);\n    }\n\n    pre code {\n      font: inherit;\n    }\n\n    .current {\n      outline: 1.5px solid var(--line);\n      outline-offset: 0.13em;\n      border-radius: 2px;\n      background: var(--tint);\n      color: #000;\n    }\n\n    .cast {\n      color: var(--purple);\n      font-weight: 700;\n    }\n\n    .controls {\n      display: flex;\n      justify-content: center;\n      flex-wrap: wrap;\n      gap: 12px;\n    }\n\n    button {\n      padding: 0.38em 1.05em;\n      border: 1px solid var(--line);\n      border-radius: 5px;\n      background: #fff;\n      color: var(--purple);\n      font: 700 clamp(16px, 1.55vw, 21px) / 1.35 var(--serif);\n      cursor: pointer;\n    }\n\n    button:hover:not(:disabled),\n    button[aria-pressed=\"true\"] {\n      background: var(--tint);\n    }\n\n    button:focus-visible {\n      outline: 2px solid var(--purple);\n      outline-offset: 3px;\n    }\n\n    button:disabled {\n      opacity: 0.5;\n      cursor: default;\n    }\n\n    .demo {\n      width: min(100%, 490px);\n    }\n\n    .memory {\n      display: grid;\n      grid-template-columns: repeat(3, minmax(0, 1fr));\n      gap: clamp(19px, 3vw, 42px);\n      margin: 0;\n      font-family: var(--mono);\n      text-align: center;\n    }\n\n    .variable {\n      position: relative;\n      display: grid;\n      gap: 5px;\n    }\n\n    .variable dt {\n      grid-row: 2;\n      color: var(--gray);\n      font-size: clamp(17px, 1.65vw, 23px);\n    }\n\n    .variable dd {\n      box-sizing: border-box;\n      display: grid;\n      grid-row: 1;\n      height: 70px;\n      margin: 0;\n      place-items: center;\n      border: 2px solid #b3afb7;\n      border-radius: 5px;\n      color: #29252d;\n      font-size: clamp(23px, 2.5vw, 34px);\n    }\n\n    .variable.pointing dd {\n      color: var(--purple);\n    }\n\n    .variable.pointing::after {\n      position: absolute;\n      top: 35px;\n      left: 100%;\n      width: clamp(19px, 3vw, 42px);\n      transform: translateY(-50%);\n      color: var(--line);\n      font-size: clamp(18px, 2.15vw, 26px);\n      content: \"→\";\n    }\n\n    .variable.focus dd {\n      border-color: var(--purple);\n      background: var(--tint);\n      color: var(--purple);\n    }\n\n    .status {\n      min-height: 3em;\n      margin: 17px 0 10px;\n      color: var(--purple);\n      font: 700 clamp(16px, 1.5vw, 20px) / 1.5 var(--serif);\n      text-align: center;\n    }\n\n    .terminal {\n      overflow: hidden;\n      border: 1.5px solid var(--line);\n      border-radius: 7px;\n      background: var(--tint);\n      color: var(--purple);\n    }\n\n    .terminal h2 {\n      margin: 0;\n      padding: 7px 13px;\n      border-bottom: 1px solid #d8c5e8;\n      font-size: clamp(15px, 1.4vw, 19px);\n    }\n\n    .output {\n      min-height: 5.6em;\n      padding: 8px 13px;\n      font: 400 clamp(17px, 1.6vw, 22px) / 1.4 var(--mono);\n    }\n\n    @media (max-width: 740px) {\n      main {\n        grid-template-columns: minmax(0, 1fr);\n      }\n\n      .panel {\n        grid-row: auto;\n        grid-template-rows: auto auto;\n        gap: 16px;\n      }\n    }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain aria-label=\"二级指针与地址\">\n    \u003csection class=\"panel\" aria-labelledby=\"filename\">\n      \u003cfigure>\n        \u003cfigcaption id=\"filename\">10.c\u003c/figcaption>\n        \u003cpre id=\"source\">\u003ccode>#include &lt;stdio.h&gt;\nint main()\n{\n\tint a=10;\n\t\u003cspan data-step=\"1\">int *q=&amp;a;\u003c/span>\n\t\u003cspan data-step=\"2\">int **p=&amp;q;\u003c/span>\n\t\u003cspan data-step=\"3\">printf(\"%p\\n\",\u003cspan class=\"cast\" hidden>(void *)\u003c/span>p);\u003c/span>\n\t\u003cspan data-step=\"4\">printf(\"%p\\n\",\u003cspan class=\"cast\" hidden>(void *)\u003c/span>&amp;p);\u003c/span>\n\t\u003cspan data-step=\"5\">printf(\"%p\\n\",\u003cspan class=\"cast\" hidden>(void *)\u003c/span>*p);\u003c/span>\n\t\u003cspan data-step=\"6\">printf(\"%d\\n\",**p);\u003c/span>\n\treturn 0;\n}\u003c/code>\u003c/pre>\n      \u003c/figure>\n      \u003cdiv class=\"controls\">\n        \u003cbutton type=\"button\" id=\"run\">单步执行\u003c/button>\n        \u003cbutton type=\"button\" id=\"casts\" aria-controls=\"source\" aria-pressed=\"false\">显示转换\u003c/button>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection class=\"panel\" aria-label=\"变量与输出\">\n      \u003cdiv class=\"demo\">\n        \u003cdl class=\"memory\" aria-label=\"变量指向\">\n          \u003cdiv class=\"variable\" id=\"p\">\u003cdt>p\u003c/dt>\u003cdd>—\u003c/dd>\u003c/div>\n          \u003cdiv class=\"variable\" id=\"q\">\u003cdt>q\u003c/dt>\u003cdd>—\u003c/dd>\u003c/div>\n          \u003cdiv class=\"variable\" id=\"a\">\u003cdt>a\u003c/dt>\u003cdd>10\u003c/dd>\u003c/div>\n        \u003c/dl>\n        \u003cp class=\"status\" id=\"status\" role=\"status\">点击「单步执行」开始。\u003c/p>\n        \u003csection class=\"terminal\" aria-labelledby=\"output-heading\">\n          \u003ch2 id=\"output-heading\">输出（地址用符号表示）\u003c/h2>\n          \u003cdiv class=\"output\" id=\"output\">\u003c/div>\n        \u003c/section>\n      \u003c/div>\n      \u003cbutton type=\"button\" id=\"reset\">复位\u003c/button>\n    \u003c/section>\n  \u003c/main>\n  \u003cscript>\n    const aValue = document.querySelector(\"#a dd\").textContent;\n    const stages = [\n      {message: \"点击「单步执行」开始。\"},\n      {focus: \"q\", message: \"q 存入 a 的地址。\"},\n      {focus: \"p\", message: \"p 存入 q 的地址。\"},\n      {focus: \"q\", message: \"p 的值是 q 的地址。\", printed: \"&q\"},\n      {focus: \"p\", message: \"&p 是 p 自己的地址。\", printed: \"&p\"},\n      {focus: \"a\", message: \"*p 得到 q 的值，也就是 a 的地址。\", printed: \"&a\"},\n      {focus: \"a\", message: `**p 读出 a 的值，输出 ${aValue}。`, printed: aValue}\n    ];\n\n    const p = document.querySelector(\"#p\");\n    const q = document.querySelector(\"#q\");\n    const run = document.querySelector(\"#run\");\n    const castButton = document.querySelector(\"#casts\");\n    const casts = document.querySelectorAll(\".cast\");\n    const output = document.querySelector(\"#output\");\n    const status = document.querySelector(\"#status\");\n    let step = 0;\n\n    function showPointer(variable, address, active) {\n      variable.querySelector(\"dd\").textContent = active ? address : \"—\";\n      variable.classList.toggle(\"pointing\", active);\n    }\n\n    function render() {\n      const stage = stages[step];\n      showPointer(q, \"&a\", step >= 1);\n      showPointer(p, \"&q\", step >= 2);\n\n      document.querySelector(\".current\")?.classList.remove(\"current\");\n      document.querySelector('[data-step=\"' + step + '\"]')?.classList.add(\"current\");\n      document.querySelector(\".variable.focus\")?.classList.remove(\"focus\");\n      if (stage.focus) document.getElementById(stage.focus).classList.add(\"focus\");\n\n      const lines = stages.slice(0, step + 1).flatMap(item => {\n        if (!item.printed) return [];\n        const line = document.createElement(\"div\");\n        line.textContent = item.printed;\n        return [line];\n      });\n      output.replaceChildren(...lines);\n      status.textContent = stage.message;\n      run.disabled = step === stages.length - 1;\n    }\n\n    function showCasts(visible) {\n      casts.forEach(cast => { cast.hidden = !visible; });\n      castButton.setAttribute(\"aria-pressed\", String(visible));\n    }\n\n    run.addEventListener(\"click\", () => {\n      step++;\n      render();\n    });\n\n    castButton.addEventListener(\"click\", () => {\n      showCasts(castButton.getAttribute(\"aria-pressed\") === \"false\");\n    });\n\n    document.querySelector(\"#reset\").addEventListener(\"click\", () => {\n      step = 0;\n      showCasts(false);\n      render();\n    });\n  \u003c/script>\n\u003c/body>\n\u003c/html>\n"},
    {"name":"P17","title":"二维数组的行指针和元素指针","html":"\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003ctitle>二维数组的行指针和元素指针\u003c/title>\n  \u003cstyle>\n    :root {\n      --purple: #56268a;\n      --line: #8a5cb1;\n      --tint: #f7f1fc;\n      --gray: #77747c;\n      --serif: \"Noto Serif SC\", \"Source Han Serif SC\", \"Songti SC\", SimSun, \"宋体\", serif;\n      --mono: Consolas, \"Courier New\", monospace;\n    }\n\n    body {\n      margin: 0;\n      background: #fff;\n      font-family: var(--serif);\n    }\n\n    main {\n      box-sizing: border-box;\n      display: grid;\n      grid-template-columns: minmax(0, 1.12fr) minmax(0, 1fr);\n      align-content: center;\n      gap: 19px clamp(30px, 6vw, 85px);\n      width: min(100%, 1350px);\n      min-height: 100svh;\n      margin-inline: auto;\n      padding: 24px clamp(19px, 4.5vw, 68px);\n    }\n\n    .panel {\n      display: grid;\n      grid-row: span 2;\n      grid-template-rows: subgrid;\n      justify-items: center;\n      align-items: center;\n      min-width: 0;\n    }\n\n    figure {\n      margin: 0;\n      max-width: 100%;\n    }\n\n    figcaption {\n      margin-bottom: 0.68em;\n      color: var(--purple);\n      font-size: clamp(16px, 1.55vw, 22px);\n      font-weight: 700;\n    }\n\n    pre {\n      margin: 0;\n      color: var(--gray);\n      font: 400 clamp(13px, min(1.63vw, 3vh), 23px) / 1.4 var(--mono);\n      tab-size: 4;\n    }\n\n    code {\n      font-family: var(--mono);\n    }\n\n    pre code {\n      font: inherit;\n    }\n\n    .active-code {\n      border-radius: 2px;\n      outline: 1.5px solid var(--line);\n      outline-offset: 0.11em;\n      background: var(--tint);\n      color: #000;\n    }\n\n    .demo {\n      width: min(100%, 420px);\n    }\n\n    .indices {\n      margin: 0 0 12px;\n      color: var(--purple);\n      font: 700 clamp(16px, 1.7vw,
