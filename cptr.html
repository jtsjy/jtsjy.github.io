 24px) / 1.4 var(--mono);\n      text-align: center;\n    }\n\n    .matrix {\n      width: 100%;\n      border-collapse: collapse;\n      table-layout: fixed;\n      font-family: var(--mono);\n      text-align: center;\n    }\n\n    .matrix th {\n      color: var(--gray);\n      font-size: clamp(14px, 1.45vw, 19px);\n      font-weight: 400;\n    }\n\n    .matrix th:first-child {\n      width: 3.6em;\n    }\n\n    .matrix thead th {\n      padding-bottom: 6px;\n    }\n\n    .matrix td {\n      position: relative;\n      box-sizing: border-box;\n      height: clamp(53px, 6vw, 75px);\n      border: 1.5px solid #b3afb7;\n      color: #29252d;\n      font-size: clamp(19px, 2.3vw, 31px);\n    }\n\n    .matrix .row-focus td,\n    .matrix .cell-focus {\n      background: var(--tint);\n      color: var(--purple);\n      font-weight: 700;\n    }\n\n    .matrix .row-focus td {\n      border-top-color: var(--line);\n      border-bottom-color: var(--line);\n    }\n\n    .matrix .row-focus th {\n      position: relative;\n      color: var(--purple);\n      font-weight: 700;\n    }\n\n    .row-pointer th::before,\n    .cell-pointer::before {\n      position: absolute;\n      top: 50%;\n      transform: translateY(-50%);\n      color: var(--purple);\n      font-size: clamp(15px, 1.55vw, 20px);\n      content: \"→\";\n    }\n\n    .row-pointer th::before {\n      right: 85%;\n    }\n\n    .cell-pointer::before {\n      left: 9%;\n    }\n\n    .matrix .cell-focus {\n      outline: 2px solid var(--line);\n      outline-offset: -2px;\n    }\n\n    .readout {\n      display: grid;\n      gap: 9px;\n      min-height: 5.2em;\n      margin-top: 24px;\n      color: var(--purple);\n      text-align: center;\n    }\n\n    #expression {\n      font-size: clamp(21px, 2.5vw, 34px);\n      font-weight: 700;\n    }\n\n    .details {\n      display: flex;\n      flex-wrap: wrap;\n      justify-content: center;\n      align-items: baseline;\n      gap: 4px 14px;\n      font-size: clamp(15px, 1.6vw, 21px);\n    }\n\n    .details code {\n      padding: 0.14em 0.45em;\n      border-radius: 4px;\n      background: var(--tint);\n    }\n\n    .step-count {\n      color: var(--gray);\n      font: 400 15px / 1.3 var(--mono);\n    }\n\n    button {\n      padding: 0.38em 1.05em;\n      border: 1px solid var(--line);\n      border-radius: 5px;\n      background: #fff;\n      color: var(--purple);\n      font: 700 clamp(16px, 1.55vw, 21px) / 1.35 var(--serif);\n      cursor: pointer;\n    }\n\n    .controls {\n      display: flex;\n      justify-content: center;\n      gap: 14px;\n      flex-wrap: wrap;\n    }\n\n    button:hover:not(:disabled),\n    button[aria-pressed=\"true\"] {\n      background: var(--tint);\n    }\n\n    button:disabled {\n      opacity: 0.5;\n      cursor: default;\n    }\n\n    button:focus-visible {\n      outline: 2px solid var(--purple);\n      outline-offset: 3px;\n    }\n\n    @media (max-width: 740px) {\n      main {\n        grid-template-columns: minmax(0, 1fr);\n        row-gap: 26px;\n      }\n\n      .panel {\n        grid-row: auto;\n        grid-template-rows: auto auto;\n        gap: 14px;\n      }\n    }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain aria-label=\"二维数组的行指针和元素指针\">\n    \u003csection class=\"panel\" aria-labelledby=\"filename\">\n      \u003cfigure>\n        \u003cfigcaption id=\"filename\">7-2.c\u003c/figcaption>\n        \u003cpre id=\"source\">\u003ccode>#include &lt;stdio.h&gt;\nint main()\n{\n\tint a[3][3],i,j;\n\tfor(i=0;i&lt;3;i++)\n\t{\n\t\tfor(j=0;j&lt;3;j++)\n\t\t\tscanf(\"%d\",\u003cspan id=\"cell-address\" data-form=\"pointer\">\u003cspan id=\"row-array\">*(\u003cspan id=\"row-address\">a+i\u003c/span>)\u003c/span>+j\u003c/span>\u003cspan id=\"indexed-address\" data-form=\"index\" hidden>&amp;\u003cspan id=\"indexed-row\">a[i]\u003c/span>[j]\u003c/span>);\n\t}\n\tfor(i=0;i&lt;3;i++)\n\t{\n\t\tfor(j=0;j&lt;3;j++)\n\t\t\tprintf(\"%d \",\u003cspan id=\"read-cell\" data-form=\"pointer\">*(*(a+i)+j)\u003c/span>\u003cspan id=\"indexed-value\" data-form=\"index\" hidden>a[i][j]\u003c/span>);\n\t\tprintf(\"\\n\");\n\t}\n\treturn 0;\n}\u003c/code>\u003c/pre>\n      \u003c/figure>\n      \u003cdiv class=\"controls\">\n        \u003cbutton type=\"button\" id=\"run\">单步演示\u003c/button>\n        \u003cbutton type=\"button\" id=\"equivalent\" aria-controls=\"source expression\" aria-pressed=\"false\">等价\u003c/button>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection class=\"panel\" aria-label=\"二维数组位置与类型\">\n      \u003cdiv class=\"demo\">\n        \u003cp class=\"indices\">\u003ccode>i = 1, j = 2\u003c/code>\u003c/p>\n        \u003ctable class=\"matrix\" aria-label=\"示例数组 a\">\n          \u003cthead>\n            \u003ctr>\u003cth scope=\"col\">a\u003c/th>\u003cth scope=\"col\">[0]\u003c/th>\u003cth scope=\"col\">[1]\u003c/th>\u003cth scope=\"col\">[2]\u003c/th>\u003c/tr>\n          \u003c/thead>\n          \u003ctbody>\n            \u003ctr>\u003cth scope=\"row\">[0]\u003c/th>\u003ctd>1\u003c/td>\u003ctd>2\u003c/td>\u003ctd>3\u003c/td>\u003c/tr>\n            \u003ctr>\u003cth scope=\"row\">[1]\u003c/th>\u003ctd>4\u003c/td>\u003ctd>5\u003c/td>\u003ctd>6\u003c/td>\u003c/tr>\n            \u003ctr>\u003cth scope=\"row\">[2]\u003c/th>\u003ctd>7\u003c/td>\u003ctd>8\u003c/td>\u003ctd>9\u003c/td>\u003c/tr>\n          \u003c/tbody>\n        \u003c/table>\n        \u003cdiv class=\"readout\" role=\"status\">\n          \u003ccode id=\"expression\">\u003c/code>\n          \u003cdiv class=\"details\">\u003ccode id=\"type\">\u003c/code>\u003cspan id=\"target\">\u003c/span>\u003c/div>\n          \u003cdiv class=\"step-count\" id=\"step\">\u003c/div>\n        \u003c/div>\n      \u003c/div>\n      \u003cbutton type=\"button\" id=\"reset\">复位\u003c/button>\n    \u003c/section>\n  \u003c/main>\n  \u003cscript>\n    const stages = [\n      {expression: \"a\", type: \"int (*)[3]\", label: \"指向 a[0] 这一行\", row: 0, pointer: true},\n      {expression: \"a + i\", indexed: \"&a[i]\", type: \"int (*)[3]\", label: \"指向 a[1] 这一行\", row: 1, pointer: true, code: \"row-address\", indexCode: \"indexed-row\"},\n      {expression: \"*(a + i)\", indexed: \"a[i]\", type: \"int [3]\", label: \"得到整行 a[1]\", row: 1, code: \"row-array\", indexCode: \"indexed-row\"},\n      {expression: \"a[i] → &a[i][0]\", type: \"int *\", label: \"指向本行首元素\", row: 1, col: 0, pointer: true, code: \"row-array\", indexCode: \"indexed-row\"},\n      {expression: \"*(a + i) + j\", indexed: \"&a[i][j]\", type: \"int *\", label: \"指向 a[1][2]\", row: 1, col: 2, pointer: true, code: \"cell-address\", indexCode: \"indexed-address\"},\n      {expression: \"*(*(a + i) + j)\", indexed: \"a[i][j]\", type: \"int\", label: \"读取 a[1][2] → 6\", row: 1, col: 2, code: \"read-cell\", indexCode: \"indexed-value\"}\n    ];\n\n    const rows = Array.from(document.querySelectorAll(\".matrix tbody tr\"));\n    const run = document.querySelector(\"#run\");\n    const equivalent = document.querySelector(\"#equivalent\");\n    const forms = document.querySelectorAll(\"[data-form]\");\n    const expression = document.querySelector(\"#expression\");\n    const type = document.querySelector(\"#type\");\n    const target = document.querySelector(\"#target\");\n    const counter = document.querySelector(\"#step\");\n    let step = 0;\n    let showIndices = false;\n\n    function render() {\n      const stage = stages[step];\n      for (const item of document.querySelectorAll(\".active-code, .row-focus, .row-pointer, .cell-focus, .cell-pointer\")) {\n        item.classList.remove(\"active-code\", \"row-focus\", \"row-pointer\", \"cell-focus\", \"cell-pointer\");\n      }\n\n      const row = rows[stage.row];\n      if (stage.col === undefined) {\n        row.classList.add(\"row-focus\");\n        row.classList.toggle(\"row-pointer\", Boolean(stage.pointer));\n      } else {\n        const cell = row.cells[stage.col + 1];\n        cell.classList.add(\"cell-focus\");\n        cell.classList.toggle(\"cell-pointer\", Boolean(stage.pointer));\n      }\n\n      const codeId = showIndices ? stage.indexCode : stage.code;\n      if (codeId) document.getElementById(codeId).classList.add(\"active-code\");\n      expression.textContent = showIndices ? stage.indexed ?? stage.expression : stage.expression;\n      type.textContent = stage.type;\n      target.textContent = stage.label;\n      counter.textContent = step ? `${step}/${stages.length - 1}` : \"\";\n      run.disabled = step === stages.length - 1;\n    }\n\n    run.addEventListener(\"click\", () => {\n      step++;\n      render();\n    });\n\n    equivalent.addEventListener(\"click\", () => {\n      showIndices = !showIndices;\n      equivalent.setAttribute(\"aria-pressed\", String(showIndices));\n      for (const form of forms) form.hidden = (form.dataset.form === \"index\") !== showIndices;\n      render();\n    });\n\n    document.querySelector(\"#reset\").addEventListener(\"click\", () => {\n      step = 0;\n      render();\n    });\n\n    render();\n  \u003c/script>\n\u003c/body>\n\u003c/html>\n"},
    {"name":"P17-1","title":"二维数组的三种指向","html":"\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003ctitle>二维数组的三种指向\u003c/title>\n  \u003cstyle>\n    :root {\n      --purple: #56268a;\n      --line: #8a5cb1;\n      --tint: #f7f1fc;\n      --gray: #77747c;\n      --grid: #b9b2bf;\n      --serif: \"Noto Serif SC\", \"Source Han Serif SC\", \"Songti SC\", SimSun, \"宋体\", serif;\n      --mono: Consolas, \"Courier New\", monospace;\n    }\n\n    body {\n      margin: 0;\n      background: #fff;\n      color: #29252d;\n      font-family: var(--serif);\n    }\n\n    main {\n      box-sizing: border-box;\n      display: grid;\n      grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr);\n      align-items: center;\n      align-content: center;\n      gap: clamp(38px, 8vw, 105px);\n      width: min(100%, 1360px);\n      min-height: 100svh;\n      margin-inline: auto;\n      padding: 30px clamp(22px, 5.3vw, 76px);\n    }\n\n    code {\n      font-family: var(--mono);\n    }\n\n    .diagram {\n      display: grid;\n      justify-items: center;\n      gap: clamp(26px, 5.2vh, 47px);\n      min-width: 0;\n      margin: 0;\n    }\n\n    .matrix {\n      width: min(100%, 340px);\n      border-collapse: collapse;\n      table-layout: fixed;\n      text-align: center;\n      font-family: var(--mono);\n    }\n\n    caption {\n      margin-bottom: 8px;\n      color: var(--purple);\n      font-size: clamp(18px, 1.9vw, 26px);\n      font-weight: 700;\n    }\n\n    th {\n      color: var(--gray);\n      font-size: clamp(13px, 1.35vw, 18px);\n      font-weight: 400;\n    }\n\n    th:first-child {\n      width: 3em;\n    }\n\n    thead th {\n      padding-bottom: 5px;\n    }\n\n    td {\n      height: clamp(37px, 7.5vh, 62px);\n      border: 1px solid var(--grid);\n      font-size: clamp(19px, 2.35vw, 31px);\n    }\n\n    .selected {\n      background: var(--tint);\n      color: var(--purple);\n      font-weight: 700;\n    }\n\n    td.selected {\n      border-color: var(--line);\n    }\n\n    .memory {\n      width: 100%;\n    }\n\n    .memory-title {\n      margin: 0 0 12px;\n      color: var(--purple);\n      font-size: clamp(17px, 1.7vw, 23px);\n      font-weight: 700;\n    }\n\n    .memory-title span {\n      margin-left: 0.55em;\n      color: var(--gray);\n      font-size: 0.76em;\n      font-weight: 400;\n    }\n\n    .blocks {\n      display: grid;\n      grid-template-columns: repeat(9, minmax(0, 1fr));\n      margin: 0;\n      padding: 0;\n      border-left: 1.5px solid var(--line);\n      list-style: none;\n    }\n\n    .blocks li {\n      display: grid;\n      box-sizing: border-box;\n      min-width: 0;\n      height: clamp(37px, 7.3vh, 59px);\n      place-items: center;\n      border: 1px solid var(--grid);\n      border-left: 0;\n      font: 400 clamp(18px, 2.1vw, 29px) / 1.2 var(--mono);\n    }\n\n    .blocks li:nth-child(3n) {\n      border-right: 1.5px solid var(--line);\n    }\n\n    .blocks li.selected {\n      border-top-color: var(--line);\n      border-bottom-color: var(--line);\n    }\n\n    .blocks li.range-end {\n      border-right: 1.5px solid var(--line);\n    }\n\n    .group-labels {\n      display: grid;\n      grid-template-columns: repeat(3, minmax(0, 1fr));\n      margin: 0 0 5px;\n      color: var(--gray);\n      font: 400 clamp(12px, 1.35vw, 18px) / 1.3 var(--mono);\n      text-align: center;\n    }\n\n    .memory-caption {\n      position: relative;\n      min-height: 1.5em;\n      margin: 0;\n      padding-top: 48px;\n      color: var(--purple);\n      font-size: clamp(16px, 1.6vw, 22px);\n      font-weight: 700;\n      text-align: center;\n    }\n\n    .pointer {\n      position: absolute;\n      top: 1px;\n      left: var(--position, 0%);\n      transform: translateX(-50%);\n      font: 700 clamp(16px, 1.6vw, 22px) / 1.2 var(--mono);\n    }\n\n    .pointer::before {\n      display: block;\n      margin-bottom: 2px;\n      content: \"↑\";\n    }\n\n    .choices {\n      display: grid;\n      gap: clamp(9px, 1.8vh, 17px);\n    }\n\n    .choice {\n      display: grid;\n      grid-template-columns: minmax(0, 1fr) auto;\n      align-items: center;\n      gap: 6px 12px;\n      padding: 0.55em 0.75em;\n      border: 1px solid var(--line);\n      border-radius: 5px;\n      font-size: clamp(16px, 1.65vw, 22px);\n    }\n\n    .choice.active {\n      border-color: var(--purple);\n      background: var(--tint);\n      box-shadow: inset 0 0 0 1px var(--purple);\n    }\n\n    button {\n      border: 1px solid var(--line);\n      border-radius: 5px;\n      background: #fff;\n      color: var(--purple);\n      font: 700 1em / 1.35 var(--serif);\n      text-align: left;\n      cursor: pointer;\n    }\n\n    .select {\n      display: grid;\n      justify-items: start;\n      gap: 4px;\n      min-width: 0;\n      padding: 0;\n      border: 0;\n      background: transparent;\n      font-size: 1.22em;\n    }\n\n    .select code {\n      color: #29252d;\n      font-size: 0.8em;\n      font-weight: 400;\n      white-space: nowrap;\n    }\n\n    .select:hover {\n      text-decoration: underline;\n      text-underline-offset: 0.14em;\n    }\n\n    .increment,\n    .reset {\n      padding: 0.22em 0.63em;\n    }\n\n    .reset {\n      justify-self: center;\n      font-size: clamp(16px, 1.55vw, 21px);\n    }\n\n    .increment:hover:not(:disabled),\n    .reset:hover {\n      background: var(--tint);\n    }\n\n    button:disabled {\n      opacity: 0.48;\n      cursor: default;\n    }\n\n    button:focus-visible {\n      outline: 2px solid var(--purple);\n      outline-offset: 3px;\n    }\n\n    .facts {\n      grid-column: 1 / -1;\n      display: grid;\n      grid-template-columns: auto minmax(0, 1fr);\n      gap: 3px 12px;\n      margin: 4px 0 0;\n      color: var(--gray);\n      font-size: 0.78em;\n      line-height: 1.4;\n    }\n\n    .facts dd {\n      margin: 0;\n      color: #29252d;\n      overflow-wrap: anywhere;\n    }\n\n    @media (max-width: 760px) {\n      main {\n        grid-template-columns: minmax(0, 1fr);\n        gap: 28px;\n      }\n\n      .choices {\n        grid-template-columns: minmax(0, 1fr);\n      }\n    }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain aria-label=\"二维数组的三种指向\">\n    \u003cfigure class=\"diagram\" aria-label=\"二维数组与连续内存\">\n      \u003ctable class=\"matrix\" id=\"matrix\">\n        \u003ccaption>\u003ccode>a[3][3]\u003c/code>\u003c/caption>\n        \u003cthead>\u003ctr>\u003cth>\u003c/th>\u003cth scope=\"col\">[0]\u003c/th>\u003cth scope=\"col\">[1]\u003c/th>\u003cth scope=\"col\">[2]\u003c/th>\u003c/tr>\u003c/thead>\n        \u003ctbody>\n          \u003ctr>\u003cth scope=\"row\">[0]\u003c/th>\u003ctd>1\u003c/td>\u003ctd>2\u003c/td>\u003ctd>3\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth scope=\"row\">[1]\u003c/th>\u003ctd>4\u003c/td>\u003ctd>5\u003c/td>\u003ctd>6\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth scope=\"row\">[2]\u003c/th>\u003ctd>7\u003c/td>\u003ctd>8\u003c/td>\u003ctd>9\u003c/td>\u003c/tr>\n        \u003c/tbody>\n      \u003c/table>\n\n      \u003csection class=\"memory\" id=\"memory\" aria-labelledby=\"memory-title\">\n        \u003ch2 class=\"memory-title\" id=\"memory-title\">连续内存\u003cspan>每格一个 \u003ccode>int\u003c/code>\u003c/span>\u003c/h2>\n        \u003cdiv class=\"group-labels\" aria-hidden=\"true\">\u003cspan>a[0]\u003c/span>\u003cspan>a[1]\u003c/span>\u003cspan>a[2]\u003c/span>\u003c/div>\n        \u003col class=\"blocks\" aria-label=\"按行依次存放的九个元素\">\n          \u003cli>1\u003c/li>\u003cli>2\u003c/li>\u003cli>3\u003c/li>\n          \u003cli>4\u003c/li>\u003cli>5\u003c/li>\u003cli>6\u003c/li>\n          \u003cli>7\u003c/li>\u003cli>8\u003c/li>\u003cli>9\u003c/li>\n        \u003c/ol>\n        \u003cp class=\"memory-caption\">\u003cspan class=\"pointer\" aria-hidden=\"true\">p\u003c/span>\u003cspan id=\"range\" role=\"status\">\u003c/span>\u003c/p>\n      \u003c/section>\n    \u003c/figure>\n\n    \u003cdiv class=\"choices\" role=\"group\" aria-label=\"选择指针指向的范围\">\n      \u003cdiv class=\"choice active\" data-kind=\"array\">\n        \u003cbutton class=\"select\" type=\"button\" aria-controls=\"matrix memory\" aria-pressed=\"true\">\n          \u003cspan>数组指针\u003c/span>\u003ccode>int (*p)[3][3];\u003c/code>\n        \u003c/button>\n        \u003cdl class=\"facts\">\n          \u003cdt>指向位置\u003c/dt>\u003cdd>\u003ccode class=\"address\">&amp;a\u003c/code>\u003c/dd>\n          \u003cdt>所指类型大小\u003c/dt>\u003cdd>\u003ccode>sizeof *p = 9 * sizeof(int)\u003c/code>\u003c/dd>\n        \u003c/dl>\n      \u003c/div>\n      \u003cdiv class=\"choice\" data-kind=\"row\">\n        \u003cbutton class=\"select\" type=\"button\" aria-controls=\"matrix memory\" aria-pressed=\"false\">\n          \u003cspan>行指针\u003c/span>\u003ccode>int (*p)[3];\u003c/code>\n        \u003c/button>\n        \u003cbutton class=\"increment\" type=\"button\" aria-label=\"行指针 p++\">\u003ccode>p++\u003c/code>\u003c/button>\n        \u003cdl class=\"facts\">\n          \u003cdt>指向位置\u003c/dt>\u003cdd>\u003ccode class=\"address\">&amp;a[0]\u003c/code>\u003c/dd>\n          \u003cdt>所指类型大小\u003c/dt>\u003cdd>\u003ccode>sizeof *p = 3 * sizeof(int)\u003c/code>\u003c/dd>\n        \u003c/dl>\n      \u003c/div>\n      \u003cdiv class=\"choice\" data-kind=\"element\">\n        \u003cbutton class=\"select\" type=\"button\" aria-controls=\"matrix memory\" aria-pressed=\"false\">\n          \u003cspan>元素指针\u003c/span>\u003ccode>int *p;\u003c/code>\n        \u003c/button>\n        \u003cbutton class=\"increment\" type=\"button\" aria-label=\"元素指针 p++\">\u003ccode>p++\u003c/code>\u003c/button>\n        \u003cdl class=\"facts\">\n          \u003cdt>指向位置\u003c/dt>\u003cdd>\u003ccode class=\"address\">&amp;a[0][0]\u003c/code>\u003c/dd>\n          \u003cdt>所指类型大小\u003c/dt>\u003cdd>\u003ccode>sizeof *p = sizeof(int)\u003c/code>\u003c/dd>\n        \u003c/dl>\n      \u003c/div>\n      \u003cbutton class=\"reset\" type=\"button\" id=\"reset\">复位\u003c/button>\n    \u003c/div>\n  \u003c/main>\n  \u003cscript>\n    const matrix = document.querySelectorAll(\".matrix td\");\n    const blocks = document.querySelectorAll(\".blocks li\");\n    const choices = document.querySelectorAll(\"[data-kind]\");\n    const pointer = document.querySelector(\".pointer\");\n    const range = document.querySelector(\"#range\");\n    const types = {\n      array: {size: 9, addresses: [\"&a\"]},\n      row: {size: 3, addresses: [\"&a[0]\", \"&a[1]\", \"&a[2]\", \"a + 3\"], end: \"二维数组尾后位置\"},\n      element: {size: 1, addresses: [\"&a[0][0]\", \"&a[0][1]\", \"&a[0][2]\", \"a[0] + 3\"], end: \"第一行尾后位置\"}\n    };\n    const positions = {array: 0, row: 0, element: 0};\n    let active = \"array\";\n\n    function render() {\n      const type = types[active];\n      const position = positions[active];\n      const start = position * type.size;\n      const pastEnd = Boolean(type.end) && position === type.addresses.length - 1;\n      const size = pastEnd ? 0 : type.size;\n      const withinTarget = i => i >= start && i \u003c start + size;\n\n      matrix.forEach((cell, i) => cell.classList.toggle(\"selected\", withinTarget(i)));\n      blocks.forEach((cell, i) => {\n        cell.classList.toggle(\"selected\", withinTarget(i));\n        cell.classList.toggle(\"range-end\", size > 0 && i === start + size - 1);\n      });\n      pointer.style.setProperty(\"--position\", `${(start / blocks.length) * 100}%`);\n\n      for (const choice of choices) {\n        const kind = choice.dataset.kind;\n        const addresses = types[kind].addresses;\n        choice.classList.toggle(\"active\", kind === active);\n        choice.querySelector(\".select\").setAttribute(\"aria-pressed\", String(kind === active));\n        choice.querySelector(\".address\").textContent = addresses[positions[kind]];\n        const increment = choice.querySelector(\".increment\");\n        if (increment) increment.disabled = positions[kind] === addresses.length - 1;\n      }\n\n      range.textContent = pastEnd ? type.end : `所指范围 · ${size} 个 int`;\n    }\n\n    for (const choice of choices) {\n      const kind = choice.dataset.kind;\n      choice.querySelector(\".select\").addEventListener(\"click\", () => {\n        active = kind;\n        render();\n      });\n      choice.querySelector(\".increment\")?.addEventListener(\"click\", () => {\n        active = kind;\n        positions[kind]++;\n        render();\n      });\n    }\n\n    document.querySelector(\"#reset\").addEventListener(\"click\", () => {\n      positions.row = 0;\n      positions.element = 0;\n      render();\n    });\n    render();\n  \u003c/script>\n\u003c/body>\n\u003c/html>\n"},
    {"name":"P18","title":"通过结构体指针修改成员","html":"\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003ctitle>通过结构体指针修改成员\u003c/title>\n  \u003cstyle>\n    :root {\n      --purple: #56268a;\n      --line: #8a5cb1;\n      --tint: #f7f1fc;\n      --gray: #77747c;\n      --serif: \"Noto Serif SC\", \"Source Han Serif SC\", \"Songti SC\", SimSun, \"宋体\", serif;\n      --mono: Consolas, \"Courier New\", monospace;\n    }\n\n    body {\n      margin: 0;\n      background: #fff;\n      font-family: var(--serif);\n    }\n\n    main {\n      box-sizing: border-box;\n      display: grid;\n      grid-template-columns: minmax(0, 1.36fr) minmax(0, 1fr);\n      align-content: center;\n      gap: 22px clamp(24px, 4vw, 65px);\n      width: min(100%, 1370px);\n      min-height: 100svh;\n      margin-inline: auto;\n      padding: 27px clamp(20px, 4.5vw, 68px);\n    }\n\n    .panel {\n      display: grid;\n      grid-row: span 2;\n      grid-template-rows: subgrid;\n      justify-items: center;\n      align-items: center;\n      min-width: 0;\n    }\n\n    figure {\n      margin: 0;\n      max-width: 100%;\n    }\n\n    figcaption {\n      margin-bottom: 0.7em;\n      color: var(--purple);\n      font-size: clamp(16px, 1.55vw, 22px);\n      font-weight: 700;\n    }\n\n    pre {\n      margin: 0;\n      color: var(--gray);\n      font: 400 clamp(12px, min(1.62vw, 3.05vh), 23px) / 1.39 var(--mono);\n      tab-size: 4;\n    }\n\n    code {\n      font-family: var(--mono);\n    }\n\n    pre code {\n      font: inherit;\n    }\n\n    .focus-line {\n      border-radius: 2px;\n      outline: 1.5px solid var(--line);\n      outline-offset: 0.12em;\n      background: var(--tint);\n      color: #000;\n    }\n\n    .demo {\n      display: grid;\n      justify-items: center;\n      width: min(100%, 400px);\n    }\n\n    .parameters,\n    .point {\n      box-sizing: border-box;\n      width: min(100%, 310px);\n      font-family: var(--mono);\n      text-align: center;\n    }\n\n    .parameters {\n      padding: 10px 12px 13px;\n      border: 1.5px solid #c8b6d8;\n      border-radius: 8px;\n      background: var(--tint);\n      color: var(--purple);\n    }\n\n    .scope-label {\n      margin: 0 0 8px;\n      font-size: clamp(15px, 1.4vw, 20px);\n    }\n\n    .arguments {\n      display: grid;\n      grid-template-columns: 1fr 1.25fr 1fr;\n      gap: 8px;\n      margin: 0;\n    }\n\n    .argument {\n      display: grid;\n      gap: 3px;\n    }\n\n    .argument dt {\n      grid-row: 2;\n      color: var(--gray);\n      font-size: clamp(17px, 1.55vw, 21px);\n    }\n\n    .argument dd {\n      box-sizing: border-box;\n      grid-row: 1;\n      margin: 0;\n      padding: 6px 9px;\n      border: 1.5px solid #b3afb7;\n      border-radius: 5px;\n      background: #fff;\n      font-size: clamp(19px, 2vw, 27px);\n    }\n\n    .parameters.active,\n    .parameters.active .argument dd {\n      border-color: var(--line);\n    }\n\n    .connector {\n      position: relative;\n      width: 2px;\n      height: 50px;\n    }\n\n    .connector.active {\n      background: var(--line);\n    }\n\n    .connector.active::after {\n      position: absolute;\n      bottom: 0;\n      left: 50%;\n      transform: translateX(-50%);\n      border: solid transparent;\n      border-width: 8px 5px 0;\n      border-top-color: var(--line);\n      content: \"\";\n    }\n\n    .point {\n      padding: 11px 15px 9px;\n      border: 1.5px solid #b3afb7;\n      border-radius: 8px;\n    }\n\n    .point.target {\n      border-color: var(--line);\n    }\n\n    .branches {\n      position: relative;\n      box-sizing: border-box;\n      width: calc(50% + 6px);\n      height: 16px;\n      margin: 9px auto 5px;\n      border: 1.5px solid var(--line);\n      border-bottom: 0;\n      border-radius: 3px 3px 0 0;\n      visibility: hidden;\n    }\n\n    .branches::before,\n    .branches::after {\n      position: absolute;\n      bottom: -3px;\n      border: solid transparent;\n      border-width: 6px 4px 0;\n      border-top-color: var(--line);\n      content: \"\";\n    }\n\n    .branches::before {\n      left: -4.5px;\n    }\n\n    .branches::after {\n      right: -4.5px;\n    }\n\n    .point.updated .branches,\n    .point.updated .calculation {\n      visibility: visible;\n    }\n\n    .fields {\n      display: grid;\n      grid-template-columns: repeat(2, minmax(0, 1fr));\n      gap: 12px;\n      margin: 0;\n    }\n\n    .fields > div {\n      display: grid;\n      gap: 3px;\n    }\n\n    .fields dt {\n      grid-row: 2;\n      color: var(--gray);\n      font-size: clamp(16px, 1.5vw, 20px);\n    }\n\n    .fields dd {\n      grid-row: 1;\n      margin: 0;\n      padding: 7px 9px;\n      border: 1.5px solid #b3afb7;\n      border-radius: 5px;\n      color: #29252d;\n      font-size: clamp(20px, 2.15vw, 30px);\n    }\n\n    .point.updated dd {\n      border-color: var(--purple);\n      background: var(--tint);\n      color: var(--purple);\n    }\n\n    .point-name {\n      margin: 0;\n      color: var(--purple);\n      font-size: clamp(16px, 1.5vw, 21px);\n    }\n\n    .calculation {\n      display: block;\n      margin-top: 6px;\n      color: var(--purple);\n      font-size: clamp(13px, 1.25vw, 17px);\n      line-height: 1.45;\n      visibility: hidden;\n    }\n\n    .status {\n      box-sizing: border-box;\n      min-height: 3em;\n      margin: 16px 0 0;\n      color: var(--purple);\n      font: 700 clamp(15px, 1.5vw, 20px) / 1.5 var(--serif);\n      text-align: center;\n    }\n\n    button {\n      padding: 0.38em 1.05em;\n      border: 1px solid var(--line);\n      border-radius: 5px;\n      background: #fff;\n      color: var(--purple);\n      font: 700 clamp(16px, 1.55vw, 21px) / 1.35 var(--serif);\n      cursor: pointer;\n    }\n\n    button:hover:not(:disabled) {\n      background: var(--tint);\n    }\n\n    button:focus-visible {\n      outline: 2px solid var(--purple);\n      outline-offset: 3px;\n    }\n\n    button:disabled {\n      opacity: 0.5;\n      cursor: default;\n    }\n\n    @media (max-width: 780px) {\n      main {\n        grid-template-columns: minmax(0, 1fr);\n      }\n\n      .panel {\n        grid-row: auto;\n        grid-template-rows: auto auto;\n        gap: 14px;\n      }\n    }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain aria-label=\"通过结构体指针修改成员\">\n    \u003csection class=\"panel\" aria-labelledby=\"filename\">\n      \u003cfigure>\n        \u003cfigcaption id=\"filename\">11-1.c\u003c/figcaption>\n        \u003cpre>\u003ccode>#include &lt;stdio.h&gt;\nstruct Point{\n\tint x;\n\tint y;\n};\n\u003cspan class=\"focus-line\">void Point_move(struct Point *p, int dx, int dy)\u003c/span>\n{\n\t\u003cspan class=\"member-write\">p-&gt;x+=dx;\u003c/span>\n\t\u003cspan class=\"member-write\">p-&gt;y+=dy;\u003c/span>\n}\nint main()\n{\n\tstruct Point p1={10,20};\n\t\u003cspan class=\"focus-line\">Point_move(&amp;p1,5,5);\u003c/span>\n\treturn 0;\n}\u003c/code>\u003c/pre>\n      \u003c/figure>\n      \u003cbutton type=\"button\" id=\"run\">单步执行\u003c/button>\n    \u003c/section>\n\n    \u003csection class=\"panel\" aria-label=\"指针和结构体\">\n      \u003cdiv class=\"demo\">\n        \u003csection class=\"parameters\" aria-labelledby=\"scope-label\">\n          \u003ch2 class=\"scope-label\" id=\"scope-label\">\u003ccode>Point_move\u003c/code>\u003c/h2>\n          \u003cdl class=\"arguments\">\n            \u003cdiv class=\"argument\">\u003cdt>dx\u003c/dt>\u003cdd id=\"dx\">—\u003c/dd>\u003c/div>\n            \u003cdiv class=\"argument\">\u003cdt>p\u003c/dt>\u003cdd id=\"address\">—\u003c/dd>\u003c/div>\n            \u003cdiv class=\"argument\">\u003cdt>dy\u003c/dt>\u003cdd id=\"dy\">—\u003c/dd>\u003c/div>\n          \u003c/dl>\n        \u003c/section>\n        \u003cdiv class=\"connector\" aria-hidden=\"true\">\u003c/div>\n        \u003csection class=\"point\" aria-labelledby=\"point-name\">\n          \u003cp class=\"point-name\" id=\"point-name\">p1\u003c/p>\n          \u003cdiv class=\"branches\" aria-hidden=\"true\">\u003c/div>\n          \u003cdl class=\"fields\">\n            \u003cdiv>\u003cdt>x\u003cspan class=\"calculation\">\u003ccode>p-&gt;x\u003c/code>\u003cbr>\u003ccode>10 + 5 = 15\u003c/code>\u003c/span>\u003c/dt>\u003cdd id=\"x\">10\u003c/dd>\u003c/div>\n            \u003cdiv>\u003cdt>y\u003cspan class=\"calculation\">\u003ccode>p-&gt;y\u003c/code>\u003cbr>\u003ccode>20 + 5 = 25\u003c/code>\u003c/span>\u003c/dt>\u003cdd id=\"y\">20\u003c/dd>\u003c/div>\n          \u003c/dl>\n        \u003c/section>\n        \u003cp class=\"status\" id=\"status\" role=\"status\">点击「单步执行」开始。\u003c/p>\n      \u003c/div>\n      \u003cbutton type=\"button\" id=\"reset\">复位\u003c/button>\n    \u003c/section>\n  \u003c/main>\n  \u003cscript>\n    const run = document.querySelector(\"#run\");\n    const address = document.querySelector(\"#address\");\n    const offsets = document.querySelectorAll(\"#dx, #dy\");\n    const parameters = document.querySelector(\".parameters\");\n    const connector = document.querySelector(\".connector\");\n    const point = document.querySelector(\".point\");\n    const x = document.querySelector(\"#x\");\n    const y = document.querySelector(\"#y\");\n    const status = document.querySelector(\"#status\");\n    const memberWrites = document.querySelectorAll(\".member-write\");\n    const messages = [\n      \"点击「单步执行」开始。\",\n      \"1/2　p 收到 &p1，dx 和 dy 各收到 5。\",\n      \"2/2　沿 p 找到 p1，再选中 x 和 y。\"\n    ];\n    let step = 0;\n\n    function render() {\n      const hasAddress = step >= 1;\n      const updated = step === 2;\n      address.textContent = hasAddress ? \"&p1\" : \"—\";\n      for (const offset of offsets) offset.textContent = hasAddress ? \"5\" : \"—\";\n      parameters.classList.toggle(\"active\", hasAddress);\n      connector.classList.toggle(\"active\", hasAddress);\n      point.classList.toggle(\"target\", hasAddress);\n      point.classList.toggle(\"updated\", updated);\n      x.textContent = updated ? \"15\" : \"10\";\n      y.textContent = updated ? \"25\" : \"20\";\n      for (const line of memberWrites) line.classList.toggle(\"focus-line\", updated);\n      status.textContent = messages[step];\n      run.disabled = updated;\n    }\n\n    run.addEventListener(\"click\", () => {\n      step++;\n      render();\n    });\n    document.querySelector(\"#reset\").addEventListener(\"click\", () => {\n      step = 0;\n      render();\n    });\n  \u003c/script>\n\u003c/body>\n\u003c/html>\n"},
    {"name":"P19","title":"结构体中的函数指针","html":"\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003ctitle>结构体中的函数指针\u003c/title>\n  \u003cstyle>\n    :root {\n      --purple: #56268a;\n      --line: #8a5cb1;\n      --tint: #f7f1fc;\n      --gray: #77747c;\n      --serif: \"Noto Serif SC\", \"Source Han Serif SC\", \"Songti SC\", SimSun, \"宋体\", serif;\n      --mono: Consolas, \"Courier New\", monospace;\n    }\n\n    body {\n      margin: 0;\n      background: #fff;\n      font-family: var(--serif);\n    }\n\n    main {\n      box-sizing: border-box;\n      display: grid;\n      min-height: 100svh;\n      align-content: center;\n      justify-items: center;\n      gap: 20px;\n      padding: 24px 18px;\n    }\n\n    figure {\n      margin: 0;\n      max-width: 100%;\n    }\n\n    figcaption {\n      margin-bottom: 0.65em;\n      color: var(--purple);\n      font-size: clamp(16px, 1.55vw, 22px);\n      font-weight: 700;\n    }\n\n    pre {\n      margin: 0;\n      padding: 2px 4px;\n      overflow-x: auto;\n      color: var(--gray);\n      font: 400 clamp(13px, min(1.8vw, 2.95vh), 23px) / 1.32 var(--mono);\n      tab-size: 4;\n    }\n\n    code {\n      font: inherit;\n    }\n\n    .focus {\n      border-radius: 2px;\n      outline: 1.5px solid var(--line);\n      outline-offset: 0.085em;\n      background: var(--tint);\n      color: #000;\n    }\n\n    button {\n      padding: 0.38em 1.05em;\n      border: 1px solid var(--line);\n      border-radius: 5px;\n      background: #fff;\n      color: var(--purple);\n      font: 700 clamp(16px, 1.55vw, 21px) / 1.35 var(--serif);\n      cursor: pointer;\n    }\n\n    button:hover,\n    button[aria-pressed=\"true\"] {\n      background: var(--tint);\n    }\n\n    button:focus-visible {\n      outline: 2px solid var(--purple);\n      outline-offset: 3px;\n    }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain aria-label=\"结构体中的函数指针\">\n    \u003cfigure>\n      \u003cfigcaption>11-2.c\u003c/figcaption>\n      \u003cpre id=\"example\">\u003ccode>#include &lt;stdio.h&gt;\nstruct Point{\n\tint x;\n\tint y;\n\t\u003cspan class=\"focus\">\u003cb>void\u003c/b> (*move)(struct Point *, int, int);\u003c/span>\n};\nvoid Point_move(struct Point *p, int dx, int dy)\n{\n\t\u003cspan class=\"focus\">\u003cspan id=\"write-x\">p-&gt;x\u003c/span>+=dx;\u003c/span>\n\t\u003cspan class=\"focus\">\u003cspan id=\"write-y\">p-&gt;y\u003c/span>+=dy;\u003c/span>\n}\nint main()\n{\n\tstruct Point p1;\n\tp1.x=10;\n\tp1.y=20;\n\t\u003cspan class=\"focus\">p1.move=Point_move;\u003c/span>\n\t\u003cspan class=\"focus\">p1.move(&amp;p1,5,5);\u003c/span>\n\treturn 0;\n}\u003c/code>\u003c/pre>\n    \u003c/figure>\n    \u003cbutton type=\"button\" id=\"equivalent\" aria-controls=\"example\" aria-pressed=\"false\">等价\u003c/button>\n  \u003c/main>\n  \u003cscript>\n    const equivalent = document.querySelector(\"#equivalent\");\n    const writeX = document.querySelector(\"#write-x\");\n    const writeY = document.querySelector(\"#write-y\");\n\n    equivalent.addEventListener(\"click\", () => {\n      const useDot = equivalent.getAttribute(\"aria-pressed\") === \"false\";\n      writeX.textContent = useDot ? \"(*p).x\" : \"p->x\";\n      writeY.textContent = useDot ? \"(*p).y\" : \"p->y\";\n      equivalent.setAttribute(\"aria-pressed\", String(useDot));\n    });\n  \u003c/script>\n\u003c/body>\n\u003c/html>\n"},
    {"name":"P20","title":"指针让程序更加结构化","html":"\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003ctitle>指针让程序更加结构化\u003c/title>\n  \u003cstyle>\n    :root {\n      --purple: #56268a;\n      --serif: \"Noto Serif SC\", \"Source Han Serif SC\", \"Songti SC\", SimSun, \"宋体\", serif;\n    }\n\n    body {\n      margin: 0;\n      background: #fff;\n      color: #29252d;\n      font-family: var(--serif);\n    }\n\n    main {\n      box-sizing: border-box;\n      display: grid;\n      min-height: 100svh;\n      grid-template-rows: auto 1fr;\n      justify-items: center;\n      padding: clamp(40px, 14vh, 122px) clamp(20px, 7vw, 96px) clamp(35px, 12vh, 104px);\n    }\n\n    h1 {\n      margin: 0;\n      color: var(--purple);\n      font-size: clamp(29px, min(4.9vw, 9vh), 68px);\n      line-height: 1.3;\n      text-align: center;\n    }\n\n    ul {\n      align-self: center;\n      display: grid;\n      gap: clamp(22px, 5.6vh, 48px);\n      box-sizing: border-box;\n      margin: 0;\n      padding: 28px 0 0 0.8em;\n      font-size: clamp(22px, min(3.58vw, 6.7vh), 52px);\n      line-height: 1.5;\n      list-style-type: \"· \";\n    }\n\n    li::marker,\n    strong {\n      color: var(--purple);\n    }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain>\n    \u003ch1>指针让程序更加结构化\u003c/h1>\n    \u003cul>\n      \u003cli>函数把\u003cstrong>「做什么」\u003c/strong>组织起来\u003c/li>\n      \u003cli>指针让我们指定\u003cstrong>「对哪个对象做」\u003c/strong>\u003c/li>\n    \u003c/ul>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n"},
    {"name":"P20-1","title":"qsort 与比较函数指针","html":"\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003ctitle>qsort 与比较函数指针\u003c/title>\n  \u003cstyle>\n    :root {\n      --purple: #56268a;\n      --line: #8a5cb1;\n      --tint: #f7f1fc;\n      --gray: #77747c;\n      --serif: \"Noto Serif SC\", \"Source Han Serif SC\", \"Songti SC\", SimSun, \"宋体\", serif;\n      --mono: Consolas, \"Courier New\", monospace;\n    }\n\n    body {\n      margin: 0;\n      background: #fff;\n      font-family: var(--serif);\n    }\n\n    main {\n      box-sizing: border-box;\n      display: grid;\n      grid-template-columns: repeat(2, minmax(0, 1fr));\n      align-content: center;\n      justify-items: center;\n      column-gap: clamp(28px, 5vw, 78px);\n      width: min(100%, 1360px);\n      min-height: 100svh;\n      margin-inline: auto;\n      padding: clamp(24px, 5vh, 56px) clamp(20px, 5vw, 68px);\n    }\n\n    figure {\n      margin: 0;\n      max-width: 100%;\n    }\n\n    figcaption {\n      margin-bottom: 0.8em;\n      color: var(--purple);\n      font-size: clamp(16px, 1.6vw, 23px);\n      font-weight: 700;\n    }\n\n    pre {\n      margin: 0;\n      padding: 2px 4px;\n      overflow-x: auto;\n      color: var(--gray);\n      font: 400 clamp(14px, min(1.71vw, 3.25vh), 24px) / 1.48 var(--mono);\n      tab-size: 4;\n    }\n\n    code {\n      font: inherit;\n    }\n\n    .call {\n      outline: 1.5px solid var(--line);\n      outline-offset: 0.12em;\n      border-radius: 3px;\n      background: var(--tint);\n      color: #000;\n    }\n\n    .prototype {\n      color: #29252d;\n    }\n\n    .callback {\n      color: var(--purple);\n      font-weight: 700;\n    }\n\n    @media (max-width: 780px) {\n      main {\n        grid-template-columns: minmax(0, 1fr);\n        row-gap: 30px;\n      }\n    }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain aria-label=\"qsort 调用与标准库头文件中的声明\">\n    \u003cfigure>\n      \u003cfigcaption>14.c\u003c/figcaption>\n      \u003cpre>\u003ccode>#include &lt;stdio.h&gt;\n#include &lt;stdlib.h&gt;\nint cmp(const void *p1, const void *p2)\n{\n\tint x=*(const int*)p1;\n\tint y=*(const int*)p2;\n\treturn (x&gt;y)-(x&lt;y);\n}\nint main()\n{\n\tint a[]={1,4,2,3,5};\n\t\u003cspan class=\"call\">qsort(a,5,sizeof(int),\u003cspan class=\"callback\">cmp\u003c/span>);\u003c/span>\n\treturn 0;\n}\u003c/code>\u003c/pre>\n    \u003c/figure>\n    \u003cfigure>\n      \u003cfigcaption>stdlib.h\u003c/figcaption>\n      \u003cpre>\u003ccode>...\n\n\u003cspan class=\"prototype\">\u003cb>void\u003c/b> __cdecl qsort(\n    \u003cb>void\u003c/b> *_Base,\n    size_t _NumOfElements,\n    size_t _SizeOfElements,\n    \u003cb>int\u003c/b> (__cdecl *\u003cspan class=\"callback\">_PtFuncCompare\u003c/span>)(\n        \u003cb>const void\u003c/b> *,\n        \u003cb>const void\u003c/b> *\n    )\n);\u003c/span>\n\n...\u003c/code>\u003c/pre>\n    \u003c/figure>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n"},
    {"name":"P20-2","title":"给冒泡排序传入比较函数","html":"\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003ctitle>给冒泡排序传入比较函数\u003c/title>\n  \u003cstyle>\n    :root {\n      --purple: #56268a;\n      --line: #8a5cb1;\n      --tint: #f7f1fc;\n      --gray: #77747c;\n      --serif: \"Noto Serif SC\", \"Source Han Serif SC\", \"Songti SC\", SimSun, \"宋体\", serif;\n      --mono: Consolas, \"Courier New\", monospace;\n    }\n\n    body {\n      margin: 0;\n      background: #fff;\n      font-family: var(--serif);\n    }\n\n    main {\n      box-sizing: border-box;\n      display: grid;\n      align-content: center;\n      min-height: 100svh;\n      width: min(100%, 1340px);\n      margin-inline: auto;\n      padding: 25px clamp(17px, 4.5vw, 60px);\n    }\n\n    figure {\n      margin: 0;\n    }\n\n    figcaption {\n      margin-bottom: 0.68em;\n      color: var(--purple);\n      font-size: clamp(16px, 1.6vw, 23px);\n      font-weight: 700;\n    }\n\n    .columns {\n      display: grid;\n      grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr);\n      align-items: start;\n      gap: clamp(22px, 4vw, 62px);\n    }\n\n    pre {\n      margin: 0;\n      padding: 2px 4px;\n      overflow-x: auto;\n      color: var(--gray);\n      font: 400 clamp(12px, min(1.74vw, 2.95vh), 23px) / 1.32 var(--mono);\n      tab-size: 4;\n    }\n\n    code {\n      font: inherit;\n    }\n\n    .example {\n      margin-top: calc(5 * 1lh);\n    }\n\n    .focus {\n      border-radius: 2px;\n      outline: 1.5px solid var(--line);\n      outline-offset: 0.09em;\n      background: var(--tint);\n      color: #000;\n    }\n\n    .name {\n      color: var(--purple);\n    }\n\n    @media (max-width: 820px) {\n      .columns {\n        grid-template-columns: minmax(0, 1fr);\n        gap: 19px;\n      }\n\n      .example {\n        margin-top: 0;\n      }\n    }\n\n    @media (max-width: 420px) {\n      pre {\n        font-size: clamp(9px, 3.05vw, 12px);\n      }\n    }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain>\n    \u003cfigure aria-labelledby=\"filename\">\n      \u003cfigcaption id=\"filename\">15.c\u003c/figcaption>\n      \u003cdiv class=\"columns\">\n        \u003cpre>\u003ccode>#include &lt;stdio.h&gt;\nvoid bubble_sort(\n\tint *Array,\n\tint Begin,\n\tint End,\n\t\u003cspan class=\"focus\">int (*\u003cb class=\"name\">Compar\u003c/b>)(const void *,const void *)\u003c/span>\n){\n\tint i,j;\n\tfor(i=End;i&gt;Begin;i--)\n\t{\n\t\tfor(j=Begin;j&lt;i;j++)\n\t\t{\n\t\t\tif(Compar(&amp;Array[j],&amp;Array[j+1])&gt;0)\n\t\t\t{\n\t\t\t\tint temp=Array[j];\n\t\t\t\tArray[j]=Array[j+1];\n\t\t\t\tArray[j+1]=temp;\n\t\t\t}\n\t\t}\n\t}\n}\u003c/code>\u003c/pre>\n        \u003cpre class=\"example\">\u003ccode>\u003cspan class=\"focus\">int \u003cb class=\"name\">cmp\u003c/b>(const void *p1, const void *p2)\u003c/span>\n{\n\tint x=*(const int*)p1;\n\tint y=*(const int*)p2;\n\treturn (x&gt;y)-(x&lt;y);\n}\nint main()\n{\n\tint a[10]={6,2,3,7,9,1,4,8,5,0};\n\tbubble_sort(a,3,6,cmp);\n\treturn 0;\n}\u003c/code>\u003c/pre>\n      \u003c/div>\n    \u003c/figure>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n"},
    {"name":"P23","title":"读出下面声明的含义","html":"\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003ctitle>读出下面声明的含义\u003c/title>\n  \u003cstyle>\n    :root {\n      --purple: #56268a;\n      --line: #8a5cb1;\n      --tint: #f7f1fc;\n      --serif: \"Noto Serif SC\", \"Source Han Serif SC\", \"Songti SC\", SimSun, \"宋体\", serif;\n      --mono: Consolas, \"Courier New\", monospace;\n    }\n\n    body {\n      margin: 0;\n      background: #fff;\n      color: #29252d;\n      font-family: var(--serif);\n    }\n\n    main {\n      box-sizing: border-box;\n      display: grid;\n      min-height: 100svh;\n      align-content: center;\n      justify-items: center;\n      row-gap: clamp(22px, 4.5vh, 44px);\n      padding: 32px 19px;\n    }\n\n    h1 {\n      margin: 0;\n      color: var(--purple);\n      font-size: clamp(33px, min(4.85vw, 9.1vh), 67px);\n      font-weight: 700;\n      line-height: 1.3;\n      text-align: center;\n    }\n\n    ul {\n      display: grid;\n      gap: clamp(15px, 3.2vh, 29px);\n      margin: 0;\n      padding-left: 0;\n      color: #18151c;\n      font-size: clamp(17px, min(3.45vw, 6.4vh), 47px);\n      line-height: 1.35;\n      list-style-position: inside;\n      list-style-type: \"· \";\n    }\n\n    li::marker {\n      color: var(--purple);\n    }\n\n    code {\n      display: inline-block;\n      padding: 0.065em 0.23em;\n      border: 1.5px solid var(--line);\n      border-radius: 4px;\n      background: var(--tint);\n      font-family: var(--mono);\n      font-weight: 400;\n      white-space: nowrap;\n    }\n\n    .keyword {\n      color: #000;\n      font-weight: 700;\n    }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain>\n    \u003ch1>读出下面声明的含义\u003c/h1>\n    \u003cul>\n      \u003cli>\u003ccode>\u003cspan class=\"keyword\">int\u003c/span> *p[5];\u003c/code>\u003c/li>\n      \u003cli>\u003ccode>\u003cspan class=\"keyword\">int\u003c/span> (*p)[5];\u003c/code>\u003c/li>\n      \u003cli>\u003ccode>\u003cspan class=\"keyword\">char\u003c/span> (*p)(\u003cspan class=\"keyword\">char\u003c/span> *);\u003c/code>\u003c/li>\n      \u003cli>\u003ccode>\u003cspan class=\"keyword\">int\u003c/span> *(*x[10])(\u003cspan class=\"keyword\">void\u003c/span>);\u003c/code>\u003c/li>\n    \u003c/ul>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n"},
    {"name":"P21","title":"循环体中变量的生命周期","html":"\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003ctitle>循环体中变量的生命周期\u003c/title>\n  \u003cstyle>\n    :root {\n      --purple: #56268a;\n      --line: #8a5cb1;\n      --tint: #f7f1fc;\n      --gray: #77747c;\n      --serif: \"Noto Serif SC\", \"Source Han Serif SC\", \"Songti SC\", SimSun, \"宋体\", serif;\n      --mono: Consolas, \"Courier New\", monospace;\n    }\n\n    body {\n      margin: 0;\n      background: #fff;\n      font-family: var(--serif);\n    }\n\n    main {\n      box-sizing: border-box;\n      display: grid;\n      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);\n      align-content: center;\n      gap: 24px clamp(26px, 5vw, 80px);\n      width: min(100%, 1360px);\n      min-height: 100svh;\n      margin-inline: auto;\n      padding: 28px clamp(19px, 5vw, 70px);\n    }\n\n    .panel {\n      display: grid;\n      grid-row: span 2;\n      grid-template-rows: subgrid;\n      justify-items: center;\n      align-items: center;\n      min-width: 0;\n    }\n\n    figure {\n      margin: 0;\n      max-width: 100%;\n    }\n\n    figcaption {\n      margin-bottom: 0.7em;\n      color: var(--purple);\n      font-size: clamp(16px, 1.55vw, 22px);\n      font-weight: 700;\n    }\n\n    pre {\n      box-sizing: border-box;\n      max-width: 100%;\n      margin: 0;\n      padding: 3px 4px;\n      overflow-x: auto;\n      color: var(--gray);\n      font: 400 clamp(14px, min(1.87vw, 3.8vh), 26px) / 1.48 var(--mono);\n      tab-size: 4;\n    }\n\n    code {\n      font-family: var(--mono);\n    }\n\n    pre code {\n      font: inherit;\n    }\n\n    .current {\n      outline: 1.5px solid var(--line);\n      outline-offset: 0.13em;\n      border-radius: 2px;\n      background: var(--tint);\n      color: #000;\n    }\n\n    .demo {\n      width: min(100%, 460px);\n    }\n\n    .array {\n      display: grid;\n      grid-template-columns: repeat(3, minmax(0, 1fr));\n      margin: 0 0 22px;\n      font-family: var(--mono);\n      text-align: center;\n    }\n\n    dt {\n      color: var(--gray);\n      font-size: clamp(16px, 1.6vw, 21px);\n    }\n\n    .array dt {\n      margin-bottom: 6px;\n    }\n\n    dd {\n      box-sizing: border-box;\n      display: grid;\n      height: 66px;\n      margin: 0;\n      place-items: center;\n      border: 2px solid #b3afb7;\n      background: #fff;\n      color: #29252d;\n      font-size: clamp(21px, 2.15vw, 30px);\n    }\n\n    .array > div + div dd {\n      border-left: 0;\n    }\n\n    .array > div:first-child dd {\n      border-radius: 5px 0 0 5px;\n    }\n\n    .array > div:last-child dd {\n      border-radius: 0 5px 5px 0;\n    }\n\n    .array .read dd {\n      outline: 2px solid var(--line);\n      outline-offset: -2px;\n      background: var(--tint);\n      color: var(--purple);\n    }\n\n    .index {\n      min-height: 1.5em;\n      margin: 0 0 9px;\n      color: var(--purple);\n      text-align: center;\n      font-size: clamp(16px, 1.55vw, 21px);\n    }\n\n    .memory {\n      display: grid;\n      grid-template-columns: minmax(96px, 1fr) minmax(31px, 0.64fr) minmax(115px, 1.25fr);\n      align-items: start;\n      font-family: var(--mono);\n      text-align: center;\n    }\n\n    .variable {\n      display: grid;\n      justify-items: stretch;\n      gap: 5px;\n      margin: 0;\n    }\n\n    .variable dt {\n      grid-row: 2;\n    }\n\n    .variable dd {\n      grid-row: 1;\n      border-radius: 5px;\n    }\n\n    #pointer-value {\n      color: var(--purple);\n    }\n\n    .scope {\n      box-sizing: border-box;\n      min-width: 0;\n      padding: 12px 12px 9px;\n      margin-top: -12px;\n      border: 1px solid #d8c9e4;\n      border-radius: 8px;\n    }\n\n    .scope.inside {\n      border-color: var(--line);\n      background: var(--tint);\n    }\n\n    .scope h2 {\n      margin: 8px 0 0;\n      color: var(--purple);\n      font: 700 clamp(15px, 1.45vw, 19px) / 1.35 var(--serif);\n    }\n\n    .x-absent {\n      visibility: hidden;\n    }\n\n    .x-expired dd {\n      border-style: dashed;\n      border-color: var(--line);\n      background: transparent;\n    }\n\n    .connector {\n      position: relative;\n      align-self: start;\n      margin-top: 32px;\n      margin-right: -12px;\n      border-top: 2px solid transparent;\n    }\n\n    .connector.live,\n    .connector.previous {\n      border-top-color: var(--line);\n    }\n\n    .connector.previous {\n      border-top-style: dashed;\n    }\n\n    .connector.live::after,\n    .connector.previous::after {\n      position: absolute;\n      top: -6px;\n      right: -1px;\n      border: solid transparent;\n      border-width: 5px 0 5px 8px;\n      border-left-color: var(--line);\n      content: \"\";\n    }\n\n    #pointer-value.dangling {\n      color: var(--gray);\n      font-family: var(--serif);\n      font-size: clamp(18px, 1.9vw, 25px);\n    }\n\n    .status {\n      min-height: 3em;\n      margin: 19px 0 0;\n      color: var(--purple);\n      font: 700 clamp(15px, 1.5vw, 20px) / 1.5 var(--serif);\n      text-align: center;\n    }\n\n    button {\n      padding: 0.38em 1.05em;\n      border: 1px solid var(--line);\n      border-radius: 5px;\n      background: #fff;\n      color: var(--purple);\n      font: 700 clamp(16px, 1.55vw, 21px) / 1.35 var(--serif);\n      cursor: pointer;\n    }\n\n    button:hover:not(:disabled) {\n      background: var(--tint);\n    }\n\n    button:focus-visible {\n      outline: 2px solid var(--purple);\n      outline-offset: 3px;\n    }\n\n    button:disabled {\n      opacity: 0.5;\n      cursor: default;\n    }\n\n    @media (max-width: 780px) {\n      main {\n        grid-template-columns: minmax(0, 1fr);\n      }\n\n      .panel {\n        grid-row: auto;\n        grid-template-rows: auto auto;\n        gap: 16px;\n      }\n    }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain aria-label=\"循环体中变量的生命周期\">\n    \u003csection class=\"panel\" aria-labelledby=\"filename\">\n      \u003cfigure>\n        \u003cfigcaption id=\"filename\">12.c\u003c/figcaption>\n        \u003cpre>\u003ccode>#include &lt;stdio.h&gt;\nint main()\n{\n\tint *p=NULL,i,a[3]={10,20,30};\n\tfor(i=0;\u003cspan id=\"test\">i&lt;3\u003c/span>;i++)\n\t{\n\t\t\u003cspan id=\"create\">int x=a[i];\u003c/span>\n\t\t\u003cspan id=\"assign\">p=&amp;x;\u003c/span>\n\t\u003cspan id=\"leave\">}\u003c/span>\n\t\u003cspan id=\"clear\">p=NULL;\u003c/span>\n\treturn 0;\n}\u003c/code>\u003c/pre>\n      \u003c/figure>\n      \u003cbutton type=\"button\" id=\"run\">单步运行\u003c/button>\n    \u003c/section>\n    \u003csection class=\"panel\" aria-label=\"变量与循环体\">\n      \u003cdiv class=\"demo\">\n        \u003cdl class=\"array\" aria-label=\"数组 a\">\n          \u003cdiv>\u003cdt>a[0]\u003c/dt>\u003cdd>10\u003c/dd>\u003c/div>\n          \u003cdiv>\u003cdt>a[1]\u003c/dt>\u003cdd>20\u003c/dd>\u003c/div>\n          \u003cdiv>\u003cdt>a[2]\u003c/dt>\u003cdd>30\u003c/dd>\u003c/div>\n        \u003c/dl>\n        \u003cp class=\"index\">\u003ccode id=\"index\">\u003c/code>\u003c/p>\n        \u003cdiv class=\"memory\">\n          \u003cdl class=\"variable\">\u003cdt>p\u003c/dt>\u003cdd id=\"pointer-value\">NULL\u003c/dd>\u003c/dl>\n          \u003cdiv class=\"connector\" aria-hidden=\"true\">\u003c/div>\n          \u003csection class=\"scope\" aria-labelledby=\"scope-name\">\n            \u003cdl class=\"variable x-absent\" id=\"x-box\">\u003cdt>x\u003c/dt>\u003cdd id=\"x-value\">\u003c/dd>\u003c/dl>\n            \u003ch2 id=\"scope-name\">循环体\u003c/h2>\n          \u003c/section>\n        \u003c/div>\n        \u003cp class=\"status\" id=\"status\" role=\"status\">循环开始前，x 还不存在。\u003c/p>\n      \u003c/div>\n      \u003cbutton type=\"button\" id=\"reset\">复位\u003c/button>\n    \u003c/section>\n  \u003c/main>\n  \u003cscript>\n    const cells = Array.from(document.querySelectorAll(\".array dd\"));\n    const initial = {x: \"absent\", pointer: \"null\", message: \"循环开始前，x 还不存在。\"};\n    const stages = [\n      initial,\n      ...cells.flatMap((_, i) => [\n        {i, x: \"live\", pointer: i === 0 ? \"null\" : \"stale\", line: \"create\", message: `进入循环体，创建本轮的 x，初值取自 a[${i}]。`},\n        {i, x: \"live\", pointer: \"live\", line: \"assign\", message: \"p 存入本轮 x 的地址。\"},\n        {i, x: \"expired\", pointer: \"stale\", line: \"leave\", message: \"本轮 x 的生命周期结束。虚线表示 p 原来的指向。\"}\n      ]),\n      {i: cells.length, x: \"expired\", pointer: \"stale\", line: \"test\", message: \"i \u003c 3 为假。循环结束，p 此时悬空。\"},\n      {i: cells.length, x: \"expired\", pointer: \"null\", line: \"clear\", message: \"把 p 重新设为 NULL。\"}\n    ];\n\n    const run = document.querySelector(\"#run\");\n    const index = document.querySelector(\"#index\");\n    const scope = document.querySelector(\".scope\");\n    const xBox = document.querySelector(\"#x-box\");\n    const xValue = document.querySelector(\"#x-value\");\n    const pointer = document.querySelector(\"#pointer-value\");\n    const connector = document.querySelector(\".connector\");\n    const status = document.querySelector(\"#status\");\n    let step = 0;\n\n    function render() {\n      const state = stages[step];\n      const live = state.x === \"live\";\n      const expired = state.x === \"expired\";\n      index.textContent = state.i === undefined ? \"\" : `i = ${state.i}`;\n      xBox.classList.toggle(\"x-absent\", state.x === \"absent\");\n      xBox.classList.toggle(\"x-expired\", expired);\n      scope.classList.toggle(\"inside\", live);\n      xValue.textContent = live ? cells[state.i].textContent : \"\";\n      pointer.textContent = {null: \"NULL\", live: \"&x\", stale: \"悬空\"}[state.pointer];\n      pointer.classList.toggle(\"dangling\", state.pointer === \"stale\");\n      connector.classList.toggle(\"live\", state.pointer === \"live\");\n      connector.classList.toggle(\"previous\", expired && state.pointer === \"stale\");\n\n      document.querySelector(\".current\")?.classList.remove(\"current\");\n      if (state.line) document.getElementById(state.line).classList.add(\"current\");\n      cells.forEach((cell, i) => cell.parentElement.classList.toggle(\"read\", state.line === \"create\" && state.i === i));\n      status.textContent = state.message;\n      run.disabled = step === stages.length - 1;\n    }\n\n    run.addEventListener(\"click\", () => {\n      step++;\n      render();\n    });\n\n    document.querySelector(\"#reset\").addEventListener(\"click\", () => {\n      step = 0;\n      render();\n    });\n  \u003c/script>\n\u003c/body>\n\u003c/html>\n"}
]
  </script>
  <script>
    const deck = JSON.parse(document.querySelector("#slide-data").textContent);
    const container = document.querySelector("#slides");
    const previous = document.querySelector("#previous");
    const next = document.querySelector("#next");
    const position = document.querySelector("#position");
    const frames = new Map();
    let currentIndex = -1;

    function handleKeys(event) {
      if (event.defaultPrevented || event.altKey || event.ctrlKey || event.metaKey || event.shiftKey) return;
      if (event.target.closest?.("input, textarea, select, [contenteditable]:not([contenteditable=false])")) return;
      if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
      event.preventDefault();
      show(currentIndex + (event.key === "ArrowLeft" ? -1 : 1));
    }

    function getFrame(index) {
      if (frames.has(index)) return frames.get(index);
      const slide = deck[index];
      const frame = document.createElement("iframe");
      frame.title = slide.name + " · " + slide.title;
      frame.addEventListener("load", () => {
        frame.contentDocument.addEventListener("keydown", handleKeys);
      });
      frame.srcdoc = slide.html;
      frames.set(index, frame);
      container.append(frame);
      return frame;
    }

    function show(index) {
      if (index < 0 || index >= deck.length || index === currentIndex) return;
      const outgoing = frames.get(currentIndex);
      if (outgoing) {
        outgoing.classList.remove("active");
        outgoing.inert = true;
      }

      const incoming = getFrame(index);
      incoming.classList.add("active");
      incoming.inert = false;
      currentIndex = index;
      previous.disabled = index === 0;
      next.disabled = index === deck.length - 1;
      position.textContent = "第 " + (index + 1) + " 页，共 " + deck.length + " 页 · " + deck[index].title;
    }

    previous.addEventListener("click", () => show(currentIndex - 1));
    next.addEventListener("click", () => show(currentIndex + 1));
    document.addEventListener("keydown", handleKeys);
    show(0);
  </script>
