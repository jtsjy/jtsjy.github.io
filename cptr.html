<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>实用主义的C指针</title>
  <style>
    :root {
      --purple: #56268a;
      --line: #8a5cb1;
      --tint: #f7f1fc;
      --rail: clamp(36px, 4.5vw, 66px);
    }

    body {
      display: grid;
      grid-template-columns: var(--rail) minmax(0, 1fr) var(--rail);
      grid-template-rows: 100svh;
      margin: 0;
      background: #fff;
    }

    #slides {
      position: relative;
      grid-column: 2;
      grid-row: 1;
      min-width: 0;
    }

    iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      visibility: hidden;
      pointer-events: none;
    }

    iframe.active {
      visibility: visible;
      pointer-events: auto;
    }

    .turn {
      display: grid;
      grid-row: 1;
      place-self: center;
      place-items: center;
      width: clamp(30px, 3.45vw, 47px);
      height: clamp(38px, 3.45vw, 47px);
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: #fff;
      color: var(--purple);
      cursor: pointer;
    }

    #previous {
      grid-column: 1;
    }

    #next {
      grid-column: 3;
    }

    .turn::before {
      width: 0;
      height: 0;
      border-block: 7px solid transparent;
      content: "";
    }

    #previous::before {
      border-inline-end: 10px solid currentColor;
    }

    #next::before {
      border-inline-start: 10px solid currentColor;
    }

    .turn:hover:not(:disabled) {
      background: var(--tint);
    }

    .turn:focus-visible {
      outline: 2px solid var(--purple);
      outline-offset: 2px;
    }

    .turn:disabled {
      opacity: 0.35;
      cursor: default;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <button class="turn" id="previous" type="button" title="上一页" aria-label="上一页" aria-controls="slides" disabled></button>
  <main id="slides" aria-label="演示页面"></main>
  <button class="turn" id="next" type="button" title="下一页" aria-label="下一页" aria-controls="slides"></button>
  <p id="position" class="sr-only" role="status"></p>

    {"name":"P2","title":"另一种视角看指针的定义","html":"\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003ctitle>另一种视角看指针的定义\u003c/title>\n  \u003cstyle>\n    :root {\n      --purple: #56268a;\n      --purple-line: #8a5cb1;\n      --purple-tint: #f7f1fc;\n      --serif: \"Noto Serif SC\", \"Source Han Serif SC\", \"Songti SC\", SimSun, \"宋体\", serif;\n    }\n\n    body {\n      margin: 0;\n      background: #fff;\n      font-family: var(--serif);\n    }\n\n    .slide {\n      position: relative;\n      display: grid;\n      min-height: max(100svh, 420px);\n      place-items: center;\n    }\n\n    .declaration {\n      --leader: clamp(28px, 8vh, 76px);\n      margin: 0;\n      font: 400 clamp(48px, min(8vw, 14vh), 112px) / 1.12 Consolas, \"Courier New\", monospace;\n      color: #939096;\n      white-space: pre;\n    }\n\n    .declaration code {\n      font: inherit;\n    }\n\n    .token {\n      position: relative;\n      display: inline-block;\n      color: #000;\n      background: var(--purple-tint);\n      outline: 2px solid var(--purple-line);\n      outline-offset: 0.035em;\n      border-radius: 0.045em;\n    }\n\n    .keyword {\n      position: relative;\n      color: #000;\n      font-weight: 700;\n    }\n\n    .pointer-type {\n      position: relative;\n      display: inline-block;\n      isolation: isolate;\n    }\n\n    .type-frame {\n      position: absolute;\n      z-index: -1;\n      inset: 0 2ch 0 0;\n      background: var(--purple-tint);\n      outline: 2px solid var(--purple-line);\n      outline-offset: 0.035em;\n      border-radius: 0.045em;\n      transition: right 500ms ease;\n    }\n\n    .asterisk {\n      display: inline-block;\n      color: var(--purple);\n      transition: transform 500ms ease;\n    }\n\n    .grouped .type-frame {\n      right: 1ch;\n    }\n\n    .grouped .asterisk {\n      transform: translateX(-1ch);\n    }\n\n    .group-button {\n      position: absolute;\n      bottom: clamp(18px, 5vh, 52px);\n      padding: 0.38em 0.85em;\n      border: 1px solid var(--purple-line);\n      border-radius: 5px;\n      background: #fff;\n      color: var(--purple);\n      font: 700 clamp(15px, 1.45vw, 20px) / 1.35 var(--serif);\n      cursor: pointer;\n    }\n\n    .group-button:hover,\n    .group-button[aria-pressed=\"true\"] {\n      background: var(--purple-tint);\n    }\n\n    .group-button:focus-visible {\n      outline: 2px solid var(--purple);\n      outline-offset: 3px;\n    }\n\n    @media (prefers-reduced-motion: reduce) {\n      .type-frame,\n      .asterisk {\n        transition: none;\n      }\n    }\n\n    .label {\n      position: absolute;\n      left: 50%;\n      transform: translateX(-50%);\n      color: var(--purple);\n      font: 700 clamp(16px, min(2.15vw, 4vh), 32px) / 1.35 var(--serif);\n      white-space: nowrap;\n      user-select: none;\n    }\n\n    .label::after {\n      position: absolute;\n      left: 50%;\n      width: 2px;\n      height: var(--leader);\n      transform: translateX(-50%);\n      background: var(--purple-line);\n      content: \"\";\n    }\n\n    .label-above {\n      bottom: calc(100% + var(--leader) + 15px);\n    }\n\n    .label-above::after {\n      top: calc(100% + 8px);\n    }\n\n    .label-below {\n      top: calc(100% + var(--leader) + 15px);\n    }\n\n    .label-below::after {\n      bottom: calc(100% + 8px);\n    }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain class=\"slide\" aria-label=\"另一种视角看指针的定义\">\n    \u003cdiv>\n      \u003cpre class=\"declaration\" id=\"declaration\" aria-label=\"int *p;\" aria-describedby=\"annotation\">\u003ccode>\u003cspan class=\"pointer-type\">\u003cspan class=\"type-frame\" aria-hidden=\"true\">\u003cspan class=\"label label-above\">数据类型\u003c/span>\u003c/span>\u003cspan class=\"keyword\">int\u003c/span> \u003cspan class=\"asterisk\">*\u003c/span>\u003c/span>\u003cspan class=\"token\">p\u003cspan class=\"label label-below\" aria-hidden=\"true\">变量名称\u003c/span>\u003c/span>;\u003c/code>\u003c/pre>\n      \u003cdiv hidden id=\"annotation\">int 对应数据类型，p 对应变量名称。\u003c/div>\n    \u003c/div>\n    \u003cbutton class=\"group-button\" type=\"button\" aria-controls=\"declaration\" aria-pressed=\"false\">合并类型框\u003c/button>\n  \u003c/main>\n  \u003cscript>\n    const declaration = document.querySelector(\"#declaration\");\n    const annotation = document.querySelector(\"#annotation\");\n    const groupButton = document.querySelector(\".group-button\");\n\n    groupButton.addEventListener(\"click\", () => {\n      const grouped = declaration.classList.toggle(\"grouped\");\n      groupButton.setAttribute(\"aria-pressed\", String(grouped));\n      annotation.textContent = grouped\n        ? \"int 和星号合为一框，p 对应变量名称。\"\n        : \"int 对应数据类型，p 对应变量名称。\";\n    });\n  \u003c/script>\n\u003c/body>\n\u003c/html>\n"},
    {"name":"P2-1","title":"同一行声明两个变量","html":"\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003ctitle>同一行声明两个变量\u003c/title>\n  \u003cstyle>\n    :root {\n      --purple: #56268a;\n      --line: #8a5cb1;\n      --tint: #f7f1fc;\n      --gray: #77747c;\n      --mono: Consolas, \"Courier New\", monospace;\n    }\n\n    body {\n      margin: 0;\n      background: #fff;\n    }\n\n    main {\n      box-sizing: border-box;\n      display: grid;\n      grid-template-columns: repeat(2, minmax(0, 430px));\n      align-items: end;\n      place-content: center;\n      gap: clamp(36px, 9vw, 138px);\n      min-height: 100svh;\n      padding: 32px clamp(20px, 6vw, 86px);\n    }\n\n    figure {\n      display: grid;\n      justify-items: center;\n      gap: clamp(18px, 3vh, 31px);\n      margin: 0;\n      padding-bottom: 94px;\n    }\n\n    pre {\n      margin: 0;\n      color: var(--gray);\n      font-family: var(--mono);\n      line-height: 1.2;\n    }\n\n    code {\n      font: inherit;\n    }\n\n    .alias {\n      font-size: clamp(19px, 2.55vw, 34px);\n    }\n\n    .declaration {\n      font-size: clamp(32px, min(4.7vw, 9vh), 65px);\n    }\n\n    .keyword {\n      color: #000;\n    }\n\n    .star {\n      color: var(--purple);\n    }\n\n    .marked {\n      position: relative;\n      display: inline-block;\n      border-radius: 4px;\n      outline: 1.5px solid var(--line);\n      outline-offset: 0.04em;\n      background: var(--tint);\n      color: #000;\n    }\n\n    .marked::after {\n      position: absolute;\n      top: calc(100% + 5px);\n      left: calc(50% - 1px);\n      width: 1.5px;\n      height: 52px;\n      transform: rotate(var(--angle));\n      transform-origin: top center;\n      background: var(--line);\n      content: \"\";\n    }\n\n    .marked::before {\n      position: absolute;\n      top: calc(100% + 58px);\n      left: calc(50% + var(--shift));\n      transform: translateX(-50%);\n      color: var(--purple);\n      font-size: clamp(19px, 2.32vw, 31px);\n      font-weight: 700;\n      content: attr(data-type);\n    }\n\n    .first {\n      --angle: 28deg;\n      --shift: -24px;\n    }\n\n    .second {\n      --angle: -28deg;\n      --shift: 24px;\n    }\n\n    @media (max-width: 690px) {\n      main {\n        grid-template-columns: minmax(0, 430px);\n        gap: 34px;\n      }\n    }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain aria-label=\"对比同一行声明的两个变量\">\n    \u003cfigure aria-label=\"直接声明，p 的类型是 int 指针，q 的类型是 int\">\n      \u003cpre class=\"declaration\">\u003ccode>\u003cb class=\"keyword\">int\u003c/b> \u003cspan class=\"star\">*\u003c/span>\u003cspan class=\"marked first\" data-type=\"int *\">p\u003c/span>, \u003cspan class=\"marked second\" data-type=\"int\">q\u003c/span>;\u003c/code>\u003c/pre>\n    \u003c/figure>\n    \u003cfigure aria-label=\"使用指针类型别名，p 和 q 的类型都是 int 指针\">\n      \u003cpre class=\"alias\">\u003ccode>\u003cb class=\"keyword\">typedef int\u003c/b>\u003cspan class=\"star\">*\u003c/span> ptr;\u003c/code>\u003c/pre>\n      \u003cpre class=\"declaration\">\u003ccode>ptr \u003cspan class=\"marked first\" data-type=\"int *\">p\u003c/span>, \u003cspan class=\"marked second\" data-type=\"int *\">q\u003c/span>;\u003c/code>\u003c/pre>\n    \u003c/figure>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n"},
    {"name":"P3","title":"另一种视角看指针的定义","html":"\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003ctitle>另一种视角看指针的定义\u003c/title>\n  \u003cstyle>\n    :root {\n      --purple: #56268a;\n      --purple-line: #8a5cb1;\n      --purple-tint: #f7f1fc;\n      --serif: \"Noto Serif SC\", \"Source Han Serif SC\", \"Songti SC\", SimSun, \"宋体\", serif;\n    }\n\n    body {\n      margin: 0;\n      background: #fff;\n      font-family: var(--serif);\n    }\n\n    .slide {\n      box-sizing: border-box;\n      display: grid;\n      min-height: 100svh;\n      padding: clamp(32px, 7vh, 72px) 24px;\n    }\n\n    .examples {\n      display: grid;\n      grid-template-columns: repeat(2, auto);\n      justify-content: space-between;\n      align-self: center;\n      column-gap: 36px;\n      width: min(100%, 940px);\n      margin: 0 auto;\n    }\n\n    figure {\n      margin: 0;\n    }\n\n    figcaption {\n      margin-bottom: 0.65em;\n      color: var(--purple);\n      font: 700 clamp(16px, 1.65vw, 22px) / 1.3 var(--serif);\n    }\n\n    pre {\n      margin: 0;\n      color: #77747c;\n      font: 400 clamp(16px, min(2.55vw, 4.4vh), 34px) / 1.47 Consolas, \"Courier New\", monospace;\n      tab-size: 4;\n    }\n\n    code {\n      font: inherit;\n    }\n\n    .alignment {\n      display: block;\n      height: 1.47em;\n    }\n\n    .focus {\n      position: relative;\n      z-index: 0;\n      color: #000;\n    }\n\n    .focus::before {\n      position: absolute;\n      z-index: -1;\n      inset: -0.035em -0.23em;\n      border: 1.5px solid var(--purple-line);\n      border-radius: 0.14em;\n      background: var(--purple-tint);\n      content: \"\";\n    }\n\n    .keyword {\n      font-weight: 700;\n    }\n\n    @media (max-width: 640px) {\n      .examples {\n        grid-template-columns: 1fr;\n        justify-content: center;\n        row-gap: 30px;\n        width: max-content;\n        max-width: 100%;\n      }\n\n      .alignment {\n        display: none;\n      }\n    }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain class=\"slide\" aria-label=\"另一种视角看指针的定义\">\n    \u003cdiv class=\"examples\">\n      \u003cfigure>\n        \u003cfigcaption>1-1.c\u003c/figcaption>\n        \u003cpre>\u003ccode>#include &lt;stdio.h&gt;\n\u003cspan class=\"alignment\" aria-hidden=\"true\">\u003c/span>int a=10;\nint main()\n{\n\t\u003cspan class=\"focus\">\u003cspan class=\"keyword\">int\u003c/span> *p=&amp;a;\u003c/span>\n\t\u003cspan class=\"focus\">*p=20;\u003c/span>\n\treturn 0;\n}\u003c/code>\u003c/pre>\n      \u003c/figure>\n      \u003cfigure>\n        \u003cfigcaption>1-2.c\u003c/figcaption>\n        \u003cpre>\u003ccode>#include &lt;stdio.h&gt;\n\u003cspan class=\"focus\">\u003cspan class=\"keyword\">typedef int\u003c/span>* ptr;\u003c/span>\nint a=10;\nint main()\n{\n\t\u003cspan class=\"focus\">ptr p=&amp;a;\u003c/span>\n\t\u003cspan class=\"focus\">*p=20;\u003c/span>\n\treturn 0;\n}\u003c/code>\u003c/pre>\n      \u003c/figure>\n    \u003c/div>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n"},
    {"name":"P4","title":"解引用","html":"\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003ctitle>解引用\u003c/title>\n  \u003cstyle>\n    :root {\n      --purple: #56268a;\n      --purple-line: #8a5cb1;\n      --purple-tint: #f7f1fc;\n      --serif: \"Noto Serif SC\", \"Source Han Serif SC\", \"Songti SC\", SimSun, \"宋体\", serif;\n    }\n\n    body {\n      margin: 0;\n      background: #fff;\n    }\n\n    main {\n      display: grid;\n      min-height: max(100svh, 320px);\n      place-items: center;\n    }\n\n    pre {\n      --leader: clamp(28px, 8vh, 76px);\n      margin: 0;\n      color: #939096;\n      font: 400 clamp(48px, min(8vw, 14vh), 112px) / 1.12 Consolas, \"Courier New\", monospace;\n    }\n\n    code {\n      font: inherit;\n    }\n\n    .asterisk {\n      position: relative;\n      display: inline-block;\n      color: var(--purple);\n      background: var(--purple-tint);\n      outline: 2px solid var(--purple-line);\n      outline-offset: 0.035em;\n      border-radius: 0.045em;\n    }\n\n    .label {\n      position: absolute;\n      bottom: calc(100% + var(--leader) + 15px);\n      left: 50%;\n      transform: translateX(-50%);\n      font: 700 clamp(16px, min(2.15vw, 4vh), 32px) / 1.35 var(--serif);\n      white-space: nowrap;\n      user-select: none;\n    }\n\n    .label::after {\n      position: absolute;\n      top: calc(100% + 8px);\n      left: 50%;\n      width: 2px;\n      height: var(--leader);\n      transform: translateX(-50%);\n      background: var(--purple-line);\n      content: \"\";\n    }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain>\n    \u003cpre aria-label=\"*p=20;\" aria-describedby=\"annotation\">\u003ccode>\u003cspan class=\"asterisk\">*\u003cspan class=\"label\" aria-hidden=\"true\">解引用\u003c/span>\u003c/span>p=20;\u003c/code>\u003c/pre>\n    \u003cdiv hidden id=\"annotation\">星号表示解引用。\u003c/div>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n"},
    {"name":"P5","title":"scanf 要把 20 交给谁","html":"\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003ctitle>scanf 要把 20 交给谁\u003c/title>\n  \u003cstyle>\n    :root {\n      --purple: #56268a;\n      --purple-line: #8a5cb1;\n      --purple-tint: #f7f1fc;\n      --gray: #77747c;\n      --serif: \"Noto Serif SC\", \"Source Han Serif SC\", \"Songti SC\", SimSun, \"宋体\", serif;\n      --mono: Consolas, \"Courier New\", monospace;\n    }\n\n    body {\n      margin: 0;\n      background: #fff;\n      font-family: var(--serif);\n    }\n\n    main {\n      --avatar: clamp(50px, min(8vw, 12vh), 90px);\n      --speaker-size: clamp(16px, 1.75vw, 24px);\n      --gap: clamp(15px, 2.7vw, 34px);\n      --speech: clamp(18px, min(2.85vw, 5vh), 40px);\n      box-sizing: border-box;\n      display: grid;\n      grid-template-columns: minmax(0, 820px);\n      min-height: 100svh;\n      place-content: center;\n      justify-items: center;\n      gap: clamp(24px, 5.5vh, 48px);\n      padding: 28px 20px;\n    }\n\n    .conversation {\n      display: grid;\n      gap: clamp(12px, 2vh, 20px);\n      width: 100%;\n    }\n\n    .turn {\n      display: flex;\n      align-items: center;\n      gap: var(--gap);\n    }\n\n    .reply {\n      flex-direction: row-reverse;\n    }\n\n    .speaker {\n      display: grid;\n      flex: 0 0 auto;\n      justify-items: center;\n      gap: 0.13em;\n      margin: 0;\n      color: var(--gray);\n      font: 400 var(--speaker-size) / 1.25 var(--mono);\n    }\n\n    .reply .speaker {\n      color: var(--purple);\n      font-family: var(--serif);\n    }\n\n    .avatar {\n      position: relative;\n      isolation: isolate;\n      overflow: hidden;\n      width: var(--avatar);\n      aspect-ratio: 1;\n      border-radius: 50%;\n      background: #efedf0;\n    }\n\n    .avatar::before,\n    .avatar::after {\n      position: absolute;\n      left: 50%;\n      transform: translateX(-50%);\n      background: #88858c;\n      content: \"\";\n    }\n\n    .avatar::before {\n      top: 18%;\n      width: 32%;\n      aspect-ratio: 1;\n      border-radius: 50%;\n    }\n\n    .avatar::after {\n      top: 56%;\n      width: 68%;\n      height: 50%;\n      border-radius: 50% 50% 0 0;\n    }\n\n    .reply .avatar {\n      background: var(--purple-tint);\n    }\n\n    .reply .avatar::before,\n    .reply .avatar::after {\n      background: var(--purple-line);\n    }\n\n    code {\n      font-family: var(--mono);\n    }\n\n    .bubble {\n      position: relative;\n      margin: 0;\n      padding: 0.62em 0.85em;\n      border: 2px solid var(--purple-line);\n      border-radius: 0.48em;\n      background: #fff;\n      color: var(--purple);\n      font-size: var(--speech);\n      font-weight: 700;\n      line-height: 1.55;\n    }\n\n    .bubble::before,\n    .bubble::after {\n      position: absolute;\n      top: 50%;\n      left: 0;\n      transform: translate(-100%, -50%);\n      clip-path: polygon(0 50%, 100% 0, 100% 100%);\n      content: \"\";\n    }\n\n    .bubble::before {\n      width: 0.39em;\n      height: 0.64em;\n      background: var(--purple-line);\n    }\n\n    .bubble::after {\n      left: 2px;\n      width: calc(0.39em - 0.7px);\n      height: calc(0.64em - 2.2px);\n      background: #fff;\n    }\n\n    .reply .bubble::before,\n    .reply .bubble::after {\n      right: 0;\n      left: auto;\n      transform: translate(100%, -50%) scaleX(-1);\n    }\n\n    .reply .bubble::after {\n      right: 2px;\n    }\n\n    .terminal {\n      box-sizing: border-box;\n      width: min(100%, 470px);\n      overflow: hidden;\n      border: 2px solid var(--purple-line);\n      border-radius: 12px;\n      background: var(--purple-tint);\n    }\n\n    .terminal-bar {\n      display: flex;\n      gap: 6px;\n      padding: 12px 14px;\n      border-bottom: 1px solid #cbb5df;\n    }\n\n    .terminal-bar span {\n      width: 7px;\n      height: 7px;\n      border-radius: 50%;\n      background: var(--purple-line);\n    }\n\n    .terminal-input {\n      display: flex;\n      align-items: center;\n      gap: 0.4em;\n      margin: 0;\n      padding: 0.33em 0.56em 0.58em;\n      color: var(--purple);\n      font: 400 clamp(32px, min(4.6vw, 8vh), 62px) / 1.1 var(--mono);\n    }\n\n    .caret {\n      width: 0.054em;\n      height: 0.79em;\n      background: var(--purple-line);\n    }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain>\n    \u003cdiv class=\"terminal\" role=\"group\" aria-label=\"终端输入\">\n      \u003cdiv class=\"terminal-bar\" aria-hidden=\"true\">\u003cspan>\u003c/span>\u003cspan>\u003c/span>\u003cspan>\u003c/span>\u003c/div>\n      \u003cp class=\"terminal-input\">\u003ccode>20\u003c/code>\u003cspan class=\"caret\" aria-hidden=\"true\">\u003c/span>\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"conversation\" role=\"group\" aria-label=\"对话\">\n      \u003cdiv class=\"turn\">\n        \u003cfigure class=\"speaker\">\n          \u003cdiv class=\"avatar\" aria-hidden=\"true\">\u003c/div>\n          \u003cfigcaption>\u003ccode>scanf\u003c/code>\u003c/figcaption>\n        \u003c/figure>\n        \u003cp class=\"bubble\">这个 \u003ccode>20\u003c/code> 要我交给谁\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"turn reply\">\n        \u003cfigure class=\"speaker\">\n          \u003cdiv class=\"avatar\" aria-hidden=\"true\">\u003c/div>\n          \u003cfigcaption>你\u003c/figcaption>\n        \u003c/figure>\n        \u003cp class=\"bubble\">交给 \u003ccode>a\u003c/code>\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"turn\">\n        \u003cfigure class=\"speaker\">\n          \u003cdiv class=\"avatar\" aria-hidden=\"true\">\u003c/div>\n          \u003cfigcaption>\u003ccode>scanf\u003c/code>\u003c/figcaption>\n        \u003c/figure>\n        \u003cp class=\"bubble\">\u003ccode>a\u003c/code> 在哪里？我不知道\u003c/p>\n      \u003c/div>\n    \u003c/div>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n"},
    {"name":"P6","title":"scanf 如何找到要写的变量","html":"\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003ctitle>scanf 如何找到要写的变量\u003c/title>\n  \u003cstyle>\n    :root {\n      --purple: #56268a;\n      --purple-line: #8a5cb1;\n      --purple-tint: #f7f1fc;\n      --gray: #77747c;\n      --serif: \"Noto Serif SC\", \"Source Han Serif SC\", \"Songti SC\", SimSun, \"宋体\", serif;\n      --mono: Consolas, \"Courier New\", monospace;\n    }\n\n    body {\n      margin: 0;\n      background: #fff;\n      font-family: var(--serif);\n    }\n\n    main {\n      box-sizing: border-box;\n      display: grid;\n      min-height: 100svh;\n      place-content: center;\n      padding: 28px 20px;\n    }\n\n    .conversation {\n      display: flex;\n      align-items: center;\n      gap: var(--gap);\n      width: max-content;\n      max-width: 100%;\n    }\n\n    .speaker {\n      display: grid;\n      justify-items: center;\n      gap: 0.13em;\n      margin: 0;\n      color: var(--gray);\n      font: 400 var(--speaker-size) / 1.25 var(--mono);\n    }\n\n    .avatar {\n      position: relative;\n      isolation: isolate;\n      overflow: hidden;\n      width: var(--avatar);\n      aspect-ratio: 1;\n      border-radius: 50%;\n      background: #efedf0;\n    }\n\n    .avatar::before,\n    .avatar::after {\n      position: absolute;\n      left: 50%;\n      transform: translateX(-50%);\n      background: #88858c;\n      content: \"\";\n    }\n\n    .avatar::before {\n      top: 18%;\n      width: 32%;\n      aspect-ratio: 1;\n      border-radius: 50%;\n    }\n\n    .avatar::after {\n      top: 56%;\n      width: 68%;\n      height: 50%;\n      border-radius: 50% 50% 0 0;\n    }\n\n    code {\n      font-family: var(--mono);\n    }\n\n    .bubble {\n      position: relative;\n      margin: 0;\n      padding: 0.62em 0.85em;\n      border: 2px solid var(--purple-line);\n      border-radius: 0.48em;\n      background: #fff;\n      color: var(--purple);\n      font-size: var(--speech);\n      font-weight: 700;\n      line-height: 1.55;\n    }\n\n    .bubble::before,\n    .bubble::after {\n      position: absolute;\n      top: 50%;\n      left: 0;\n      transform: translate(-100%, -50%) rotate(var(--tail-angle, 0deg));\n      transform-origin: right center;\n      clip-path: polygon(0 50%, 100% 0, 100% 100%);\n      content: \"\";\n    }\n\n    .bubble::before {\n      width: 0.39em;\n      height: 0.64em;\n      background: var(--purple-line);\n    }\n\n    .bubble::after {\n      left: 2px;\n      width: calc(0.39em - 0.7px);\n      height: calc(0.64em - 2.2px);\n      background: #fff;\n    }\n\n    main {\n      --avatar: clamp(80px, 16vw, 196px);\n      --speaker-size: clamp(24px, 3.3vw, 42px);\n      --gap: clamp(18px, 4.5vw, 58px);\n      --speech: clamp(18px, 4vw, 55px);\n    }\n\n    @media (max-width: 480px) {\n      .conversation {\n        flex-direction: column;\n        gap: 14px;\n      }\n\n      .bubble {\n        --tail-angle: 90deg;\n      }\n\n      .bubble::before {\n        top: 0;\n        left: 50%;\n      }\n\n      .bubble::after {\n        top: 2px;\n        left: 50%;\n      }\n    }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain>\n    \u003cdiv class=\"conversation\">\n      \u003cfigure class=\"speaker\">\n        \u003cdiv class=\"avatar\" aria-hidden=\"true\">\u003c/div>\n        \u003cfigcaption>\u003ccode>scanf\u003c/code>\u003c/figcaption>\n      \u003c/figure>\n      \u003cp class=\"bubble\">你用 \u003ccode>&amp;\u003c/code> 交出地址，\u003cbr>我用这个地址找到要写的变量。\u003c/p>\n    \u003c/div>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n"},
    {"name":"P7","title":"scanf 与取地址","html":"\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003ctitle>scanf 与取地址\u003c/title>\n  \u003cstyle>\n    :root {\n      --purple: #56268a;\n      --purple-line: #8a5cb1;\n      --purple-tint: #f7f1fc;\n      --serif: \"Noto Serif SC\", \"Source Han Serif SC\", \"Songti SC\", SimSun, \"宋体\", serif;\n    }\n\n    body {\n      margin: 0;\n      background: #fff;\n      font-family: var(--serif);\n    }\n\n    main {\n      box-sizing: border-box;\n      min-height: 100svh;\n      padding: clamp(40px, 14vh, 112px) clamp(20px, 5vw, 84px);\n    }\n\n    .examples {\n      display: grid;\n      grid-template-columns: repeat(2, max-content) minmax(0, max-content);\n      justify-content: space-between;\n      gap: clamp(20px, 3vw, 52px);\n      max-width: 1360px;\n      margin-inline: auto;\n    }\n\n    figure {\n      margin: 0;\n    }\n\n    figcaption {\n      margin-bottom: 0.8em;\n      color: var(--purple);\n      font-size: clamp(16px, 1.65vw, 24px);\n      font-weight: 700;\n      line-height: 1.3;\n    }\n\n    pre {\n      margin: 0;\n      color: #77747c;\n      font: 400 clamp(16px, 1.82vw, 29px) / 1.51 Consolas, \"Courier New\", monospace;\n      tab-size: 4;\n    }\n\n    code {\n      font: inherit;\n    }\n\n    .focus {\n      position: relative;\n      z-index: 0;\n      color: #000;\n    }\n\n    .focus::before {\n      position: absolute;\n      z-index: -1;\n      inset: -0.035em -0.22em;\n      border: 1.5px solid var(--purple-line);\n      border-radius: 0.14em;\n      background: var(--purple-tint);\n      content: \"\";\n    }\n\n    .keyword {\n      font-weight: 700;\n    }\n\n    .format {\n      color: #af2424;\n    }\n\n    @media (max-width: 820px) {\n      .examples {\n        grid-template-columns: minmax(0, max-content);\n        justify-content: center;\n        row-gap: 32px;\n      }\n\n      pre {\n        font-size: clamp(13px, 4vw, 20px);\n      }\n    }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain aria-label=\"scanf 与取地址的三段代码\">\n    \u003cdiv class=\"examples\">\n      \u003cfigure>\n        \u003cfigcaption>3-1.c\u003c/figcaption>\n        \u003cpre>\u003ccode>#include &lt;stdio.h&gt;\nint main()\n{\n\tint a;\n\t\u003cspan class=\"focus\">scanf(\u003cspan class=\"format\">\"%d\"\u003c/span>,&amp;a);\u003c/span>\n\treturn 0;\n}\u003c/code>\u003c/pre>\n      \u003c/figure>\n      \u003cfigure>\n        \u003cfigcaption>3-2.c\u003c/figcaption>\n        \u003cpre>\u003ccode>#include &lt;stdio.h&gt;\nint main()\n{\n\tint a;\n\t\u003cspan class=\"focus\">\u003cspan class=\"keyword\">int\u003c/span> *p=&amp;a;\u003c/span>\n\t\u003cspan class=\"focus\">scanf(\u003cspan class=\"format\">\"%d\"\u003c/span>,p);\u003c/span>\n\treturn 0;\n}\u003c/code>\u003c/pre>\n      \u003c/figure>\n      \u003cfigure>\n        \u003cfigcaption>3-3.c\u003c/figcaption>\n        \u003cpre>\u003ccode>#include &lt;stdio.h&gt;\n\u003cspan class=\"focus\">\u003cspan class=\"keyword\">void\u003c/span> read_from_screen(\u003cspan class=\"keyword\">int\u003c/span> *dest)\u003c/span>\n{\n\t\u003cspan class=\"focus\">*dest=20;\u003c/span>\n}\nint main()\n{\n\tint a;\n\t\u003cspan class=\"focus\">read_from_screen(&amp;a);\u003c/span>\n\treturn 0;\n}\u003c/code>\u003c/pre>\n      \u003c/figure>\n    \u003c/div>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n"},
    {"name":"P8","title":"谁参与了赋值和传递","html":"\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003ctitle>谁参与了赋值和传递\u003c/title>\n  \u003cstyle>\n    :root {\n      --purple: #56268a;\n      --purple-line: #8a5cb1;\n      --purple-tint: #f7f1fc;\n      --gray: #77747c;\n      --serif: \"Noto Serif SC\", \"Source Han Serif SC\", \"Songti SC\", SimSun, \"宋体\", serif;\n      --mono: Consolas, \"Courier New\", monospace;\n    }\n\n    body {\n      margin: 0;\n      background: #fff;\n      font-family: var(--serif);\n    }\n\n    .slide {\n      box-sizing: border-box;\n      display: grid;\n      grid-template-columns: minmax(0, 1fr) 236px minmax(0, 1fr);\n      align-content: center;\n      column-gap: clamp(12px, 4vw, 56px);\n      row-gap: 28px;\n      width: min(100%, 1410px);\n      min-height: 100svh;\n      margin-inline: auto;\n      padding: 32px clamp(20px, 5vw, 80px);\n    }\n\n    .panel {\n      display: grid;\n      grid-row: span 2;\n      grid-template-rows: subgrid;\n      justify-items: center;\n      min-width: 0;\n    }\n\n    figure {\n      align-self: center;\n      margin: 0;\n      max-width: 100%;\n    }\n\n    figcaption {\n      margin-bottom: 0.8em;\n      color: var(--purple);\n      font-size: clamp(16px, 1.65vw, 24px);\n      font-weight: 700;\n    }\n\n    pre {\n      margin: 0;\n      color: var(--gray);\n      font: 400 clamp(16px, 2vw, 28px) / 1.52 var(--mono);\n      tab-size: 4;\n    }\n\n    code {\n      font-family: var(--mono);\n    }\n\n    pre code {\n      font: inherit;\n    }\n\n    .focus {\n      color: #000;\n      background: var(--purple-tint);\n      outline: 1.5px solid var(--purple-line);\n      outline-offset: 0.16em;\n      border-radius: 0.03em;\n    }\n\n    .diagram {\n      position: relative;\n      width: 236px;\n      height: 448px;\n      font-family: var(--mono);\n    }\n\n    .arrows {\n      position: absolute;\n      inset: 0;\n      width: 100%;\n      height: 100%;\n      overflow: visible;\n      color: var(--purple-line);\n      pointer-events: none;\n    }\n\n    .variables {\n      position: relative;\n      display: grid;\n      grid-template-rows: repeat(4, 112px);\n      margin: 0;\n    }\n\n    .variable {\n      display: grid;\n      grid-template-rows: 76px auto;\n      justify-items: center;\n      align-content: start;\n      gap: 4px;\n      padding-top: 4px;\n    }\n\n    .name {\n      grid-row: 2;\n      color: var(--gray);\n      font-size: 22px;\n    }\n\n    .value {\n      box-sizing: border-box;\n      grid-row: 1;\n      display: grid;\n      width: 76px;\n      height: 76px;\n      margin: 0;\n      place-items: center;\n      border: 2px solid #b3afb7;\n      border-radius: 5px;\n      background: #fff;\n      color: #29252d;\n      font-size: 30px;\n    }\n\n    .pointer .value {\n      color: var(--purple);\n    }\n\n    .changed .value {\n      border-color: var(--purple);\n      background: var(--purple-tint);\n      color: var(--purple);\n    }\n\n    .changed .name {\n      color: var(--purple);\n      font-weight: 700;\n    }\n\n    button {\n      padding: 0.38em 1.05em;\n      border: 1px solid var(--purple-line);\n      border-radius: 5px;\n      background: #fff;\n      color: var(--purple);\n      font: 700 clamp(16px, 1.55vw, 21px) / 1.35 var(--serif);\n      cursor: pointer;\n    }\n\n    button:hover,\n    button.selected {\n      background: var(--purple-tint);\n    }\n\n    button:focus-visible {\n      outline: 2px solid var(--purple);\n      outline-offset: 3px;\n    }\n\n    .sr-only {\n      position: absolute;\n      width: 1px;\n      height: 1px;\n      overflow: hidden;\n      clip-path: inset(50%);\n      white-space: nowrap;\n    }\n\n    @media (max-width: 730px) {\n      .slide {\n        grid-template-columns: minmax(0, 1fr);\n        row-gap: 34px;\n      }\n\n      .panel {\n        grid-row: auto;\n        grid-template-rows: auto auto;\n        gap: 16px;\n      }\n\n      .visual {\n        grid-row: 1;\n      }\n    }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain class=\"slide\" aria-label=\"谁参与了赋值和传递\">\n    \u003csection class=\"panel\" aria-labelledby=\"left-file\">\n      \u003cfigure>\n        \u003cfigcaption id=\"left-file\">2-1.c\u003c/figcaption>\n        \u003cpre>\u003ccode>#include &lt;stdio.h&gt;\ntypedef int* ptr;\nint a=10,b=20;\nint main()\n{\n\tptr p=&amp;a;\n\tptr q=&amp;b;\n\t\u003cspan class=\"focus\">p=q;\u003c/span>\n\treturn 0;\n}\u003c/code>\u003c/pre>\n      \u003c/figure>\n      \u003cbutton type=\"button\" data-action=\"pointer\" aria-label=\"运行 2-1.c\">运行\u003c/button>\n    \u003c/section>\n\n    \u003csection class=\"panel visual\" aria-label=\"变量与指向\">\n      \u003cdiv class=\"diagram\">\n        \u003csvg class=\"arrows\" viewBox=\"0 0 236 448\" aria-hidden=\"true\">\n          \u003cdefs>\n            \u003cmarker id=\"arrowhead\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\">\n              \u003cpath d=\"M 0 0 L 10 5 L 0 10 Z\" fill=\"currentColor\" />\n            \u003c/marker>\n          \u003c/defs>\n          \u003cg fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.25\" marker-end=\"url(#arrowhead)\">\n            \u003cpath id=\"p-arrow\" d=\"M 80 266 C 13 266, 13 42, 77 42\" />\n            \u003cpath d=\"M 156 378 C 223 378, 223 154, 159 154\" />\n          \u003c/g>\n        \u003c/svg>\n        \u003cdl class=\"variables\">\n          \u003cdiv class=\"variable\" id=\"var-a\">\n            \u003cdt class=\"name\">a\u003c/dt>\n            \u003cdd class=\"value\">10\u003c/dd>\n          \u003c/div>\n          \u003cdiv class=\"variable\">\n            \u003cdt class=\"name\">b\u003c/dt>\n            \u003cdd class=\"value\">20\u003c/dd>\n          \u003c/div>\n          \u003cdiv class=\"variable pointer\" id=\"var-p\">\n            \u003cdt class=\"name\">p\u003c/dt>\n            \u003cdd class=\"value\">&amp;a\u003c/dd>\n          \u003c/div>\n          \u003cdiv class=\"variable pointer\">\n            \u003cdt class=\"name\">q\u003c/dt>\n            \u003cdd class=\"value\">&amp;b\u003c/dd>\n          \u003c/div>\n        \u003c/dl>\n      \u003c/div>\n      \u003cbutton type=\"button\" data-action=\"reset\">复位\u003c/button>\n      \u003cdiv class=\"sr-only\" role=\"status\" id=\"status\">\u003c/div>\n    \u003c/section>\n\n    \u003csection class=\"panel\" aria-labelledby=\"right-file\">\n      \u003cfigure>\n        \u003cfigcaption id=\"right-file\">2-2.c\u003c/figcaption>\n        \u003cpre>\u003ccode>#include &lt;stdio.h&gt;\ntypedef int* ptr;\nint a=10,b=20;\nint main()\n{\n\tptr p=&amp;a;\n\tptr q=&amp;b;\n\t\u003cspan class=\"focus\">*p=*q;\u003c/span>\n\treturn 0;\n}\u003c/code>\u003c/pre>\n      \u003c/figure>\n      \u003cbutton type=\"button\" data-action=\"value\" aria-label=\"运行 2-2.c\">运行\u003c/button>\n    \u003c/section>\n  \u003c/main>\n  \u003cscript>\n    const variableA = document.querySelector(\"#var-a\");\n    const variableP = document.querySelector(\"#var-p\");\n    const valueA = variableA.querySelector(\".value\");\n    const valueP = variableP.querySelector(\".value\");\n    const pointerArrow = document.querySelector(\"#p-arrow\");\n    const status = document.querySelector(\"#status\");\n    const buttons = document.querySelectorAll(\"[data-action]\");\n\n    const arrowToA = pointerArrow.getAttribute(\"d\");\n    const arrowToB = \"M 80 266 C 13 266, 13 154, 77 154\";\n\n    function showState(action) {\n      const changedPointer = action === \"pointer\";\n      const changedValue = action === \"value\";\n\n      valueA.textContent = changedValue ? \"20\" : \"10\";\n      valueP.textContent = changedPointer ? \"&b\" : \"&a\";\n      pointerArrow.setAttribute(\"d\", changedPointer ? arrowToB : arrowToA);\n      variableA.classList.toggle(\"changed\", changedValue);\n      variableP.classList.toggle(\"changed\", changedPointer);\n\n      const announcements = {\n        pointer: \"p 得到 q 存的地址，现在两者都指向 b。\",\n        value: \"a 得到 b 里的整数 20，p 仍指向 a，q 仍指向 b。\",\n        reset: \"已复位，a 是 10，b 是 20，p 指向 a，q 指向 b。\"\n      };\n      status.textContent = announcements[action];\n    }\n\n    buttons.forEach(button => {\n      button.addEventListener(\"click\", () => {\n        const action = button.dataset.action;\n        showState(action);\n        buttons.forEach(control => control.classList.toggle(\n          \"selected\", action !== \"reset\" && control === button\n        ));\n      });\n    });\n  \u003c/script>\n\u003c/body>\n\u003c/html>\n"},
    {"name":"P9","title":"函数传参中的交换","html":"\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003ctitle>函数传参中的交换\u003c/title>\n  \u003cstyle>\n    :root {\n      --purple: #56268a;\n      --purple-line: #8a5cb1;\n      --purple-tint: #f7f1fc;\n      --gray: #77747c;\n      --serif: \"Noto Serif SC\", \"Source Han Serif SC\", \"Songti SC\", SimSun, \"宋体\", serif;\n      --mono: Consolas, \"Courier New\", monospace;\n    }\n\n    body {\n      margin: 0;\n      background: #fff;\n      font-family: var(--serif);\n    }\n\n    .slide {\n      box-sizing: border-box;\n      display: grid;\n      grid-template-columns: minmax(0, 1fr) minmax(282px, 340px) minmax(0, 1fr);\n      align-content: center;\n      gap: 24px clamp(14px, 3.4vw, 48px);\n      width: min(100%, 1400px);\n      min-height: 100svh;\n      margin-inline: auto;\n      padding: 26px clamp(18px, 4vw, 58px);\n    }\n\n    .panel {\n      display: grid;\n      grid-row: span 2;\n      grid-template-rows: subgrid;\n      justify-items: center;\n      min-width: 0;\n    }\n\n    figure {\n      align-self: start;\n      margin: 0;\n      max-width: 100%;\n    }\n\n    figcaption {\n      margin-bottom: 0.7em;\n      color: var(--purple);\n      font-size: clamp(16px, 1.65vw, 24px);\n      font-weight: 700;\n    }\n\n    pre {\n      margin: 0;\n      color: var(--gray);\n      font: 400 clamp(15px, min(1.81vw, 3.65vh), 26px) / 1.4 var(--mono);\n      tab-size: 4;\n    }\n\n    code {\n      font-family: var(--mono);\n    }\n\n    pre code {\n      font: inherit;\n    }\n\n    .current {\n      outline: 1.5px solid var(--purple-line);\n      outline-offset: 0.16em;\n      border-radius: 0.045em;\n      background: var(--purple-tint);\n      color: #000;\n    }\n\n    .diagram {\n      position: relative;\n      align-self: center;\n      width: min(100%, 340px);\n      font-family: var(--mono);\n    }\n\n    .caller,\n    .locals {\n      display: grid;\n      grid-template-columns: repeat(2, minmax(0, 1fr));\n      justify-items: center;\n      row-gap: 12px;\n      margin: 0;\n    }\n\n    .caller {\n      padding-top: 18px;\n    }\n\n    .variable {\n      display: grid;\n      grid-template-rows: 68px 21px;\n      justify-items: center;\n      gap: 4px;\n    }\n\n    dt {\n      grid-row: 2;\n      color: var(--gray);\n      font-size: 19px;\n      line-height: 21px;\n    }\n\n    dd {\n      box-sizing: border-box;\n      grid-row: 1;\n      display: grid;\n      width: 68px;\n      height: 68px;\n      place-items: center;\n      margin: 0;\n      border: 2px solid #b3afb7;\n      border-radius: 5px;\n      background: #fff;\n      color: #29252d;\n      font-size: 27px;\n    }\n\n    .scope {\n      box-sizing: border-box;\n      height: 248px;\n      margin-top: 24px;\n      border: 2px solid #cab9d9;\n      border-radius: 10px;\n      background: var(--purple-tint);\n      padding-top: 32px;\n    }\n\n    .scope.active {\n      border-color: var(--purple-line);\n    }\n\n    .scope-label {\n      position: absolute;\n      top: 143px;\n      left: 50%;\n      margin: 0;\n      transform: translateX(-50%);\n      color: var(--purple);\n      font-size: 18px;\n    }\n\n    [data-name=\"temp\"] {\n      grid-column: 1 / -1;\n    }\n\n    .unset dd {\n      color: #aaa5af;\n    }\n\n    .pointer dd {\n      color: var(--purple);\n    }\n\n    .written dd {\n      border-color: var(--purple);\n      background: #eee1f9;\n      color: var(--purple);\n    }\n\n    .written dt {\n      color: var(--purple);\n      font-weight: 700;\n    }\n\n    .arrows {\n      position: absolute;\n      z-index: 1;\n      inset: 0;\n      width: 100%;\n      height: 384px;\n      overflow: visible;\n      color: var(--purple-line);\n      pointer-events: none;\n    }\n\n    .arrows[hidden] {\n      display: none;\n    }\n\n    .status {\n      box-sizing: border-box;\n      min-height: 3em;\n      margin: 12px 0 0;\n      color: var(--purple);\n      font: 700 clamp(15px, 1.55vw, 19px) / 1.5 var(--serif);\n      text-align: center;\n    }\n\n    button {\n      padding: 0.38em 1.05em;\n      border: 1px solid var(--purple-line);\n      border-radius: 5px;\n      background: #fff;\n      color: var(--purple);\n      font: 700 clamp(16px, 1.55vw, 21px) / 1.35 var(--serif);\n      cursor: pointer;\n    }\n\n    button:hover,\n    button.selected {\n      background: var(--purple-tint);\n    }\n\n    button:focus-visible {\n      outline: 2px solid var(--purple);\n      outline-offset: 3px;\n    }\n\n    @media (max-width: 790px) {\n      .slide {\n        grid-template-columns: minmax(0, 1fr);\n        row-gap: 32px;\n      }\n\n      .panel {\n        grid-row: auto;\n        grid-template-rows: auto auto;\n        gap: 14px;\n      }\n\n      .visual {\n        grid-row: 1;\n        position: sticky;\n        top: 0;\n        z-index: 2;\n        background: #fff;\n        padding-bottom: 8px;\n      }\n    }\n\n    @media (max-width: 790px) and (max-height: 660px) {\n      .visual {\n        position: static;\n      }\n    }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain class=\"slide\" aria-label=\"函数传参中的交换\">\n    \u003csection class=\"panel\" aria-labelledby=\"file-1\">\n      \u003cfigure>\n        \u003cfigcaption id=\"file-1\">4-1.c\u003c/figcaption>\n        \u003cpre>\u003ccode>#include &lt;stdio.h&gt;\nvoid swap(int x,int y)\n{\n\t\u003cspan data-step=\"2\">\u003cb>int\u003c/b> temp=x;\u003c/span>\n\t\u003cspan data-step=\"3\">x=y;\u003c/span>\n\t\u003cspan data-step=\"4\">y=temp;\u003c/span>\n\u003cspan data-step=\"5\">}\u003c/span>\nint main()\n{\n\tint a=10,b=20;\n\t\u003cspan data-step=\"1\">swap(a,b);\u003c/span>\n\treturn 0;\n}\u003c/code>\u003c/pre>\n      \u003c/figure>\n      \u003cbutton type=\"button\" data-run=\"value\" aria-label=\"单步运行 4-1.c\">单步运行\u003c/button>\n    \u003c/section>\n\n    \u003csection class=\"panel visual\" aria-label=\"变量和函数作用域\">\n      \u003cdiv class=\"diagram\">\n        \u003cdl class=\"caller\" aria-label=\"main 中的变量\">\n          \u003cdiv class=\"variable\" data-name=\"a\">\n            \u003cdt>a\u003c/dt>\n            \u003cdd>10\u003c/dd>\n          \u003c/div>\n          \u003cdiv class=\"variable\" data-name=\"b\">\n            \u003cdt>b\u003c/dt>\n            \u003cdd>20\u003c/dd>\n          \u003c/div>\n        \u003c/dl>\n        \u003csection class=\"scope\" aria-labelledby=\"scope-label\">\n          \u003ch2 class=\"scope-label\" id=\"scope-label\">\u003ccode>swap\u003c/code>\u003c/h2>\n          \u003cdl class=\"locals\">\n          \u003cdiv class=\"variable\" data-name=\"x\">\n            \u003cdt>x\u003c/dt>\n            \u003cdd>—\u003c/dd>\n          \u003c/div>\n          \u003cdiv class=\"variable\" data-name=\"y\">\n            \u003cdt>y\u003c/dt>\n            \u003cdd>—\u003c/dd>\n          \u003c/div>\n          \u003cdiv class=\"variable\" data-name=\"temp\">\n            \u003cdt>temp\u003c/dt>\n            \u003cdd>—\u003c/dd>\n          \u003c/div>\n          \u003c/dl>\n        \u003c/section>\n        \u003csvg class=\"arrows\" viewBox=\"0 0 340 384\" preserveAspectRatio=\"none\" aria-hidden=\"true\" hidden>\n          \u003cdefs>\n            \u003cmarker id=\"arrowhead\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\">\n              \u003cpath d=\"M 0 0 L 10 5 L 0 10 Z\" fill=\"currentColor\" />\n            \u003c/marker>\n          \u003c/defs>\n          \u003cg fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.25\" marker-end=\"url(#arrowhead)\">\n            \u003cpath id=\"arrow-x\" />\n            \u003cpath id=\"arrow-y\" />\n          \u003c/g>\n        \u003c/svg>\n        \u003cp class=\"status\" role=\"status\">选择一侧开始\u003c/p>\n      \u003c/div>\n      \u003cbutton type=\"button\" id=\"reset\">复位\u003c/button>\n    \u003c/section>\n\n    \u003csection class=\"panel\" aria-labelledby=\"file-2\">\n      \u003cfigure>\n        \u003cfigcaption id=\"file-2\">4-2.c\u003c/figcaption>\n        \u003cpre>\u003ccode>#include &lt;stdio.h&gt;\ntypedef int* ptr;\nvoid swap(ptr x,ptr y)\n{\n\t\u003cspan data-step=\"2\">\u003cb>int\u003c/b> temp=*x;\u003c/span>\n\t\u003cspan data-step=\"3\">*x=*y;\u003c/span>\n\t\u003cspan data-step=\"4\">*y=temp;\u003c/span>\n\u003cspan data-step=\"5\">}\u003c/span>\nint main()\n{\n\tint a=10,b=20;\n\t\u003cspan data-step=\"1\">swap(&amp;a,&amp;b);\u003c/span>\n\treturn 0;\n}\u003c/code>\u003c/pre>\n      \u003c/figure>\n      \u003cbutton type=\"button\" data-run=\"pointer\" aria-label=\"单步运行 4-2.c\">单步运行\u003c/button>\n    \u003c/section>\n  \u003c/main>\n  \u003cscript>\n    const frames = {\n      value: [\n        {x: \"10\", y: \"20\", written: [\"x\", \"y\"], message: \"进入 swap，x 和 y 收到整数副本。\"},\n        {x: \"10\", y: \"20\", temp: \"10\", written: [\"temp\"], message: \"把 x 的值 10 存进 temp。\"},\n        {x: \"20\", y: \"20\", temp: \"10\", written: [\"x\"], message: \"把 y 的值 20 写入形参 x。\"},\n        {x: \"20\", y: \"10\", temp: \"10\", written: [\"y\"], message: \"把 temp 的值 10 写入形参 y。\"},\n        {message: \"返回 main，a 仍是 10，b 仍是 20。\"}\n      ],\n      pointer: [\n        {x: \"&a\", y: \"&b\", written: [\"x\", \"y\"], message: \"进入 swap，x 收到 &a，y 收到 &b。\"},\n        {x: \"&a\", y: \"&b\", temp: \"10\", written: [\"temp\"], message: \"通过 x 读出 a 的值，存进 temp。\"},\n        {a: \"20\", x: \"&a\", y: \"&b\", temp: \"10\", written: [\"a\"], message: \"通过 y 读出 b 的值，通过 x 写入 a。\"},\n        {a: \"20\", b: \"10\", x: \"&a\", y: \"&b\", temp: \"10\", written: [\"b\"], message: \"通过 y 把 temp 的值写入 b。\"},\n        {a: \"20\", b: \"10\", message: \"返回 main，a 是 20，b 是 10。\"}\n      ]\n    };\n\n    const initial = {a: \"10\", b: \"20\", message: \"选择一侧开始\"};\n    const variables = document.querySelectorAll(\"[data-name]\");\n    const runButtons = document.querySelectorAll(\"[data-run]\");\n    const scope = document.querySelector(\".scope\");\n    const arrows = document.querySelector(\".arrows\");\n    const diagram = document.querySelector(\".diagram\");\n    const status = document.querySelector(\".status\");\n    const arrowX = document.querySelector(\"#arrow-x\");\n    const arrowY = document.querySelector(\"#arrow-y\");\n    let mode = null;\n    let step = 0;\n\n    function positionArrows() {\n      if (arrows.hasAttribute(\"hidden\")) return;\n      const diagramBounds = diagram.getBoundingClientRect();\n      const scale = 340 / diagramBounds.width;\n      for (const [pointer, target, side, path] of [\n        [\"x\", \"a\", -1, arrowX],\n        [\"y\", \"b\", 1, arrowY]\n      ]) {\n        const bounds = name => diagram.querySelector('[data-name=\"' + name + '\"] dd').getBoundingClientRect();\n        const from = bounds(pointer);\n        const to = bounds(target);\n        const edge = box => side === -1 ? box.left : box.right;\n        const x1 = (edge(from) - diagramBounds.left) * scale;\n        const x2 = (edge(to) - diagramBounds.left) * scale;\n        const y1 = from.top + from.height / 2 - diagramBounds.top;\n        const y2 = to.top + to.height / 2 - diagramBounds.top;\n        path.setAttribute(\"d\", `M ${x1} ${y1} C ${x1 + side * 44} ${y1}, ${x2 + side * 44} ${y2}, ${x2 + side * 3} ${y2}`);\n      }\n    }\n\n    function render() {\n      const frame = mode ? frames[mode][step - 1] : initial;\n      const insideSwap = frame.x !== undefined;\n      scope.classList.toggle(\"active\", insideSwap);\n      arrows.toggleAttribute(\"hidden\", !(mode === \"pointer\" && insideSwap));\n\n      for (const variable of variables) {\n        const name = variable.dataset.name;\n        const value = frame[name] ?? initial[name];\n        variable.querySelector(\"dd\").textContent = value ?? \"—\";\n        variable.classList.toggle(\"unset\", value === undefined);\n        variable.classList.toggle(\"pointer\", mode === \"pointer\" && insideSwap && (name === \"x\" || name === \"y\"));\n        variable.classList.toggle(\"written\", frame.written?.includes(name) ?? false);\n      }\n\n      for (const button of runButtons) {\n        const active = button.dataset.run === mode;\n        button.classList.toggle(\"selected\", active);\n        for (const line of button.closest(\".panel\").querySelectorAll(\"[data-step]\")) {\n          line.classList.toggle(\"current\", active && Number(line.dataset.step) === step);\n        }\n      }\n\n      status.textContent = mode ? `${step}/${frames[mode].length}　${frame.message}` : frame.message;\n      positionArrows();\n    }\n\n    runButtons.forEach(button => {\n      button.addEventListener(\"click\", () => {\n        const nextMode = button.dataset.run;\n        step = mode === nextMode && step \u003c frames[nextMode].length ? step + 1 : 1;\n        mode = nextMode;\n        render();\n      });\n    });\n\n    document.querySelector(\"#reset\").addEventListener(\"click\", () => {\n      mode = null;\n      step = 0;\n      render();\n    });\n\n    window.addEventListener(\"resize\", positionArrows);\n    render();\n  \u003c/script>\n\u003c/body>\n\u003c/html>\n"},
    {"name":"P11-1","title":"指针加一跨过多少字节","html":"\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003ctitle>指针加一跨过多少字节\u003c/title>\n  \u003cstyle>\n    :root {\n      --purple: #56268a;\n      --line: #8a5cb1;\n      --tint: #f7f1fc;\n      --gray: #77747c;\n      --serif: \"Noto Serif SC\", \"Source Han Serif SC\", \"Songti SC\", SimSun, \"宋体\", serif;\n      --mono: Consolas, \"Courier New\", monospace;\n    }\n\n    body {\n      margin: 0;\n      background: #fff;\n      font-family: var(--serif);\n    }\n\n    main {\n      --unit: clamp(15px, min(6.4vw, 7vh), 66px);\n      box-sizing: border-box;\n      display: grid;\n      justify-items: center;\n      align-content: center;\n      gap: 15px;\n      min-height: 100svh;\n      padding: 25px clamp(18px, 5vw, 75px);\n    }\n\n    code {\n      font-family: var(--mono);\n    }\n\n    .memory {\n      display: grid;\n      gap: clamp(10px, 2vh, 16px);\n      width: calc(12 * var(--unit));\n    }\n\n    .scale {\n      margin: 0;\n      color: var(--gray);\n      font-size: clamp(14px, 1.5vw, 20px);\n      text-align: right;\n    }\n\n    .memory-row[data-stride=\"4\"] {\n      --stride: 4;\n    }\n\n    .memory-row[data-stride=\"2\"] {\n      --stride: 2;\n    }\n\n    h2 {\n      margin: 0 0 7px;\n      color: var(--purple);\n      font-size: clamp(17px, 1.9vw, 26px);\n      font-weight: 700;\n    }\n\n    .byte-map {\n      position: relative;\n      padding-bottom: 42px;\n    }\n\n    .groups {\n      display: flex;\n    }\n\n    .group {\n      display: grid;\n      grid-template-columns: repeat(var(--stride), var(--unit));\n      grid-template-rows: minmax(26px, auto) var(--unit);\n    }\n\n    .group-name {\n      display: flex;\n      grid-column: 1 / -1;\n      justify-content: center;\n      align-items: center;\n      gap: 0.28em;\n      padding-bottom: 6px;\n      color: var(--purple);\n      font-size: clamp(11px, 1.5vw, 21px);\n      white-space: nowrap;\n    }\n\n    .value {\n      display: none;\n    }\n\n    .value::before {\n      content: \"= \";\n    }\n\n    .memory.ready .value {\n      display: inline;\n    }\n\n    .cell {\n      box-sizing: border-box;\n      border: 1px solid #c4b5cf;\n      border-left: 0;\n    }\n\n    .group:first-child .cell:first-of-type {\n      border-left: 2px solid var(--line);\n    }\n\n    .cell:last-child {\n      border-right: 2px solid var(--line);\n    }\n\n    .memory.ready .group:nth-child(odd) .cell {\n      background: var(--tint);\n    }\n\n    .memory.ready .group:nth-child(even) .cell {\n      background: #fdfbff;\n    }\n\n    .marker {\n      position: absolute;\n      bottom: 0;\n      left: 0;\n      height: 41px;\n      transform: translateX(-50%);\n      color: var(--purple);\n      font-weight: 700;\n      font-size: clamp(16px, 1.8vw, 24px);\n      line-height: 1;\n      text-align: center;\n    }\n\n    .marker:not([hidden]) {\n      display: grid;\n      justify-items: center;\n      align-content: end;\n    }\n\n    .marker::before {\n      position: absolute;\n      top: 1px;\n      bottom: 1.05em;\n      left: calc(50% - 1px);\n      border-left: 2px solid currentColor;\n      content: \"\";\n    }\n\n    .marker::after {\n      position: absolute;\n      top: 0;\n      left: 50%;\n      transform: translateX(-50%);\n      border: solid transparent;\n      border-width: 0 4px 6px;\n      border-bottom-color: currentColor;\n      content: \"\";\n    }\n\n    .marker.q {\n      left: calc(var(--stride) * var(--unit));\n    }\n\n    .examples {\n      display: grid;\n      grid-template-columns: repeat(2, minmax(0, 1fr));\n      justify-items: center;\n      column-gap: clamp(22px, 5vw, 72px);\n      width: min(100%, 970px);\n      margin-top: 9px;\n    }\n\n    pre {\n      max-width: 100%;\n      margin: 0;\n      padding: 3px 4px;\n      overflow-x: auto;\n      color: var(--gray);\n      font: 400 clamp(13px, min(1.95vw, 3.45vh), 26px) / 1.45 var(--mono);\n    }\n\n    pre code {\n      font: inherit;\n    }\n\n    .focus,\n    .current {\n      border-radius: 2px;\n      outline: 1.5px solid var(--line);\n      outline-offset: 0.12em;\n      background: var(--tint);\n      color: #000;\n    }\n\n    .focus.current {\n      outline-color: var(--purple);\n      outline-width: 2px;\n    }\n\n    .status {\n      min-height: 1.5em;\n      margin: 0;\n      color: var(--purple);\n      text-align: center;\n      font-size: clamp(15px, 1.5vw, 20px);\n      font-weight: 700;\n      line-height: 1.5;\n    }\n\n    .controls {\n      display: flex;\n      gap: 14px;\n    }\n\n    button {\n      padding: 0.35em 1em;\n      border: 1px solid var(--line);\n      border-radius: 5px;\n      background: #fff;\n      color: var(--purple);\n      font: 700 clamp(16px, 1.55vw, 21px) / 1.35 var(--serif);\n      cursor: pointer;\n    }\n\n    button:hover:not(:disabled) {\n      background: var(--tint);\n    }\n\n    button:focus-visible {\n      outline: 2px solid var(--purple);\n      outline-offset: 3px;\n    }\n\n    button:disabled {\n      opacity: 0.5;\n      cursor: default;\n    }\n\n    @media (max-width: 620px) {\n      .examples {\n        grid-template-columns: minmax(0, 1fr);\n        row-gap: 10px;\n      }\n\n      .group-name {\n        flex-direction: column;\n        align-items: center;\n        gap: 0;\n      }\n\n      .value::before {\n        content: \"\";\n      }\n    }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain aria-label=\"对比 int 和 short 指针加一\">\n    \u003cdiv class=\"memory\">\n      \u003cp class=\"scale\">1 格 = 1 字节\u003c/p>\n    \u003csection class=\"memory-row\" data-stride=\"4\" aria-label=\"int 数组 a\">\n      \u003ch2>\u003ccode>sizeof(int) = 4\u003c/code> 字节\u003c/h2>\n      \u003cdiv class=\"byte-map\">\n        \u003cdiv class=\"groups\">\n          \u003cdiv class=\"group\">\n            \u003cdiv class=\"group-name\">\u003ccode>a[0]\u003c/code>\u003ccode class=\"value\">10\u003c/code>\u003c/div>\n            \u003cspan class=\"cell\" aria-hidden=\"true\">\u003c/span>\u003cspan class=\"cell\" aria-hidden=\"true\">\u003c/span>\u003cspan class=\"cell\" aria-hidden=\"true\">\u003c/span>\u003cspan class=\"cell\" aria-hidden=\"true\">\u003c/span>\n          \u003c/div>\n          \u003cdiv class=\"group\">\n            \u003cdiv class=\"group-name\">\u003ccode>a[1]\u003c/code>\u003ccode class=\"value\">20\u003c/code>\u003c/div>\n            \u003cspan class=\"cell\" aria-hidden=\"true\">\u003c/span>\u003cspan class=\"cell\" aria-hidden=\"true\">\u003c/span>\u003cspan class=\"cell\" aria-hidden=\"true\">\u003c/span>\u003cspan class=\"cell\" aria-hidden=\"true\">\u003c/span>\n          \u003c/div>\n          \u003cdiv class=\"group\">\n            \u003cdiv class=\"group-name\">\u003ccode>a[2]\u003c/code>\u003ccode class=\"value\">30\u003c/code>\u003c/div>\n            \u003cspan class=\"cell\" aria-hidden=\"true\">\u003c/span>\u003cspan class=\"cell\" aria-hidden=\"true\">\u003c/span>\u003cspan class=\"cell\" aria-hidden=\"true\">\u003c/span>\u003cspan class=\"cell\" aria-hidden=\"true\">\u003c/span>\n          \u003c/div>\n        \u003c/div>\n        \u003cspan class=\"marker p\" hidden>\u003ccode>p\u003c/code>\u003c/span>\n        \u003cspan class=\"marker q\" hidden>\u003ccode>q\u003c/code>\u003c/span>\n      \u003c/div>\n    \u003c/section>\n    \u003csection class=\"memory-row\" data-stride=\"2\" aria-label=\"short 数组 b\">\n      \u003ch2>\u003ccode>sizeof(short) = 2\u003c/code> 字节\u003c/h2>\n      \u003cdiv class=\"byte-map\">\n        \u003cdiv class=\"groups\">\n          \u003cdiv class=\"group\">\n            \u003cdiv class=\"group-name\">\u003ccode>b[0]\u003c/code>\u003ccode class=\"value\">10\u003c/code>\u003c/div>\n            \u003cspan class=\"cell\" aria-hidden=\"true\">\u003c/span>\u003cspan class=\"cell\" aria-hidden=\"true\">\u003c/span>\n          \u003c/div>\n          \u003cdiv class=\"group\">\n            \u003cdiv class=\"group-name\">\u003ccode>b[1]\u003c/code>\u003ccode class=\"value\">20\u003c/code>\u003c/div>\n            \u003cspan class=\"cell\" aria-hidden=\"true\">\u003c/span>\u003cspan class=\"cell\" aria-hidden=\"true\">\u003c/span>\n          \u003c/div>\n          \u003cdiv class=\"group\">\n            \u003cdiv class=\"group-name\">\u003ccode>b[2]\u003c/code>\u003ccode class=\"value\">30\u003c/code>\u003c/div>\n            \u003cspan class=\"cell\" aria-hidden=\"true\">\u003c/span>\u003cspan class=\"cell\" aria-hidden=\"true\">\u003c/span>\n          \u003c/div>\n          \u003cdiv class=\"group\">\n            \u003cdiv class=\"group-name\">\u003ccode>b[3]\u003c/code>\u003ccode class=\"value\">40\u003c/code>\u003c/div>\n            \u003cspan class=\"cell\" aria-hidden=\"true\">\u003c/span>\u003cspan class=\"cell\" aria-hidden=\"true\">\u003c/span>\n          \u003c/div>\n          \u003cdiv class=\"group\">\n            \u003cdiv class=\"group-name\">\u003ccode>b[4]\u003c/code>\u003ccode class=\"value\">50\u003c/code>\u003c/div>\n            \u003cspan class=\"cell\" aria-hidden=\"true\">\u003c/span>\u003cspan class=\"cell\" aria-hidden=\"true\">\u003c/span>\n          \u003c/div>\n        \u003c/div>\n        \u003cspan class=\"marker p\" hidden>\u003ccode>p\u003c/code>\u003c/span>\n        \u003cspan class=\"marker q\" hidden>\u003ccode>q\u003c/code>\u003c/span>\n      \u003c/div>\n    \u003c/section>\n    \u003c/div>\n\n    \u003cdiv class=\"examples\">\n      \u003cpre aria-label=\"int 示例\">\u003ccode>\u003cspan data-step=\"1\">int a[3]={10,20,30};\u003c/span>\n\u003cspan data-step=\"2\">int *p=a;\u003c/span>\n\u003cspan class=\"focus\" data-step=\"3\">int *q=p+1;\u003c/span>\u003c/code>\u003c/pre>\n      \u003cpre aria-label=\"short 示例\">\u003ccode>\u003cspan data-step=\"1\">short b[5]={10,20,30,40,50};\u003c/span>\n\u003cspan data-step=\"2\">short *p=b;\u003c/span>\n\u003cspan class=\"focus\" data-step=\"3\">short *q=p+1;\u003c/span>\u003c/code>\u003c/pre>\n    \u003c/div>\n    \u003cp class=\"status\" id=\"status\" role=\"status\">点击「单步运行」开始。\u003c/p>\n    \u003cdiv class=\"controls\">\n      \u003cbutton type=\"button\" id=\"run\">单步运行\u003c/button>\n      \u003cbutton type=\"button\" id=\"reset\">复位\u003c/button>\n    \u003c/div>\n  \u003c/main>\n  \u003cscript>\n    const messages = [\n      \"点击「单步运行」开始。\",\n      \"两个数组的元素分别占 4 格和 2 格。\",\n      \"两侧的 p 都指向各自的首元素。\",\n      \"q 分别跨过 4 字节和 2 字节。两侧 q - p 都等于 1。\"\n    ];\n\n    const memory = document.querySelector(\".memory\");\n    const pMarkers = memory.querySelectorAll(\".marker.p\");\n    const qMarkers = memory.querySelectorAll(\".marker.q\");\n    const run = document.querySelector(\"#run\");\n    const status = document.querySelector(\"#status\");\n    const reducedMotion = window.matchMedia(\"(prefers-reduced-motion: reduce)\");\n    let step = 0;\n\n    function render() {\n      memory.classList.toggle(\"ready\", step >= 1);\n      for (const marker of pMarkers) marker.hidden = step \u003c 2;\n      for (const marker of qMarkers) {\n        marker.getAnimations().forEach(animation => animation.cancel());\n        marker.hidden = step \u003c 3;\n        if (step === 3 && !reducedMotion.matches) {\n          const destination = getComputedStyle(marker).left;\n          marker.animate([{left: \"0px\"}, {left: destination}], {duration: 680, easing: \"ease-in-out\"});\n        }\n      }\n\n      for (const line of document.querySelectorAll(\"[data-step]\")) {\n        line.classList.toggle(\"current\", Number(line.dataset.step) === step);\n      }\n      status.textContent = messages[step];\n      run.disabled = step === messages.length - 1;\n    }\n\n    run.addEventListener(\"click\", () => {\n      step++;\n      render();\n    });\n\n    document.querySelector(\"#reset\").addEventListener(\"click\", () => {\n      step = 0;\n      render();\n    });\n  \u003c/script>\n\u003c/body>\n\u003c/html>\n"},
    {"name":"P10","title":"数组中的指针运算","html":"\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003ctitle>数组中的指针运算\u003c/title>\n  \u003cstyle>\n    :root {\n      --purple: #56268a;\n      --purple-line: #8a5cb1;\n      --purple-tint: #f7f1fc;\n      --gray: #77747c;\n      --serif: \"Noto Serif SC\", \"Source Han Serif SC\", \"Songti SC\", SimSun, \"宋体\", serif;\n      --mono: Consolas, \"Courier New\", monospace;\n    }\n\n    body {\n      margin: 0;\n      background: #fff;\n      font-family: var(--serif);\n    }\n\n    main {\n      box-sizing: border-box;\n      display: grid;\n      grid-template-columns: minmax(0, 1fr) minmax(270px, 360px) minmax(0, 1fr);\n      align-content: center;\n      gap: 28px clamp(14px, 3vw, 44px);\n      width: min(100%, 1400px);\n      min-height: 100svh;\n      margin-inline: auto;\n      padding: 30px clamp(18px, 3.5vw, 52px);\n    }\n\n    .panel {\n      display: grid;\n      grid-row: span 2;\n      grid-template-rows: subgrid;\n      justify-items: center;\n      align-items: center;\n      min-width: 0;\n    }\n\n    figure {\n      margin: 0;\n      max-width: 100%;\n    }\n\n    figcaption {\n      margin-bottom: 0.7em;\n      color: var(--purple);\n      font-size: clamp(16px, 1.65vw, 24px);\n      font-weight: 700;\n    }\n\n    pre {\n      margin: 0;\n      color: var(--gray);\n      font: 400 clamp(15px, min(1.8vw, 4.15vh), 26px) / 1.52 var(--mono);\n      tab-size: 4;\n    }\n\n    code {\n      font-family: var(--mono);\n    }\n\n    pre code {\n      font: inherit;\n    }\n\n    .current {\n      outline: 1.5px solid var(--purple-line);\n      outline-offset: 0.16em;\n      border-radius: 0.045em;\n      background: var(--purple-tint);\n      color: #000;\n    }\n\n    .visual {\n      width: 100%;\n    }\n\n    .diagram {\n      width: min(100%, 360px);\n    }\n\n    .memory {\n      position: relative;\n      font-family: var(--mono);\n    }\n\n    .array,\n    .variables {\n      display: grid;\n      margin: 0;\n      text-align: center;\n    }\n\n    .array {\n      grid-template-columns: repeat(3, minmax(0, 1fr));\n    }\n\n    .variables {\n      grid-template-columns: repeat(2, minmax(0, 1fr));\n      justify-items: center;\n      margin-top: 102px;\n    }\n\n    dt {\n      color: var(--gray);\n      font-size: clamp(16px, 1.65vw, 22px);\n      line-height: 1.3;\n    }\n\n    dd {\n      box-sizing: border-box;\n      display: grid;\n      height: 74px;\n      margin: 0;\n      place-items: center;\n      border: 2px solid #b3afb7;\n      background: #fff;\n      color: #29252d;\n      font-size: clamp(22px, 2.35vw, 31px);\n    }\n\n    .array dt {\n      margin-bottom: 6px;\n    }\n\n    .array > div + div dd {\n      border-left: 0;\n    }\n\n    .array > div:first-child dd {\n      border-radius: 5px 0 0 5px;\n    }\n\n    .array > div:last-child dd {\n      border-radius: 0 5px 5px 0;\n    }\n\n    .variable {\n      display: grid;\n      justify-items: center;\n      gap: 5px;\n    }\n\n    .variable dt {\n      grid-row: 2;\n    }\n\n    .variable dd {\n      grid-row: 1;\n      width: clamp(96px, 10vw, 126px);\n      border-radius: 5px;\n      font-size: clamp(20px, 2vw, 28px);\n    }\n\n    .variable.pointer dd {\n      color: var(--purple);\n    }\n\n    .written dd {\n      border-color: var(--purple);\n      background: var(--purple-tint);\n      color: var(--purple);\n    }\n\n    .written dt {\n      color: var(--purple);\n      font-weight: 700;\n    }\n\n    .arrows {\n      position: absolute;\n      inset: 0;\n      width: 100%;\n      height: 100%;\n      overflow: visible;\n      color: var(--purple-line);\n      pointer-events: none;\n    }\n\n    .arrows path[hidden] {\n      display: none;\n    }\n\n    .status {\n      min-height: 3em;\n      margin: 18px 0 0;\n      color: var(--purple);\n      font: 700 clamp(15px, 1.55vw, 19px) / 1.5 var(--serif);\n      text-align: center;\n    }\n\n    button {\n      padding: 0.38em 1.05em;\n      border: 1px solid var(--purple-line);\n      border-radius: 5px;\n      background: #fff;\n      color: var(--purple);\n      font: 700 clamp(16px, 1.55vw, 21px) / 1.35 var(--serif);\n      cursor: pointer;\n    }\n\n    button:hover,\n    button.selected {\n      background: var(--purple-tint);\n    }\n\n    button:focus-visible {\n      outline: 2px solid var(--purple);\n      outline-offset: 3px;\n    }\n\n    @media (max-width: 830px) {\n      main {\n        grid-template-columns: minmax(0, 1fr);\n        row-gap: 32px;\n      }\n\n      .panel {\n        grid-row: auto;\n        grid-template-rows: auto auto;\n        gap: 14px;\n      }\n\n      .visual {\n        grid-row: 1;\n      }\n    }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain aria-label=\"数组中的指针运算\">\n    \u003csection class=\"panel\" aria-labelledby=\"file-1\">\n      \u003cfigure>\n        \u003cfigcaption id=\"file-1\">5-1.c\u003c/figcaption>\n        \u003cpre>\u003ccode>#include &lt;stdio.h&gt;\nint main()\n{\n\tint a[]={10,20,30};\n\t\u003cspan data-step=\"1\">\u003cb>int\u003c/b> *p=a;\u003c/span>\n\t\u003cspan data-step=\"2\">p++;\u003c/span>\n\t\u003cspan data-step=\"3\">\u003cb>int\u003c/b> q=*p+1;\u003c/span>\n\t\u003cspan data-step=\"4\">printf(\"%d\",q);\u003c/span>\n\treturn 0;\n}\u003c/code>\u003c/pre>\n      \u003c/figure>\n      \u003cbutton type=\"button\" data-run=\"value\" aria-label=\"单步运行 5-1.c\">单步运行\u003c/button>\n    \u003c/section>\n\n    \u003csection class=\"panel visual\" aria-label=\"数组和变量\">\n      \u003cdiv class=\"diagram\">\n        \u003cdiv class=\"memory\">\n          \u003cdl class=\"array\" aria-label=\"数组 a\">\n            \u003cdiv>\u003cdt>a[0]\u003c/dt>\u003cdd>10\u003c/dd>\u003c/div>\n            \u003cdiv>\u003cdt>a[1]\u003c/dt>\u003cdd>20\u003c/dd>\u003c/div>\n            \u003cdiv>\u003cdt>a[2]\u003c/dt>\u003cdd>30\u003c/dd>\u003c/div>\n          \u003c/dl>\n          \u003cdl class=\"variables\">\n            \u003cdiv class=\"variable\" data-variable=\"p\">\u003cdt>p\u003c/dt>\u003cdd>—\u003c/dd>\u003c/div>\n            \u003cdiv class=\"variable\" data-variable=\"q\">\u003cdt>q\u003c/dt>\u003cdd>—\u003c/dd>\u003c/div>\n          \u003c/dl>\n          \u003csvg class=\"arrows\" aria-hidden=\"true\">\n            \u003cdefs>\n              \u003cmarker id=\"arrowhead\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\">\n                \u003cpath d=\"M 0 0 L 10 5 L 0 10 Z\" fill=\"currentColor\" />\n              \u003c/marker>\n            \u003c/defs>\n            \u003cg fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.25\" marker-end=\"url(#arrowhead)\">\n              \u003cpath id=\"arrow-p\" hidden />\n              \u003cpath id=\"arrow-q\" hidden />\n            \u003c/g>\n          \u003c/svg>\n        \u003c/div>\n        \u003cp class=\"status\" role=\"status\">选择一侧开始\u003c/p>\n      \u003c/div>\n      \u003cbutton type=\"button\" id=\"reset\">复位\u003c/button>\n    \u003c/section>\n\n    \u003csection class=\"panel\" aria-labelledby=\"file-2\">\n      \u003cfigure>\n        \u003cfigcaption id=\"file-2\">5-2.c\u003c/figcaption>\n        \u003cpre>\u003ccode>#include &lt;stdio.h&gt;\nint main()\n{\n\tint a[]={10,20,30};\n\t\u003cspan data-step=\"1\">\u003cb>int\u003c/b> *p=a;\u003c/span>\n\t\u003cspan data-step=\"2\">(*p)++;\u003c/span>\n\t\u003cspan data-step=\"3\">\u003cb>int\u003c/b> *q=p+1;\u003c/span>\n\t\u003cspan data-step=\"4\">printf(\"%d\",*q);\u003c/span>\n\treturn 0;\n}\u003c/code>\u003c/pre>\n      \u003c/figure>\n      \u003cbutton type=\"button\" data-run=\"address\" aria-label=\"单步运行 5-2.c\">单步运行\u003c/button>\n    \u003c/section>\n  \u003c/main>\n  \u003cscript>\n    const frames = {\n      value: [\n        {p: 0, written: \"p\", message: \"p 存入首元素的地址。\"},\n        {p: 1, written: \"p\", message: \"p 前进一格，指向 a[1]。\"},\n        {p: 1, q: \"21\", written: \"q\", message: \"*p + 1 先读出 20，再加 1，把 21 存入 q。\"},\n        {p: 1, q: \"21\", message: \"读取 q，输出 21。\"}\n      ],\n      address: [\n        {p: 0, written: \"p\", message: \"p 存入首元素的地址。\"},\n        {p: 0, first: \"11\", written: \"a[0]\", message: \"a[0] 从 10 加到 11，p 仍指向 a[0]。\"},\n        {p: 0, q: 1, first: \"11\", written: \"q\", message: \"p + 1 算出 a[1] 的地址，存入 q。\"},\n        {p: 0, q: 1, first: \"11\", message: \"顺着 q 读取 a[1]，输出 20。\"}\n      ]\n    };\n\n    const initial = {message: \"选择一侧开始\"};\n    const memory = document.querySelector(\".memory\");\n    const cells = memory.querySelectorAll(\".array dd\");\n    const variables = Array.from(memory.querySelectorAll(\"[data-variable]\"), box => {\n      const name = box.dataset.variable;\n      return {name, box, value: box.querySelector(\"dd\"), arrow: memory.querySelector(\"#arrow-\" + name)};\n    });\n    const runButtons = document.querySelectorAll(\"[data-run]\");\n    const status = document.querySelector(\".status\");\n    let mode = null;\n    let step = 0;\n\n    function positionArrows() {\n      const bounds = memory.getBoundingClientRect();\n      const frame = mode ? frames[mode][step - 1] : initial;\n      for (const variable of variables) {\n        if (variable.arrow.hasAttribute(\"hidden\")) continue;\n        const source = variable.value.getBoundingClientRect();\n        const target = cells[frame[variable.name]].getBoundingClientRect();\n        const x1 = source.left + source.width / 2 - bounds.left;\n        const x2 = target.left + target.width / 2 - bounds.left;\n        const y1 = source.top - bounds.top;\n        const y2 = target.bottom - bounds.top + 4;\n        const bend = (y1 - y2) * 0.53;\n        variable.arrow.setAttribute(\"d\", `M ${x1} ${y1} C ${x1} ${y1 - bend}, ${x2} ${y2 + bend}, ${x2} ${y2}`);\n      }\n    }\n\n    function render() {\n      const frame = mode ? frames[mode][step - 1] : initial;\n      cells[0].textContent = frame.first ?? \"10\";\n      cells[0].parentElement.classList.toggle(\"written\", frame.written === \"a[0]\");\n      for (const variable of variables) {\n        const content = frame[variable.name];\n        const isPointer = typeof content === \"number\";\n        variable.value.textContent = isPointer ? `&a[${content}]` : (content ?? \"—\");\n        variable.box.classList.toggle(\"pointer\", isPointer);\n        variable.box.classList.toggle(\"written\", variable.name === frame.written);\n        variable.arrow.toggleAttribute(\"hidden\", !isPointer);\n      }\n\n      for (const button of runButtons) {\n        const active = button.dataset.run === mode;\n        button.classList.toggle(\"selected\", active);\n        for (const line of button.closest(\".panel\").querySelectorAll(\"[data-step]\")) {\n          line.classList.toggle(\"current\", active && Number(line.dataset.step) === step);\n        }\n      }\n\n      status.textContent = mode ? `${step}/${frames[mode].length}　${frame.message}` : frame.message;\n      positionArrows();\n    }\n\n    for (const button of runButtons) {\n      button.addEventListener(\"click\", () => {\n        const nextMode = button.dataset.run;\n        step = mode === nextMode && step \u003c frames[nextMode].length ? step + 1 : 1;\n        mode = nextMode;\n        render();\n      });\n    }\n\n    document.querySelector(\"#reset\").addEventListener(\"click\", () => {\n      mode = null;\n      step = 0;\n      render();\n    });\n\n    window.addEventListener(\"resize\", positionArrows);\n    render();\n  \u003c/script>\n\u003c/body>\n\u003c/html>\n"},
    {"name":"P11","title":"用指针遍历数组并读入整数","html":"\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003ctitle>用指针遍历数组并读入整数\u003c/title>\n  \u003cstyle>\n    :root {\n      --purple: #56268a;\n      --line: #8a5cb1;\n      --tint: #f7f1fc;\n      --gray: #77747c;\n      --serif: \"Noto Serif SC\", \"Source Han Serif SC\", \"Songti SC\", SimSun, \"宋体\", serif;\n      --mono: Consolas, \"Courier New\", monospace;\n    }\n\n    body {\n      margin: 0;\n      background: #fff;\n      font-family: var(--serif);\n    }\n\n    main {\n      box-sizing: border-box;\n      display: grid;\n      grid-template-columns: minmax(0, 1fr) minmax(0, 1.24fr);\n      align-content: center;\n      width: min(100%, 1340px);\n      min-height: 100svh;\n      margin-inline: auto;\n      padding: 34px clamp(20px, 5vw, 70px);\n      gap: 24px clamp(32px, 6vw, 88px);\n    }\n\n    .panel {\n      display: grid;\n      grid-row: span 2;\n      grid-template-rows: subgrid;\n      justify-items: center;\n      align-items: center;\n      min-width: 0;\n    }\n\n    figure {\n      margin: 0;\n      max-width: 100%;\n    }\n\n    figcaption {\n      margin-bottom: 0.8em;\n      color: var(--purple);\n      font-size: clamp(16px, 1.65vw, 24px);\n      font-weight: 700;\n    }\n\n    pre {\n      margin: 0;\n      color: var(--gray);\n      font: 400 clamp(16px, min(2.15vw, 4.3vh), 30px) / 1.55 var(--mono);\n      tab-size: 4;\n    }\n\n    code {\n      font-family: var(--mono);\n    }\n\n    pre code {\n      font: inherit;\n    }\n\n    .current {\n      outline: 1.5px solid var(--line);\n      outline-offset: 0.13em;\n      border-radius: 2px;\n      background: var(--tint);\n      color: #000;\n    }\n\n    .current .format {\n      color: #af2424;\n    }\n\n    .demo {\n      width: min(100%, 500px);\n    }\n\n    .diagram {\n      position: relative;\n      font-family: var(--mono);\n    }\n\n    .array {\n      display: grid;\n      grid-template-columns: repeat(3, minmax(0, 1fr));\n      width: 78%;\n      margin: 0;\n      text-align: center;\n    }\n\n    dt {\n      color: var(--gray);\n      font-size: clamp(16px, 1.6vw, 22px);\n    }\n\n    dd {\n      box-sizing: border-box;\n      display: grid;\n      height: 66px;\n      margin: 0;\n      place-items: center;\n      border: 2px solid #b3afb7;\n      background: #fff;\n      color: #29252d;\n      font-size: clamp(22px, 2.2vw, 30px);\n    }\n\n    .array dt {\n      margin-bottom: 7px;\n    }\n\n    .array > div + div dd {\n      border-left: 0;\n    }\n\n    .array > div:first-child dd {\n      border-radius: 5px 0 0 5px;\n    }\n\n    .array > div:last-child dd {\n      border-radius: 0 5px 5px 0;\n    }\n\n    .array .written dd {\n      position: relative;\n      outline: 2px solid var(--purple);\n      outline-offset: -2px;\n      background: var(--tint);\n      color: var(--purple);\n    }\n\n    .array .written dt {\n      color: var(--purple);\n      font-weight: 700;\n    }\n\n    .array .long-value {\n      font-size: clamp(10px, 1.25vw, 16px);\n    }\n\n    .end {\n      position: absolute;\n      top: 0;\n      left: 78%;\n      padding-left: 10px;\n      color: var(--gray);\n      font-size: clamp(14px, 1.5vw, 20px);\n      white-space: nowrap;\n    }\n\n    .end.active {\n      color: var(--purple);\n      font-weight: 700;\n    }\n\n    .end::before {\n      position: absolute;\n      top: 32px;\n      left: 4px;\n      height: 62px;\n      border-left: 1px dashed currentColor;\n      content: \"\";\n    }\n\n    .pointer {\n      display: grid;\n      justify-items: center;\n      gap: 5px;\n      width: 78%;\n      margin: 65px 0 0;\n    }\n\n    .pointer dt {\n      grid-row: 2;\n    }\n\n    .pointer dd {\n      grid-row: 1;\n      width: 118px;\n      height: 54px;\n      border-radius: 5px;\n      color: var(--purple);\n      font-size: clamp(
